<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Movie Theater" />
    <!-- Build marker. There is no other way to tell from outside which build prod is actually
         running: index.html's script tags only name the entry bundle, the app is code-split so the
         interesting chunks are lazily imported, and minification strips comments — so "is my change
         live?" turned into grepping every served chunk for a string literal (2026-07-24). This meta
         tag is served uncached and unminified, so a single fetch answers it.

         It carries the COMMIT SHA and the build's UTC timestamp, stamped by the `mt-build-marker`
         plugin in vite.config.js. It used to be a hand-bumped date string, which meant it read
         `2026-08-25-tsx` before AND after every deploy for a week — a marker that cannot distinguish
         a landed rollout from a failed one, sitting at the top of the deploy skill's verification
         toolbox inviting a false "verified" (found 2026-09-02, after the facet-rail deploy). Do not
         put the build id anywhere but index.html: the byte-compare recipe (deploy-db-ops) depends on
         a local `npm run build` reproducing prod's CONTENT-HASHED chunk names, and a SHA baked into
         the JS would change every chunk hash on every commit and break it. -->
    <meta name="mt-build" content="%MT_BUILD%" />
    <!-- Favicons. The .ico (16/32/48) is the legacy + Windows path and is also what bare
         /favicon.ico probes get; the SVG is preferred by every current browser and is the one
         that stays sharp on hi-dpi tabs. sizes="32x32" on the .ico stops browsers assuming
         it's 16-only and picking it over the SVG. Sources live in public/; regenerate the
         rasters from favicon.svg if the artwork changes. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Movie Theater</title>
    <style>
      /* Paint the app background and a centered spinner from the very first frame — before the CSS/JS
         bundles parse — so there's no white flash and no different-colored loading box. React replaces
         #root's contents on mount. */
      html, body { margin: 0; background: #f5f5f5; }
      #root { min-height: 100vh; }
      .app-boot { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .app-boot-spin {
        width: 40px; height: 40px; border-radius: 50%;
        border: 4px solid #d9d9de; border-top-color: #1890ff;
        animation: app-boot-rot 0.8s linear infinite;
      }
      @keyframes app-boot-rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="app-boot"><div class="app-boot-spin"></div></div></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
