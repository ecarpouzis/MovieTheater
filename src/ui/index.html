<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Movie Theater" />
    <!-- Build marker. There is currently NO way to tell from outside which build prod is actually
         running: index.html's script tags only name the entry bundle, the app is code-split so the
         interesting chunks are lazily imported, and minification strips comments — so "is my change
         live?" turned into grepping every served chunk for a string literal (2026-07-24). This meta
         tag is served uncached and unminified, so a single fetch answers it. Bump the date whenever
         you want an unambiguous "did the rollout actually happen" probe. -->
    <meta name="mt-build" content="2026-08-13-photos-album-ui" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Movie Theater</title>
    <style>
      /* Paint the app background and a centered spinner from the very first frame — before the CSS/JS
         bundles parse — so there's no white flash and no different-colored loading box. React replaces
         #root's contents on mount. */
      html, body { margin: 0; background: #f5f5f5; }
      #root { min-height: 100vh; }
      .app-boot { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .app-boot-spin {
        width: 40px; height: 40px; border-radius: 50%;
        border: 4px solid #d9d9de; border-top-color: #1890ff;
        animation: app-boot-rot 0.8s linear infinite;
      }
      @keyframes app-boot-rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="app-boot"><div class="app-boot-spin"></div></div></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
