# Arcade WebRTC UDP socket buffers — roadmap WS-A.1 (the same-host N64 packet-loss root cause).
#
# CloudRetro already requests a 16 MiB SO_RCVBUF/SO_SNDBUF on its single-port WebRTC mux socket
# (pkg/network/socket/socket.go: SetReadBuffer/SetWriteBuffer(16*1024*1024) — upstream at our pinned
# SHA 13852a7, so NO fork patch is needed for this). BUT the Linux kernel SILENTLY CLAMPS a
# setsockopt(SO_RCVBUF) request to net.core.rmem_max, whose distro default is ~208 KiB — and
# CloudRetro discards the setsockopt error (`_ =`). So without this file the mux runs on a ~208 KiB
# buffer, and a burst of inbound RTP (every N64 title bursts) overruns it → the NACK storm we see.
#
# The arcade workers are `network_mode: host` inside the Ubuntu-24.04 WSL2 distro, so they share the
# DISTRO's net namespace — these distro-level sysctls govern their sockets. 25165824 (24 MiB, LiveKit's
# value) gives headroom above CloudRetro's 16 MiB request so it lands unclamped.
#
# INSTALL ON ZIGGY (one-time; the distro runs systemd, so systemd-sysctl re-applies it every boot):
#   distro=Ubuntu-24.04
#   wsl -d $distro -u root -- bash -lc \
#     'cp /mnt/<repo>/docker/arcade/99-arcade-udp-buffers.conf /etc/sysctl.d/ && sysctl --system'
#   # verify it took (must print 25165824, not 212992):
#   wsl -d $distro -u root -- sysctl net.core.rmem_max net.core.wmem_max
#
# Also check the Hyper-V vSwitch firewall on the Windows host (mirrored networking routes worker UDP
# through it); default-inbound-block there is another same-host-loss suspect:
#   Get-NetFirewallHyperVVMSetting -Name '{...}'   # DefaultInboundAction
#   Set-NetFirewallHyperVVMSetting -Name '{...}' -DefaultInboundAction Allow   # if it was Block
#
# Verify the whole WS-A.1 fix with the test-roms skill: NACK count on a 10-min N64 session (e.g.
# Mario Kart 64) before vs after — same-host was where the loss lived (off-network was already clean).

net.core.rmem_max = 25165824
net.core.wmem_max = 25165824
