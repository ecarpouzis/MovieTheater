# CloudRetro core configuration for the MovieTheater arcade (docs/arcade-plan.md Appendix B2).
#
# The flat "knobs" (public IP, WS origin, per-worker WebRTC port) are set via CLOUD_GAME_* env vars
# in docker-compose.yml — they are awkward to express as deep-nested YAML. THIS file carries the one
# thing env vars can't cleanly express: the libretro core list. Loader search order (Appendix B1):
# explicit path → cwd → configs/ → ~/.cr; the compose mounts this into the loader's path.

coordinator:
  server:
    address: ":8000"
  origin:
    # The WS Origin check — this is the PAGE origin that opens the socket (the site), NOT arcade.*.
    userWs: "https://theater.carpouzis.com"
  selector: ""        # "" = any free worker; "ping" only matters for multi-zone deployments
  debug: false        # true adds room ids to GetWorkerList — handy in Phase 0, off in prod

library:
  basePath: /roms     # mount point of the read-only ROM volume (per-system subfolders live here)
  # watchMode re-scans the library when files appear/vanish under basePath (fsnotify). It's the fast
  # path for JIT-materialized ROMs (docs/arcade-jit-cache.md). BUT fsnotify does not reliably fire
  # across a Windows-host → WSL2 bind mount, so the worker image also carries the scan-on-miss patch
  # (docker/arcade/patches/0001-jit-scan-on-miss.patch) as the reliable fallback. Both are harmless
  # together — watchMode picks up new games instantly when it works; the patch guarantees a launch
  # never fails just because the boot-time scan predated the extraction.
  watchMode: true

emulator:
  autosaveSec: 60     # crashes lose ≤1 min
  storage: /saves     # save-state dir — mounted rw and included in Ziggy's backups
  libretro:
    # Raw .dat/.srm, NOT zip-wrapped (CloudRetro default is true). Required so SRAM is portable to
    # EmuDeck/RetroArch and the gateway save store can seed/harvest raw files (docs/arcade-saves-plan.md).
    # (pcsx `uniqueSaveDir: true` for per-session PS1 memory cards is added later, with S1.)
    saveCompression: false
    cores:
      repo:
        sync: true    # auto-download listed cores from buildbot.libretro.com/nightly — no manual core files
      list:
        # The stock defaults already ship: nestopia, snes9x (multitap → 5 players), mgba,
        # mupen64plus_next (N64, isGlAllowed), fbneo (arcade), dosbox_pure. We ADD PS1 + Genesis below.
        #
        # Merge semantics CONFIRMED from pkg/config/loader.go: the loader stacks this file onto the
        # embedded default config in one koanf instance, which deep-merges maps per-key — so these
        # entries ADD to the default core list (a same-named key like `pcsx` overrides just that
        # entry); nestopia/snes9x/mupen64plus_next etc. survive. Cheap sanity check at first boot:
        # the game list in the INIT (t=4) message should span every system you dropped ROMs for.
        # N64 renders GL (bottom-left origin) → the frame is flipped. CloudRetro only tells the client to
        # flip it if coreAspectRatio is on: WITHOUT it, the game-start response sends av:null and the
        # client never learns to flip → upside down. Turning it on populates `av` (incl. Flip:true), which
        # our shim applies as scaleY(-1). (Core-behavior fields restated so the merge keeps them.)
        n64:
          lib: mupen64plus_next_libretro
          roms: ["n64", "v64", "z64"]
          isGlAllowed: true
          usesLibCo: true
          # vfr OFF: variable frame timing produced juddery presentation in the browser — a steady
          # ~16% of frame intervals landed at ~50ms (measured via rVFC pacing histogram) and the
          # compositor dropped ~6%. Fixed 60Hz cadence paces the encoder/RTP timestamps evenly.
          vfr: false
          coreAspectRatio: true
          options:
            # 2x internal render resolution — only viable on the GPU worker (gliden64 on the 4070 Ti
            # via D3D12); llvmpipe couldn't afford it. The core outputs 640x480, so the encoded
            # stream is 640x480 too (VP8 encode cost ~4x, fine at friends-scale).
            mupen64plus-43screensize: "640x480"
            # Framebuffer readback — the core defaults ship these Off, which renders framebuffer
            # effects BLACK (Bomberman 64's whole intro movie) or wrong (DKR uses FB/depth tricks).
            # Async color copy + software depth copy are the standard gliden64 compat settings;
            # cost is trivial on a real GPU.
            mupen64plus-EnableCopyColorToRDRAM: "Async"
            mupen64plus-EnableCopyDepthToRDRAM: "Software"
            # Legacy (fast, inaccurate) blending ships ON in the core defaults — with it, Bomberman
            # 64's intro cinematic renders as flat color planes with no geometry on the D3D12 path.
            mupen64plus-EnableLegacyBlending: "False"
            # Cutscenes/cinematics often composite via auxiliary color buffers. With this on,
            # Bomberman 64's attract/intro scenes render (mine-cart, snow demo — were flat planes).
            # KNOWN LIMIT: its STORY cinematics (Adventure opening movie) still render as flat
            # clear-color planes — every gliden64 FB option was tried (CopyColor To/From, CopyDepth,
            # CopyAux, LegacyBlending); a real fix needs LLE RSP/RDP or a renderer fix on D3D12.
            # In-engine gameplay/menus/training all render correctly; Battle mode has no cinematics.
            mupen64plus-EnableCopyAuxToRDRAM: "True"

        # 2D cores: stream at 3x with nearest-neighbour (the pipeline's default scaler) instead of
        # native 256x224 — the browser's bilinear stretch of a tiny stream is what read as "fuzzy
        # SNES", and no encoder preset can fix that. 768x672 crisp pixels cost NVENC nothing.
        # (These merge INTO the default core entries per-key — lib/roms/etc. survive.)
        snes:
          scale: 3
        nes:
          scale: 3
        gba:
          scale: 3
        # Game Boy / Game Boy Color via mgba (same lib as GBA). The stock config only exposes gba+gbc
        # roms under the `gba` folder; the JIT catalog files per system (gb/, gbc/), so give each its own
        # core+folder. mgba plays all three. scale:3 for the same crispness rationale as the other 2D cores.
        gb:
          lib: mgba_libretro
          folder: gb
          roms: ["gb"]
          scale: 3
        gbc:
          lib: mgba_libretro
          folder: gbc
          roms: ["gbc"]
          scale: 3

        pcsx:
          lib: pcsx_rearmed_libretro
          roms: ["m3u", "cue", "chd"]   # m3u = multi-disc playlist (disc-swap, patch 0005); cue/chd = single disc
          folder: psx
          # QUALITY (docs/arcade-quality-plan.md Phase 1). At native 256x240 the H.264 4:2:0 chroma plane
          # sits BELOW the native pixel grid — colour bleeds across every hard edge and no bitrate recovers
          # it. A nearest 2x upscale before encode puts chroma back at >= native res, and costs almost no
          # bitrate (an integer nearest upscale adds no high-frequency detail: the encoder sees flat 2x2
          # blocks). scaleMethod is pinned because a multi-tap method would blur the pixels we're preserving.
          scale: 2
          scaleMethod: nearest-neighbour
          options:
            pcsx_rearmed_drc: enabled     # dynarec on
            # CloudRetro's EMBEDDED default sets frameskip_type: auto, so PS1 was allowed to DROP frames on
            # a 13700K that never needs to. "disabled" is pcsx_rearmed's own default.
            pcsx_rearmed_frameskip_type: disabled
            # Present a DualShock (dual-analog) pad on BOTH ports. pcsx_rearmed defaults pad type to the
            # digital "standard" pad, so games that REQUIRE an analog controller refuse to start —
            # Ape Escape literally blocks on "connect an analog controller (DUAL SHOCK)". The browser shim
            # already forwards both analog sticks (cloudRetroClient.js encodeInput's lx/ly/rx/ry), so a
            # DualShock is the right default: digital games still read the d-pad, analog games get sticks.
            pcsx_rearmed_pad1type: dualshock
            pcsx_rearmed_pad2type: dualshock
            # PS1 MEMORY CARD. pcsx_rearmed picks each slot's card type from these options (load_memcards
            # in frontend/libretro.c). If the frontend doesn't SUPPLY the option, the core's GET_VARIABLE
            # call fails, it logs "non memcardN config?" and boots with NO card — which is exactly what we
            # hit: games reported "Memory Card not found" and no .srm was ever written (so nothing to
            # harvest). CloudRetro passes only the options we declare here and does not apply the core's own
            # "libretro" default, so we must set it explicitly. "libretro" exposes card 1 through
            # RETRO_MEMORY_SAVE_RAM, so CloudRetro persists it as <roomId>.srm and the gateway save vault
            # harvests it per-user — the SAME path already proven for N64 battery saves. This is why the old
            # `uniqueSaveDir: true` was removed: the card now rides SAVE_RAM, not the on-disk save dir (which
            # was container-ephemeral anyway), so there is nothing per-session left to scope. Card 2 cannot
            # be "libretro" (only card 1 maps to SAVE_RAM) and any file-based card would land in that
            # ephemeral dir, so it is "none" — effectively every PS1 game here uses card 1 only.
            pcsx_rearmed_memcard1: libretro
            pcsx_rearmed_memcard2: none
        gen:
          # lib name verified live 2026-07-03 (Sonic 2 streams).
          lib: genesis_plus_gx_libretro
          roms: ["md", "gen", "smd", "bin"]
          folder: genesis
          scale: 3   # 320x224 native -> 960x672 nearest (was 2; matches snes/nes, costs NVENC nothing)

        # ARCADE (fbneo). The site's `arcade` system ingests into roms/mame and launches via the core key
        # `mame` (ArcadeIngestCommand.cs:242) — the STOCK CloudRetro entry, which we had never overridden:
        #   1. No `scale` → 6,214 games encoded at raw 304x224, chroma below native (see the pcsx note).
        #   2. Stock pins `scaleMethod: bilinear2`. Adding `scale` WITHOUT overriding that would upscale
        #      through a blurry multi-tap filter — worse than before, while looking like it worked.
        # lib/folder/roms restated so the koanf deep-merge can't surprise us.
        mame:
          lib: fbneo_libretro
          folder: mame
          roms: ["zip"]
          scale: 3              # 304x224 -> 912x672
          scaleMethod: nearest-neighbour

        # ─── GPU / GL 3D cores (same D3D12 + NVENC path proven by n64/psx) ────────────────────
        # GL cores MUST set isGlAllowed (HW render) AND coreAspectRatio: without the latter the
        # GAME_START `av` payload is null and the client never learns to flip the bottom-left-origin
        # GL frame → upside down (exact n64 lesson). Cores auto-download via repo.sync (no rebuild).
        #
        # PSP: no BIOS required. Ad-hoc multiplayer is unsupported in libretro → 1-player rooms
        # (set MaxPlayers 1 at ingest, like our n64 solo rooms).
        psp:
          lib: ppsspp_libretro
          folder: psp
          roms: ["iso", "cso", "pbp", "chd"]
          isGlAllowed: true
          coreAspectRatio: true
          # SAVE-DIR CORE. ppsspp saves to a virtual Memory Stick (PSP/SAVEDATA/…) — a FILE TREE in the
          # core's save dir, NOT RETRO_MEMORY_SAVE_RAM — so it never makes a .srm the flat harvest can see.
          # uniqueSaveDir scopes that tree to coresaves/<sessionId>/ on the shared saves mount, and the
          # gateway tars it into the user's vault + seeds it back on resume (SaveStore.HarvestCoreSaveDir).
          # Requires the compose bind mount of <saves>/coresaves onto .../libretro/legacy_save. Same story
          # for dc/naomi/atomiswave (flycast VMU) below.
          uniqueSaveDir: true
          options:
            # 2x native (480x272 → 960x544) internal render; downsampled encode reads crisp.
            ppsspp_internal_resolution: "960x544"
        # Dreamcast: needs dc_boot.bin + dc_flash.bin in the BIOS mount. Genuinely 2-player
        # (fighters/sports/Power Stone) — the best fit yet for the shared-room model.
        dc:
          lib: flycast_libretro
          folder: dc
          roms: ["chd", "gdi", "cdi", "cue"]
          isGlAllowed: true
          coreAspectRatio: true
          uniqueSaveDir: true   # flycast VMU is a file tree → coresaves/<sessionId>/ → gateway harvest (see psp)
        # Naomi + Atomiswave arcade ride the same flycast core (need naomi.zip / awbios.zip in the
        # BIOS mount). Cores wired now (cheap); stage + verify AFTER Dreamcast proves flycast on D3D12.
        naomi:
          lib: flycast_libretro
          folder: naomi
          roms: ["zip", "chd", "lst", "dat", "bin"]
          isGlAllowed: true
          coreAspectRatio: true
          uniqueSaveDir: true   # flycast NVRAM/VMU → coresaves/<sessionId>/ → gateway harvest (see psp)
        atomiswave:
          lib: flycast_libretro
          folder: atomiswave
          roms: ["zip", "chd"]
          isGlAllowed: true
          coreAspectRatio: true
          uniqueSaveDir: true   # flycast NVRAM/VMU → coresaves/<sessionId>/ → gateway harvest (see psp)

        # GameCube via dolphin_libretro. GL 3D core like psp/dc/ps2: same isGlAllowed + coreAspectRatio
        # Flip contract, usesLibCo thread-affinity, vfr:false (correct game speed), skip_hw_context_destroy
        # teardown hack. No BIOS required — Dolphin HLE-boots the GC IPL. Source ROMs are .gcz (Dolphin's
        # compressed format, R:\Roms\Games\Nintendo GameCube), read directly by the core → RomCache COPIES
        # the .gcz into roms/gc/ on first play (plain-file branch, like ps2 .cso), never a 7z extract.
        # 4 controller ports (MaxPlayers 4 at ingest) — a strong fit for the shared-room model.
        gc:
          # OUR PATCHED BUILD (docker/arcade/dolphin-createsharedcontext.patch): implements
          # GLContextLR::CreateSharedContext. Upstream's external-context path inherits the base's
          # nullptr (Common/GL/GLContext.cpp:45), and Dolphin's async-shader threads dereference it —
          # the 0xc0000005. That nullptr is the ONLY reason async shaders were ever off, so mode "2"
          # below and this lib are a package: the stock core MUST run mode "0" or it crashes at boot.
          # The custom lib NAME pins it against repo.sync nightly overwrites, and keeps the stock core
          # beside it as an instant rollback (lib: dolphin_libretro + shader_compilation_mode "0").
          # Build recipe: D:\Arcade\build\dolphin\build-core.bat.
          #
          # ⚠ THE CUSTOM CORE WAS ONCE BLAMED FOR THE "GX SLOWDOWN" AND THAT VERDICT WAS WRONG
          # (retired 07-11, exonerated 07-13). It was never a deoptimized build. Dolphin's per-game
          # .uidcache had been written by the STOCK core, and the two builds emit different UID BYTES
          # for the same pipeline (different compilers ⇒ different struct padding; the UIDs are
          # compared with memcmp). So the custom core read ~1,947 foreign uids, matched none, and
          # recompiled every one of them INLINE ON THE EMULATOR THREAD — every session, forever. That
          # is the 25 ms retro_run with one core pegged and the GPU idle. Measured on an identical
          # replay: stale uidcache = +54 MB of cache growth per run; uidcache removed = +568 KB.
          # The trap that hid it for weeks: .uidcache lives NEXT TO User/Cache/Shaders/, not inside
          # it, so every "clear the shader cache" left the poison in place. coreCache below now makes
          # this structurally impossible — do not remove it.
          lib: dolphin_custom_libretro
          folder: gc
          roms: ["gcz", "iso", "rvz", "ciso", "gcm", "m3u"]
          isGlAllowed: true
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          # A pipeline cache is only readable by the exact core BUILD that wrote it (see above). The
          # worker hashes the core library and stamps the cache with that identity; a core meeting a
          # stamp that isn't its own throws the cache away instead of trying to read it. Only these
          # entries are dropped — Dolphin's memory cards live under this same User tree (User/GC) and
          # must survive a core swap, so nothing here sweeps broadly.
          coreCache:
            dir: "User/Cache"
            purge: ["Shaders", "*.uidcache"]
          # skip_serialize_size_probe (patch 0016): dolphin defers video/emu init to context_reset +
          # first retro_run, so the load-time retro_serialize_size probe walks save-state into a NULL
          # g_vertex_manager → 0xc0000005. The probe only feeds a log line; saves re-query at save time.
          hacks: [skip_hw_context_destroy, skip_serialize_size_probe]
          # Render efb_scale 3 (1920x1584), deliver 1280x1056: supersampled on TOP of 4x MSAA. The
          # race-slowdown hunt exonerated resolution entirely (races dipped identically at efb 2 and
          # 3, because the cause was a poisoned pipeline cache — see lib above), so quality stands.
          scale: 0.6667
          scaleMethod: bilinear2
          options:
            # OpenGL backend so Dolphin draws into CloudRetro's GL (WGL) hw-render context. A Vulkan/D3D
            # backend renders to a private device the GL capture never sees -> black frame (the ps2
            # pcsx2_renderer:OpenGL lesson). Native internal res for the first boot to prove the path on
            # the 4070 Ti; raise dolphin_efb_scale once it renders.
            dolphin_renderer: "Hardware"
            dolphin_cpu_core: "JIT64"
            # OPTION VALUES are the core-options-v2 VALUE strings, NOT the display labels (verified against
            # DolphinLibretro/Common/Options.cpp @287ab2dba6): efb_scale = "1".."6" (labels "1x Native
            # (640x528)" etc are display-only). An unmatched value leaves the port's typed cache at T{}=0
            # → retro_get_system_av_info returns 0x0 geometry → null video objects → 0xc0000005 at boot.
            # THAT was the gc boot crash. shader_compilation_mode: "0"=Synchronous "1"=Sync(Uber)
            # "2"=Async(Uber) "3"=Async(Skip Rendering).
            # efb_scale "2" = 1280x1056, verified 60fps/0-drop. NOTE: dolphin TEARDOWN can wedge the worker
            # (partial deadlock — /echo alive, coordinator WS dead) at ANY scale (reproduced at "1" too);
            # the GL Worker Watchdog task auto-recycles a wedged worker within ~60s. Real fix = debug the
            # teardown deadlock (dump: scratchpad worker-hung-27168.dmp).
            # "3" (paired with scale: 0.6667 above — supersampled to 1280x1056 on the wire).
            dolphin_efb_scale: "3"
            # 4x MSAA. The ONLY core where MSAA measurably does anything: A/B'd on RAW pre-encode frames
            # (patch 0022) over 3 runs each, the share of edges that are HARD fell 6.29% -> 4.08%, with no
            # overlap between the groups. n64 (gliden64) and psp (ppsspp) produce BIT-IDENTICAL frames with
            # their MSAA options on or off — libretro's hw_render FBO isn't multisampled, and only Dolphin's
            # OGL backend manages its own framebuffers. Values: 0 None, 1/2/3 = 2x/4x/8x MSAA, 4/5/6 = SSAA.
            #
            # This is invisible from the browser: H.264 quantization erases the sub-pixel edge gradients AA
            # creates. Never A/B anti-aliasing on the decoded stream.
            # 4x MSAA (briefly "0" as a slowdown diagnostic, and exonerated: the dips were identical
            # with MSAA off — the cause was the poisoned pipeline cache, see lib above).
            dolphin_anti_aliasing: "2"
            # 16x anisotropic. Not an AA operation, so hardShare can't score it — what it does show is
            # RETAINED texture detail: on dc the same measurement moved mid-frequency edges +7% with no
            # meaningful hard-edge change. Values are numeric: 0=1x(off) 1=2x 2=4x 3=8x 4=16x.
            dolphin_max_anisotropy: "4"
            # NOT set on purpose: dolphin_force_true_color and dolphin_disable_copy_filter are already
            # default-ON in this libretro port — proven by deleting GFX.ini and regenerating it with the
            # options absent from this config (ForceTrueColor=True, DisableCopyFilter=True). Setting them
            # would be a no-op; leaving this note so nobody "adds" them again (docs §17). Also learned:
            # F-Zero GX boots are NOT frame-deterministic (raw dumps differ run-to-run), so dolphin
            # verdicts need GFX.ini/behavioural evidence, not raw-frame A/B.
            # SINGLE-THREADED CPU, but shaders are ASYNC now: the nullptr CreateSharedContext that
            # forced sync compiles is exactly what our patched lib implements (see lib above). env 44
            # (SET_HW_SHARED_CONTEXT) stays granted — it is what lets the core make those contexts.
            # DUAL-CORE IS A DEAD END FOR F-ZERO GX — settled 2026-07-10 late, after a ~15-minute
            # "enabled" experiment kept logging "CPU Thread separate = No": Dolphin's OWN game INI
            # (Sys/GameSettings/GFZ.ini) sets `CPUThread = False` for GFZ* and the game-local config
            # layer overrides our base option. Upstream forbids dual-core for this game (it EFB-peeks
            # constantly — the same INI's Video_Hacks note). So the 07-09 "dual-core ON" round never
            # actually engaged for GX either, and per the per-ROM-fixes rule the emulator's DB wins:
            # this stays disabled (flipping it only affects OTHER GC titles, untested). The real
            # lever for GX's heavy-moment dips is EFB work ∝ internal resolution — see efb_scale.
            dolphin_main_cpu_thread: "disabled"
            # "2" = Async (Ubershaders): a specialized shader compiles on SHARED-CONTEXT worker
            # threads (which only exist because of our patched lib) while an ubershader draws the
            # frame in the meantime — so a first-sight effect costs a slightly more expensive frame
            # instead of a stall and an audio skip. The 07-11 rollback to "0" blamed mode 2 for the
            # GX slowdown; that was the poisoned uidcache, not the mode (see lib above).
            #
            # ⚠ wait_for_shaders MUST BE "disabled" HERE, AND THAT IS NOT A TUNING CHOICE — IT IS
            # WHAT KEEPS GC ROOMS FROM FAILING TO START. It means "precompile shaders before
            # starting" (ShaderCache::InitializeShaderCache → WaitForAsyncCompiler). Under mode 2 the
            # init ALSO queues the entire ubershader permutation set, so on a cold cache that wait is
            # minutes — and the whole boot runs INLINE inside the coordinator's StartGame RPC
            # (HandleGameStart → app.Load → retro_load_game → context_reset). Blow that call's
            # deadline and nothing gets canceled: the worker keeps booting and registers its room
            # while the coordinator has already freed the slot and told the player "the arcade is
            # full". A 60s ceiling now covers slow boots (coordinator.GameStartTimeout), but the real
            # reason this is safe is that there is nothing left to wait FOR — precompiling is exactly
            # what async ubershaders exist to avoid. The compile work still happens, in the
            # background, on the worker threads, while the game is already playable.
            #
            # Sync mode ("0") is the stock core's only option and DOES want wait_for_shaders enabled
            # (its stalls are otherwise visible). It carries the same cold-cache boot risk, just more
            # rarely — it never queues the ubershader set.
            dolphin_shader_compilation_mode: "2"
            dolphin_wait_for_shaders: "disabled"


        # ─── Sega family on the genesis_plus_gx core we already load (the gb/gbc pattern: one lib,
        # distinct folders). Master System / Game Gear / SG-1000 are BIOS-free; Sega CD needs a
        # region BIOS (bios_CD_U.bin etc.) in the BIOS mount. ──────────────────────────────────
        sms:
          lib: genesis_plus_gx_libretro
          folder: sms
          roms: ["sms"]
          scale: 3
        gg:
          lib: genesis_plus_gx_libretro
          folder: gg
          roms: ["gg"]
          scale: 4   # 160x144 native — needs more upscale than the console cores
        sg1000:
          lib: genesis_plus_gx_libretro
          folder: sg1000
          roms: ["sg"]
          scale: 3
        segacd:
          lib: genesis_plus_gx_libretro
          folder: segacd
          roms: ["cue", "chd", "iso"]
          scale: 3   # was 2 — 320x224 native, matches gen

        # ─── Other 2D cores (each pins its folder so extension collisions can't cross-load) ──────
        sega32x:
          lib: picodrive_libretro
          folder: sega32x
          roms: ["32x", "bin"]
          scale: 3   # was 2 — 320x224 native, matches gen
        pce:
          # mednafen_pce (full) covers TurboGrafx-16 / PC Engine + SuperGrafx + PCE-CD (syscard3.pce).
          lib: mednafen_pce_libretro
          folder: pce
          roms: ["pce", "sgx", "cue", "chd"]
          scale: 3
        ngpc:
          lib: mednafen_ngp_libretro
          folder: ngpc
          roms: ["ngp", "ngc"]
          scale: 4
        wsc:
          lib: mednafen_wswan_libretro
          folder: wsc
          roms: ["ws", "wsc", "pc2"]
          scale: 4
        a2600:
          lib: stella_libretro
          folder: a2600
          roms: ["a26", "bin"]
          scale: 3
        a7800:
          lib: prosystem_libretro
          folder: a7800
          roms: ["a78"]
          scale: 3
        lynx:
          # mednafen_lynx needs lynxboot.img in the BIOS mount.
          lib: mednafen_lynx_libretro
          folder: lynx
          roms: ["lnx"]
          scale: 4
        vb:
          lib: mednafen_vb_libretro
          folder: vb
          roms: ["vb", "vboy"]
          scale: 3
        fds:
          # Famicom Disk System via nestopia; needs disksys.rom in the BIOS mount.
          lib: nestopia_libretro
          folder: fds
          roms: ["fds"]
          scale: 3
        neogeo:
          # Neo Geo AES/MVS romsets via fbneo (the arcade core); needs neogeo.zip in the BIOS mount.
          # Finicky (parent romset grind) — stage last.
          lib: fbneo_libretro
          folder: neogeo
          roms: ["zip"]
          scale: 3   # was 2 — 304x224 native, matches the mame entry above

encoder:
  video:
    # h264 = NVENC on the 4070 Ti (nvh264enc via list.h264 below) — encoding off the CPU entirely,
    # the concurrency lever (Part B). Needs the pinned image built with patch 0003 (nvcodec plugin +
    # the h264 pipeline case) and the GPU worker env (/usr/lib/wsl/lib on LD_LIBRARY_PATH provides
    # libnvidia-encode/libcuda). INSTANT FALLBACK: set codec back to vp8 (software, always works).
    codec: h264
    threads: 0
    keyframeInterval: 300   # vpx-only; the h264 keyframe cadence is gop-size in list.h264 params
  list:
    # Merges INTO the embedded default list (opus/vp8/vp9 survive — same koanf deep-merge as cores).
    h264:
      encoder: nvh264enc
      # gop-size=120 → an IDR every 2s @60fps: late joiners (invitees mid-game) get a picture fast
      # (CloudRetro ignores RTCP PLI, so periodic keyframes are the ONLY join-sync mechanism).
      # repeat-sequence-header puts SPS/PPS on every IDR so those joiners can actually decode it.
      # p4 + 8Mbps: p1 (fastest preset) at 4Mbps read visibly fuzzy on pixel-art (SNES); NVENC has
      # huge headroom at this resolution, and LAN/loopback doesn't care about 8Mbps. bitrate=kbit/s.
      params: "preset=p4 tune=ultra-low-latency rc-mode=cbr bitrate=8000 gop-size=100000 repeat-sequence-header=true zerolatency=true"
      caps: video/x-h264,stream-format=byte-stream,alignment=au
    # Opus with in-band FEC ON — the audio-skip fix for lossy same-host N64 rooms (roadmap WS-A.2).
    # CloudRetro's EMBEDDED default (pkg/config/config.yaml) is
    #   audio-type=restricted-lowdelay complexity=8 bitrate=96000 frame-size=5
    # and we inherited it because we set no `opus` entry here. That default makes FEC a SILENT NO-OP:
    # restricted-lowdelay forces Opus into CELT-only mode and 5 ms frames are sub-10 ms — LBRR (the
    # redundant previous-frame copy that IS Opus in-band FEC) exists ONLY in SILK/hybrid at >=10 ms
    # frames. So even though Pion's SDP already offers useinbandfec=1, the encoder emitted no LBRR.
    # This override is the whole fix (config-only — buildAudioPipeline already threads Params, and
    # reads frame-size back to time the RTP frames): application AUDIO (generic, not lowdelay) re-enables
    # SILK/hybrid, inband-fec=true + packet-loss-percentage~15 makes Opus embed LBRR sized for ~15% loss,
    # frame-size=10 clears the >=10 ms LBRR floor with the least added audio latency (was 5, sub-floor).
    # Video already survives loss via retransmit (0 freezes); this closes the audio gap. Verify with the
    # test-roms skill: audio concealment/skip events on a 10-min N64 room, off-network vs same-host.
    opus:
      encoder: opusenc
      params: "audio-type=generic inband-fec=true packet-loss-percentage=15 frame-size=10 complexity=8 bitrate=96000"
  audio:
    codec: opus

storage:
  provider: ""              # s3 is only for multi-box save sharing — not us
