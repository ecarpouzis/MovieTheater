# CloudRetro config for the Windows-native GL worker (roadmap WS-B, docs/arcade-windows-worker.md).
#
# This worker runs natively on Windows (MSYS2/UCRT64 build of ./cmd/worker) to get REAL NVIDIA
# OpenGL (WGL on a hidden window → GL 4.6 compat) for the GL 3D cores that WSLg's GLX/EGL can't
# host (flycast: dc/naomi/atomiswave, ppsspp: psp). It joins the SAME WSL coordinator
# (localhost:8000) but in a separate zone ("gl") so 2D/N64 rooms never land on it and vice-versa.
#
# The flat knobs (zone, singlePort, iceIpMap, coordinator, and the Windows paths) are set via
# CLOUD_GAME_* env in scripts/register-arcade-glworker-task.ps1 — this file carries the core list +
# encoder, exactly like docker/arcade/config.yaml does for the WSL stack. Run:
#   worker.exe --w-conf <dir containing this file renamed config.yaml>
# ⚠VERIFY at first boot (docs/arcade-windows-worker.md acceptance): NVIDIA GL 4.x context in the log,
# nvcodec present (else set encoder.video.codec: vp8), cores download from the windows/x86_64 buildbot.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# THIS FILE IS AUTHORITATIVE. It is the config BOTH GL worker tasks run — but each worker has its
# OWN ConfDir (worker-gl, worker-gl-2), and MUST: they would otherwise seed and harvest each other's
# memory cards (see cardVault below). Deploy this same file into each of them.
# It had drifted badly once: the repo copy lost the ps2/gc/2D core blocks that existed only on the
# worker box, so a redeploy would have silently reverted live tuning. Reconciled 2026-07-08.
#
#   Deploy:  cp docker/arcade/config.worker-gl.yaml D:/ArcadeStorage/worker-gl/config.yaml
#            AND  D:/ArcadeStorage/worker-gl-2/config.yaml   ← BOTH. Every ConfDir gets every file.
#            then recycle each worker with scripts/recycle-arcade-glworker.ps1 -WorkerId N (the runner
#            loop respawns in ~4s). Workers read config ONLY at startup.
#            ⚠ Do NOT `Stop-Process worker -Force` to recycle. A force-kill of a GL/NVENC worker can
#            strand a kernel-stuck GPU-teardown thread → an UNKILLABLE zombie holding this ConfDir
#            locked (the PID-7948 class, 2026-07-15). The recycle script stops it GRACEFULLY (stop-file
#            sentinel), forces only as a fallback, and VERIFIES the kill.
#            (An earlier version of this note also claimed a force-kill dumps PCSX2's shader cache —
#            RETRACTED 2026-07-15: the cache appends immediately on compile, kills lose nothing. The
#            zombie risk above is the sole reason for the graceful path. docs/arcade-stuntman-plan.md)
#
#   ⚠ The SAME applies to game-overrides.json (per-game fps/core-option fixes, written by
#     `arcade-gameconfig-export -o <ConfDir>/game-overrides.json`). It is resolved from the worker's
#     CWD, i.e. PER ConfDir — export it into EVERY one. It was empty in worker-gl and absent from
#     worker-gl-2 (2026-07-13), which is harmless only while the manifest is empty: the moment a game
#     needs a fix, it would apply or not depending on which worker the coordinator happened to pick.
#     (Per-ROM fixes normally ride the emulators' OWN databases; this manifest is the exception path.)
#
# Edit HERE, then deploy. Never hand-edit the copy on D: — that is how the drift started.
# ⚠ Keep this plain UTF-8, no BOM. The D: copy had accumulated 27 mojibake sequences from a
#   PowerShell write with the wrong encoding; repaired during the reconcile.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

coordinator:
  origin:
    userWs: "https://theater.carpouzis.com"

library:
  # Native Windows path — NO /mnt/d translation on this worker. Overridable via CLOUD_GAME_LIBRARY_BASEPATH.
  basePath: "D:/ArcadeStorage/roms"
  watchMode: true
  # Room ids carry the SITE's system code (ArcadeGame.System), and the worker resolves the ROM
  # inside that system so a name shared with another system can't be launched by mistake (patch
  # 0037). It scopes by ROM sub-folder, which IS the site's code for every system except these
  # two. Add a line here whenever a new system's folder name differs from its site code —
  # otherwise it silently falls back to the old, unscoped, cross-system lookup.
  systemAliases:
    ps1: psx      # site "ps1"    -> roms/psx   (core key "pcsx")
    arcade: mame  # site "arcade" -> roms/mame  (core key "mame")

emulator:
  # GL ZERO-COPY (3D cores only: n64/gc/ps2/psp/dc). Hand the encoder the texture the core just
  # rendered instead of pulling every frame back to system memory with glReadPixels.
  #
  # The readback is SYNCHRONOUS and runs on the EMULATOR THREAD, so the core blocks on it. Measured
  # (CLOUD_GAME_GL_READBACK_STATS=1, which is still there for the A/B):
  #   GameCube (F-Zero GX)  1920x1584  11.6 MB/frame   p50 3.7-4.2ms  p95 6-8ms   max 14ms
  #   N64 (Mario Kart 64)   1920x1440  10.5 MB/frame   p50 3.0-3.2ms  p95 5.3-5.8ms
  # i.e. the core sat idle for ~a QUARTER of a 60fps frame budget, up to half at p95. Note the cores
  # render far LARGER than we encode (efb_scale / internal res), so the readback was ~11 MB/frame, not
  # the 1280x1056 we ship.
  #
  # nvav1enc takes video/x-raw(memory:GLMemory) in RGBA directly, so the frame never leaves VRAM:
  # appsrc(GLMemory) ! glcolorscale ! nvav1enc — no download, no upload, no videoconvert. The core's
  # frame is copied GPU->GPU into a small texture pool first (graphics/zerocopy.go) so the core can
  # render the next frame immediately without racing the encoder.
  #
  # Software (2D) cores ignore this entirely — their frames are already in system memory, there is
  # nothing to keep on the GPU. The capture lane has its own zero-copy (capture.zeroCopy).
  # ROLLBACK: set false. The readback path is untouched and stays the A/B baseline.
  glZeroCopy: true
  # autosave RE-ENABLED 2026-07-12. Without it the ONLY write to disk is a graceful room close, so a
  # killed or crashed worker loses the whole session — that is not theoretical: a worker restart mid-race
  # cost a player ~18 min of a race game (all three re-boots logged "Arcade save none (fresh)"), and the
  # known exit-139/exit-1 teardowns would do the same to any player. Autosave gives the gateway a recent
  # <roomId>.dat to harvest into the vault even when the process dies without a goodbye.
  #
  # It was 0 because the autosave path AV'd (glworker-2.log 2026-07-05, 0xc0000005 at autosave(0x3c)):
  # SaveState called retro_serialize_size DIRECTLY on the autosave goroutine — off the emulator's libco
  # thread — and PPSSPP's serialize_size touches live emu state. Worker patch 0030 FIXED exactly that
  # (serialize AND its size probe now run on the core's own thread), so the reason for 0 is stale.
  #
  # 120s, not 60: a serialize STOPS the emulator for its duration, and the GL cores' states are big
  # (Dolphin ~122 MB, PCSX2 ~50 MB) — flycast (dc) is documented to hitch on it. 120s halves the hitch
  # count while still bounding a crash's cost to two minutes. Autosave writes the CONTINUE slot (0); it
  # can never touch a player's Save, which lives in the reserved quicksave slot (SaveStore.QuickSlot).
  autosaveSec: 120
  storage: "D:/ArcadeStorage/saves"    # overridable via CLOUD_GAME_EMULATOR_STORAGE

  # (Wedge handling is NOT a tunable and deliberately has no knob here. A room closes when its last
  #  player leaves — an event, not a timer — and the coordinator is now told the moment that happens
  #  rather than after the core finishes tearing down, so a hung core can no longer keep this worker
  #  marked BUSY. See Room.Close in patch 0041.)

  # Per-user VIRTUAL MEMORY CARDS (patch 0039). A card is the one save class libretro never exposes —
  # PCSX2 and Dolphin write theirs into their own dirs — so until now it was ONE file shared by every
  # player, outside the save vault and unbacked. For some games the card IS the progress: Gauntlet
  # Dark Legacy keeps its named characters on the GameCube card, not in the save-state.
  #
  # The worker does the seed/harvest because only it knows which card dir is in play (the COORDINATOR
  # picks the worker, so the gateway can't know) and it runs one room at a time. That is why each GL
  # worker now has its OWN ConfDir — two workers sharing one would seed and harvest each other's cards.
  #
  # Paths are "<root>:<relpath>", root = save or system. NOTE the save root is the dir the CORES see,
  # <ConfDir>/libretro/legacy_save (nanoarch.go), NOT `storage:` above — that one holds CloudRetro's
  # own room-keyed save-states. Get this wrong and you vault an empty directory forever.
  #
  # ONLY the card moves. Everything else in these dirs is shared, disposable, or sacred: the save dir
  # also holds Dolphin's ~850 MB of shader cache and PPSSPP's config, and dc's card sits IN the BIOS
  # dir. If the last path element contains a wildcard the card is that FILE SET rather than the whole
  # directory (patch 0041) — that is the only safe way to express dc.
  cardVault: "D:/ArcadeStorage/cards"      # <vault>/<userId>/<system>/
  cards:
    gc:  "save:User/GC"                    # Dolphin: <region>/Card A/*.gci
    ps2: "system:pcsx2/memcards"           # PCSX2: Mcd001.ps2 / Mcd002.ps2
    psp: "save:PSP/SAVEDATA"               # PPSSPP memstick: ms0:/PSP/SAVEDATA/<TITLEID>. Deliberately
                                           # NOT PSP/SYSTEM (ppsspp.ini + CACHE) or PSP/PPSSPP_STATE.
    dc:  "system:dc/vmu_save_*.bin"        # flycast VMUs A1-D1 — loose files sharing the Dreamcast
                                           # BIOS dir (dc_boot.bin, dc_flash.bin, data/), so this MUST
                                           # stay a glob. A dir spec here would vault the BIOS per user
                                           # and overwrite it on the next seed.
                                           # dc_nvmem.bin is machine state (clock/language), not a
                                           # card: it stays shared on purpose.
  libretro:
    saveCompression: false
    cores:
      repo:
        sync: true    # per-OS: pulls windows/x86_64 .dll cores from buildbot.libretro.com/nightly
      list:
        # PS1 leaks onto this pool when zoning is off (ArcadeZoningEnabled=false): the coordinator hands a
        # PSX room to any free worker. Without a pcsx entry the core falls back to the binary's EMBEDDED
        # default, which supplies NO memory-card option → pcsx logs "non memcard config?" and boots with no
        # card. Mirror the WSL pool's PS1 fix (docker/arcade/config.yaml) so a leaked PSX room works here too:
        # memcard1=libretro exposes card 1 via RETRO_MEMORY_SAVE_RAM (.srm), dualshock pads for analog games.
        # ── PS1 on Beetle PSX HW / VULKAN (W8, 2026-07-16) — LIVE. Hardware Vulkan renderer (parallel-psx):
        # real 3D + internal upscale, replacing pcsx_rearmed's software enhancement. Negotiation v2/no-callbacks
        # -> v1 create_device, zero-copy ACTIVE, NO synthetic surface needed. CTR renders 60fps/640x480 moving,
        # SotN survives its hi-res intro + mode changes (caps-reneg handles the varying delivered sizes).
        #
        # ⚠ THE SCANLINE OPTIONS BELOW ARE LOAD-BEARING — DO NOT REMOVE. Without them beetle FROZE at the
        # BIOS->game transition (~frame 147): its display_height collapsed to 1-2 lines (video_cb 1400x4 /
        # 560x2), sub-16px-guarded to a dead stream (root-caused live with CLOUD_GAME_VK_DEBUG + beetle source
        # rhi_lib_vulkan.c:7104 display_height = last_scanline - initial_scanline + 1). Cause: beetle's
        # core-options-v2 default for last_scanline is a bad first-value token ("210", not the C default 239),
        # and the unset option collapsed the range at the transition — the "values not labels" / embedded-default
        # class (dolphin patch 0016, pcsx frameskip). Pinning the full NTSC/PAL scanline window fixes it. See
        # RESULTS-vulkan-w3.md §W8-LIVE.
        #
        # ROLLBACK to the healthy software path: lib: pcsx_rearmed_libretro + drop hwContext/isGlAllowed/vfr/
        # usesLibCo + scaleMethod: nearest-neighbour + options {pcsx_rearmed_drc:enabled, frameskip_type:disabled,
        # pad1type/pad2type:dualshock, memcard1:libretro, memcard2:none, neon_enhancement_enable:enabled,
        # neon_enhancement_tex_adj_v2:enabled}. pcsx_rearmed stays on the fleet (repo.sync).
        pcsx:
          lib: mednafen_psx_hw_libretro
          roms: ["m3u", "cue", "chd"]
          folder: psx
          isGlAllowed: false          # Vulkan by default (see hwContext); GL zero-copy arming stays off
          hwContext: "vulkan"         # PS1 renders on Beetle PSX HW's Vulkan renderer via the capture path
          coreAspectRatio: true       # hw core reports av geometry (Flip contract) — see the psp/gc note
          vfr: false                  # correct game speed (matches ps2/n64/psp/dc/gc capture arms)
          usesLibCo: true             # retro_run + context_reset on one cothread (Vulkan-capture brings the
                                      # device up there). Non-libco crashed the worker (exit 2), live.
          # beetle pins base at PSX native (System A/V >>> 320x240 (1400x1152)) and puts internal-res in
          # max_width (the flycast pattern): scale:2 makes base(320x240)x2 == the 2x internal frame a
          # passthrough (patch 0015 caps-reneg), so full hardware detail reaches NVENC. Delivered sizes vary
          # by PSX display mode (1400x960 / 560x480 / ...); the caps-reneg tracks each.
          scale: 2
          scaleMethod: bilinear2
          options:
            beetle_psx_hw_renderer: "hardware_vk"   # Vulkan renderer (VALUE token verified from the DLL)
            beetle_psx_hw_internal_resolution: "2x" # 640x480-class hardware upscale (raise per-title later)
            # SUPER_SAMPLING enabled (2026-07-17) — FLASH FIX for SotN's death-sprite transparency artifact.
            # Confirmed live (Eric "dog death now" + log: NO geometry event at the kill) that the flash is
            # beetle-hw rendering PSX semi-transparency WRONG at 2x internal res. Supersampling renders high
            # then composites/downsamples so transparency is correct. Tradeoff: some sharp-upscale look for
            # correct blending. ⚠ changes beetle's OUTPUT geometry class (downsamples) — verified on probe it
            # composes with the Vk zero-copy path. Rollback (flash A/B step 1): "disabled".
            beetle_psx_hw_super_sampling: "enabled"
            beetle_psx_hw_pgxp_mode: "disabled"     # PGXP off round 1 (geometry correction; per-title later)
            beetle_psx_hw_enable_memcard1: "enabled" # memcard 1 via RETRO_MEMORY_SAVE_RAM (.srm)
            # ⚠ SCANLINE WINDOW — pin the FULL range explicitly (see the block header). beetle's unset-option
            # default collapsed display_height at the game transition and froze the stream.
            beetle_psx_hw_initial_scanline: "0"
            beetle_psx_hw_last_scanline: "239"
            beetle_psx_hw_initial_scanline_pal: "0"
            beetle_psx_hw_last_scanline_pal: "287"
            # crop_overscan REVERTED to disabled (2026-07-17). Enabling it did NOT fix the pillarbox (Eric
            # confirmed bars still present + they CHANGE as SotN switches modes) — the bars are NOT beetle's
            # overscan border; they are our GPU scale step fitting each varying-width mode (560/800/1120) into
            # the fixed encode with mode-dependent letterbox/pillarbox (the real bars fix is the scaler, not
            # here). Reverted to the original known-good. (Flip to "enabled" only if a future overscan case
            # actually needs it.)
            beetle_psx_hw_crop_overscan: "disabled"
        # GL 3D cores only — this pool exists for these. isGlAllowed + coreAspectRatio are the Flip
        # contract (without coreAspectRatio the GAME_START av payload is null and the client renders
        # the bottom-left-origin GL frame upside down — the exact n64 lesson). Mirror of the WSL
        # config's GPU-core block; keep in lockstep with CloudRetroHost.ZoneForSystem's "gl" list.
        psp:
          # STOCK core is LIVE — and that is a deliberate choice, not a default. Eric's read from real play:
          # stock feels snappier in general LocoRoco play; the custom core removes a RARE audio crackle but
          # trades a little of that general responsiveness. Stock wins the everyday case, so it ships; the
          # custom core is BUILT, staged, and switch-ready for anyone who wants the no-crackle trade.
          #
          # ── The custom core (docker/arcade/ppsspp-custom-core.patch + ppsspp-build-core.bat) ──
          # Built the buildbot's way: libretro/Makefile + MSVC, static /MT — NOT CMake, NEVER MinGW. It
          # exists because Common/MachineContext.h blanket-disables the machine context for ANY libretro
          # build, even on Windows x64 where CONTEXT + AddVectoredExceptionHandler are available, so
          # InstallExceptionHandler() fails, fastmem has no AV-rescue handler, and a stray guest access is a
          # raw 0xC0000005 that kills the worker — which is exactly what pins STOCK to IR JIT + fastmem=off.
          # The patch re-enables the handler for AMD64 only (safe: Memory::HandleFault declines any fault
          # whose PC is outside PPSSPP's own jit buffer), so the custom core can run real JIT + fastmem.
          # Earlier "custom is 20% slower / has ~1 s stalls" verdicts were RETRACTED measurement artifacts
          # (CMake /MD build; investigator's own file scans). The Makefile /MT build is at throughput PARITY.
          #
          # ── What the crackle actually is (measured 2026-07-14, pace-diag II + client WebRTC stats) ──
          # An audio UNDERRUN, downstream of the emulator: a core stall (savedata LIST/load, first-use VFPU
          # LUT read, a heavy screen like the World Map) drops audio the client then conceals
          # (concealedSamples up, packetsLost 0). The audio-mastered REPAY pacer (fork 1d3aa7c) already
          # killed the SUSTAINED crackle — what's left is a RARE single-event underrun when one stall
          # momentarily exceeds the ~150 ms jitter buffer. Custom's only edge here is HEADROOM (lower
          # meanTick shaves the worst tails); it is NOT a throughput win. The stock-vs-custom rare-crackle
          # RATE is still un-quantified — an idle box won't reproduce it and a local test browser contends
          # on Ziggy and fabricates stalls (see the arcade-benchmark-isolation memory).
          #
          # ── Switch to custom (all THREE lines move together) ──
          #   lib: ppsspp_custom_libretro   +   ppsspp_cpu_core: "JIT"   +   ppsspp_fast_memory: "enabled"
          # The custom lib NAME pins it against repo.sync nightly overwrites (same trick as dolphin).
          lib: ppsspp_libretro
          folder: psp
          roms: ["iso", "cso", "pbp", "chd"]
          # ── VULKAN ARM (W3, docs/arcade-vulkan-w3w4w5-spec.md) — PROPOSED, gated ──
          # PPSSPP's Vk backend has lower driver overhead + steadier frame pacing than GL; the win we
          # want is HEADROOM (a lower/steadier tick shaves the rare crackle's worst tails — see the
          # crackle note below). Flip = these TWO lines only; the whole GL arm (stock lib, IR JIT,
          # fastmem off, audioMaster, vfr, usesLibCo, hacks, scale, all options) is UNCHANGED and
          # renderer-orthogonal — cpu_core stays pinned to IR JIT + fastmem off on the stock lib either
          # way (the renderer is a frontend hw-context choice, not a CPU one). PPSSPP has NO renderer
          # core-option, so this is the ONLY way to put psp on Vulkan (verified: no ppsspp_renderer/
          # gpu_backend option key in the DLL) — the frontend's hwContext IS the whole selection, and a
          # per-GAME GL escape must use the explicit hwContext:"gl" override field (W3 F1), not a core
          # option. Rollback one-liner: isGlAllowed: true  +  delete the hwContext line.
          #
          # ⚠ NEEDS worker.w3fix.exe (the vk_synthetic_surface fix) — see the hacks note below. The audit
          # blocker was CONFIRMED LIVE 2026-07-16 (psp Daxter): PPSSPP armed vk, created its device with
          # our VK_NULL_HANDLE surface, then crashed 0xC0000005 right after "Creating Vulkan surface for
          # window (data1=0 data2=0)" — its LibretroVulkanContext echoes the frontend surface handle back
          # through its swapchain warp and queries surface caps on it through the REAL driver, and a null
          # handle AVs there. FIXED in the fork (commit 0baec66): behind the vk_synthetic_surface hack the
          # frontend hands the core a real hidden-window VkSurfaceKHR. Re-probe on worker.w3fix.exe:
          # expect "synthetic headless surface created", "hw render context: Vulkan", zero-copy ACTIVE,
          # 60 t/s, close ×5 clean. See RESULTS-vulkan-w3.md §W3.1-LIVE.
          isGlAllowed: false          # Vulkan by default (see hwContext); GL zero-copy arming stays off
          hwContext: "vulkan"         # psp renders on PPSSPP-Vk via the Vulkan-capture path
          coreAspectRatio: true
          # audioMaster (patch 0043). PPSSPP declares 44100 Hz and delivers ~43850 (733 samples/frame
          # where its own fps + rate imply 735.7). The pacer's fps floor always beats that slow audio
          # clock, so the core under-feeds the Opus encoder by ~250 samples/sec, forever — the client's
          # audio buffer drains in ~15 s and the player hears a faint crackle. audioMaster lets the audio
          # clock pull the loop slightly above the fps floor (bounded 2%) so the core produces exactly
          # what the encoder consumes. gc does NOT need this: Dolphin emits the 533.9 samples/frame it
          # promises, which is why GameCube is clean in the same browser.
          # ⚠ THIS LINE LIVES HERE, NOT IN config.yaml. Commit 44ff8cd put it in config.yaml only — the
          # retired CPU/docker config that NOTHING reads — so it reached the live worker solely as an
          # undocumented hand-edit, and was lost the moment this file was deployed over it (2026-07-14).
          audioMaster: true
          # vfr OFF (matches the working N64 mupen entry): the default vfr:true timestamps each encoded
          # frame by its VARIABLE wall-clock delta, which on this path plays back too fast (Sonic Adventure
          # ran double-speed, Patapon/LocoRoco unplayable). Fixed cadence paces the RTP timestamps to the
          # core's real fps → correct game speed.
          vfr: false
          # REQUIRED for GL cores (matches the working N64 mupen entry): libco runs context_reset AND
          # retro_run on ONE cooperative thread. Without it, nanoarch's non-LibCo path runs context_reset
          # at init on one thread but retro_run with per-frame LockOSThread/BindContext on another — GL
          # objects made in context_reset are then used cross-thread → 0xc0000005 crash at "Starting graphics".
          usesLibCo: true
          # CAPTURED-CRASH FIX (glworker.log 2026-07-05, Exception 0xc0000028 STATUS_BAD_STACK
          # "during external code execution"): at teardown nanoarch's deinitVideo() calls the core's
          # hw_render.context_destroy on the SMALL fixed-size libco coroutine stack; PPSSPP's destroy
          # recurses into the NVIDIA GL driver (nvoglv64.dll) deep enough to blow that stack → the
          # worker crashed (exit 2) and every player on it "disconnected". skip_hw_context_destroy is
          # the core-author-documented remedy ("May help with crashes, for example, with PPSSPP" —
          # config.yaml hacks doc): we skip the core's per-object GL free and let glCtx.Deinit() drop
          # the whole context immediately after (driver frees everything) — safe at teardown.
          #
          # PPSSPP CANNOT BE SERIALIZED, EITHER WAY — MEASURED, 2026-07-13 (patch 0041). Both paths lose:
          #   * WITHOUT skip_same_thread_save (serialize on the core's libco cothread, the path patch
          #     0030 built and that mupen/flycast use happily): the SAVE works — a PSP room wrote a 40 MB
          #     state and closed cleanly — but the core then wedges. 6 of 7 rooms booted (modules loaded,
          #     FBO created, encoder running with peers=1) and the emulation thread simply stopped:
          #     zero frames, zero pace-diag, forever. A wedge is WORSE than a crash — it pins the worker.
          #   * WITH it (serialize off-thread, below): PPSSPP access-violates in retro_serialize_size
          #     (0xC0000005) — which patch 0039's autosave turned into a crash every 120s.
          # So the core streams reliably only if it is NEVER serialized: keep the hack AND turn states
          # off (noSaveStates). PSP's progress is its MEMSTICK SAVE, which the card vault now carries
          # per-user (cards.psp), so nothing is actually lost — this is the same bargain the real console
          # made. Revisit only with a PPSSPP build whose savestates work under libretro.
          # skip_serialize_size_probe: with noSaveStates the probe's result is DEAD — nothing ever
          # serializes this core — yet the boot probe still calls retro_serialize_size, the exact
          # function documented two lines up as access-violating here (0xC0000005). It only ever fed
          # a log line ("Save file size: 128.0 MiB"). Keeping a known-fragile call for a value we
          # discard is pure downside, so don't make it. (Same reasoning as dolphin's, patch 0016.)
          #
          # ── hacks UNDER VULKAN (W3.2) ── hacks are UNCHANGED for the Vk arm, deliberately. On the Vk
          # teardown path (nanoarch.go deinitVideoVulkan) skip_hw_context_destroy makes us skip the
          # core's context_destroy, matching the PROVEN paraLLEl-GS/PS2 pattern (leak the core's Vulkan
          # objects into a device we then destroy — accepted, verified clean on back-to-back rooms).
          # NOTE the GL-stack rationale above (context_destroy recurses into nvoglv64.dll and blows the
          # small libco stack) is renderer-SPECIFIC and does NOT apply on Vk — PPSSPP's Vk ContextDestroy
          # is just WaitUntilQueueIdle + Vulkan object frees, and the 64 MiB same_thread stack (patch
          # 43cb002) covers it anyway. So DROPPING skip_hw_context_destroy on the Vk arm (to let PPSSPP
          # free its own Vulkan objects cleanly before device destroy) is a valid, arguably-cleaner
          # alternative — but the close ×5 gate decides. Keep it for the first arm (conservative + proven);
          # revisit only if reuse leaks or a close wedges. skip_same_thread_save + noSaveStates are
          # renderer-agnostic (PPSSPP still can't serialize on Vk) — keep. See RESULTS-vulkan-w3.md §W3.2.
          #
          # ── vk_synthetic_surface (W3.1 fix, REQUIRED for the Vulkan arm; needs worker.w3fix.exe) ──
          # PPSSPP's libretro Vulkan context demands a non-null VkSurfaceKHR (it echoes the frontend handle
          # back through its swapchain warp and queries surface caps on it through the real driver). Our
          # headless frontend passed VK_NULL_HANDLE → 0xC0000005 at boot (CONFIRMED LIVE 2026-07-16). This
          # hack makes the frontend create a real hidden-window surface and hand it to create_device. It is
          # opt-in and inert on ps2/n64 (they never touch a surface). REMOVE this hack if psp ever rolls
          # back to GL (isGlAllowed: true) — it is meaningless on the GL path.
          hacks: [skip_hw_context_destroy, skip_same_thread_save, skip_serialize_size_probe, vk_synthetic_surface]
          noSaveStates: true
          # SUPERSAMPLING (patch 0023). MSAA is INERT on this core — libretro's hw_render FBO isn't
          # multisampled, so ppsspp/mupen64plus produce BIT-IDENTICAL frames with it on or off (only
          # Dolphin, which owns its framebuffers, really multisamples). The AA that DOES work here is to
          # render big and average down: `scale` < 1 shrinks. Measured on raw frames from the same source
          # image, 1920x1440 -> 960x720: hard edges 2.112% (nearest) vs 1.792% (bilinear2), a 15% drop.
          # ⚠ A fractional scale MUST be paired with a smooth scaleMethod — downscaling with nearest
          # point-samples and ALIASES rather than anti-aliases.
          # Render 1920x1088 (4x native), deliver 960x544: pure AA, no extra bitrate. ~0.64 CPU core.
          scale: 0.5
          scaleMethod: bilinear2
          options:
            ppsspp_internal_resolution: "1920x1088"
            # IR JIT — the only SAFE cpu_core on the STOCK lib, because stock has no exception handler, so
            # fastmem's benign faults become hard 0xc0000005 crashes in retro_run. Software address
            # translation; stable and fast enough on the 13700K. Move to "JIT" ONLY with the custom lib +
            # fast_memory: enabled (all three together — see the lib: note above).
            ppsspp_cpu_core: "IR JIT"
            # 16x anisotropic (docs/arcade-quality-plan.md §17). dc/gc/ps2 all ship aniso; psp was the
            # one 3D core without it. Not an AA op — what it retains is texture detail at oblique
            # angles (the dc measurement: mid-frequency edges +7%, hard edges unchanged). Value token
            # "16x" read out of the DLL's option string table (it sits in the aniso value cluster),
            # not guessed — libretro silently ignores unmatched values, the recurring lesson.
            # Verified live: Daxter 960x540, 30fps content rate, 0 freezes/drops, no ppsspp crash.
            ppsspp_texture_anisotropic_filtering: "16x"
            # Core-author option: "gets rid of some visual artifacts" from unnecessary bilinear on 2D
            # UI/text elements — the PSP renders a lot of native-res 2D that plain filtering smears.
            ppsspp_smart_2d_texture_filtering: "enabled"
            # DISABLED on stock, and it MUST stay that way: the fastmem AV-rescue handler is compiled out of
            # the stock nightly (MachineContext.h's empty __LIBRETRO__ branch) and IR JIT does not bypass
            # fastmem, so the first stray guest access is a raw host access violation that kills the worker —
            # which is why the core's own option text calls "enabled" Unstable. Only the custom lib installs
            # the handler; enable this ONLY there (all three lines together — see the lib: note above).
            ppsspp_fast_memory: "disabled"
        dc:
          lib: flycast_custom_libretro
          folder: dc
          roms: ["chd", "gdi", "cdi", "cue"]
          # ── VULKAN + zero-copy — LIVE 2026-07-16 (W4). dc renders on flycast-Vk, 60fps/0-freeze,
          #    zero-copy ACTIVE (set_image==zc_tex, 0 drops), VMU seed+harvest cycling, close x5 clean. ──
          # ── VULKAN + PER-PIXEL OIT ARM (W4, docs/arcade-vulkan-w3w4w5-spec.md) — PROPOSED, gated ──
          # flycast's Vulkan renderer (incl. the per-pixel OIT path, OITVulkanRenderer) fixes DC's chronic
          # alpha-sorting artifacts AND is expected to give the HEADROOM that made per-pixel OIT too
          # expensive on GL (rejected below at 58fps+3freezes). Flip = these TWO lines + the two OIT
          # options below.
          # ⚠ CRITICAL (static DLL audit, flycast_libretro.dll git 324d9c1): flycast has NO renderer
          # core-option — there is NO `reicast_renderer` key (only reicast_threaded_rendering), and a
          # `reicast_renderer:` line would be one of the SILENTLY-ignored unknown keys. So Vulkan is
          # selected PURELY by the frontend negotiating a Vulkan hw-context, i.e. hwContext:"vulkan" here
          # is the WHOLE mechanism (same worker-side path LRPS2/mupen use — it is NOT a config renderer
          # flip). There is likewise no OpenGL escape VALUE token; a per-GAME GL escape must use the
          # explicit hwContext:"gl" override field (W3 F1), NOT a core option.
          # Rollback one-liner: isGlAllowed: true + delete hwContext + delete the two OIT options.
          # UNBLOCKED 2026-07-16: the earlier "flycast-Vk not viable" verdict was WRONG. flycast IS a
          # genuine v1 core, but its v1 create_device honors our injected zero-copy extensions via the
          # custom core (flycast-custom-core.patch) — zero-copy is ACTIVE. The real crash was OURS: the
          # SET_HW_RENDER handler stored the core's retro_hw_render_callback POINTER, and flycast passes
          # a STACK-LOCAL struct (set_vulkan_hw_render), so context_reset later called a dangling/garbage
          # fn ptr (GPF PC=0/1 right after "zero-copy: ACTIVE"). Fix = copy the struct (nano_store_hw_render,
          # nanoarch.c/.go), matching RetroArch. See RESULTS-vulkan-w3.md §W4-LIVE.
          isGlAllowed: false
          hwContext: "vulkan"   # THE Vulkan-select mechanism (frontend negotiates a Vk hw-context)
          coreAspectRatio: true
          usesLibCo: true   # GL thread-affinity — see the psp note above (flycast GPF'd without it)
          vfr: false        # correct game speed — see the psp vfr note (Sonic Adventure ran double-speed)
          # QUALITY — flycast renders 1280x960 and we were THROWING 3 OF EVERY 4 SAMPLES AWAY.
          #
          # A raw frame dump at video_cb (patch 0022) proved it: with internal_resolution 1280x960 the
          # core hands us a 1280x960 buffer, but CloudRetro sizes the capsfilter OUTPUT from the core's
          # BASE geometry (640x480 — flycast never scales its base, its internal res goes to max_width).
          # videoconvertscale then downscaled 2:1 with the default NEAREST filter, i.e. point-sampled it.
          # Nearest downscale doesn't anti-alias, it ALIASES — strictly worse than rendering at native.
          #
          # The fix needs no worker patch. `scale` multiplies the base, and patch 0015 renegotiates the
          # SOURCE caps to the core's real frame size — so base(640x480) x scale(2) == source(1280x960)
          # makes videoconvertscale a passthrough and the full frame reaches NVENC. Verified: the client
          # receives 1280x960, 60fps, 0 dropped.
          #
          # ── scale UNDER VULKAN (W4) — expected UNCHANGED, must be live-confirmed ── flycast's
          # retro_get_system_av_info is renderer-AGNOSTIC (one code path; base = DC native 640x480,
          # internal-res multiplier → max_width) — the Vulkan renderer hands frames the same way the GL
          # renderer does, rendered at internal res and advertised base 640x480. So scale:2 should stay a
          # passthrough on Vk. This is INFERRED (static; flycast source not checked out) — the gated probe
          # MUST read the `retro_get_system_av_info: Res=` / `System A/V >>>` geometry line under the
          # Vulkan renderer: if base comes back as the internal res (not 640x480), re-derive scale to 1.
          scale: 2
          scaleMethod: bilinear2   # ⚠ REQUIRED: the source is now bigger than the output, so this is a
                                   # DOWNSCALE. nearest here would point-sample and alias.
          options:
            # ⚠ THE PREFIX IS `reicast_`, NOT `flycast_` — the DLL has 140 reicast_* keys and zero real
            # flycast_* keys, and libretro SILENTLY IGNORES unknown option keys.
            # 1920x1440 rendered, 1280x960 delivered (base 640x480 x scale 2) => 1.5x supersample.
            reicast_internal_resolution: "1920x1440"
            # 16x anisotropic. `off` measured IDENTICAL to the core's stated default, so the default is
            # effectively off; 16 demonstrably changes the frame (mid-frequency detail +7%).
            reicast_anisotropic_filtering: "16"
            # ── ALPHA SORTING = per-triangle (dc default). PER-PIXEL OIT TESTED & REJECTED 2026-07-17. ──
            # Value tokens (verbatim from DLL, VALUES not labels): reicast_alpha_sorting ∈ {per-strip (fast,
            # least accurate) | per-triangle (normal) | per-pixel (accurate)}; reicast_oit_abuffer_size ∈
            # {512MB | 1GB | 2GB | 4GB} (NO space — the spaced "512 MB" forms are GUI translations).
            #
            # EVIDENCE CHAIN (menu-probe.mjs, RESULTS-vulkan-w3 §W4-OIT). per-pixel held 60/0-freeze in
            # in-level/attract play (Crazy Taxi, Sonic Adventure, Jet Grind Radio) — but it CORRUPTED and
            # FLICKERED the UI/punch-through text quads on MENUS: Crazy Taxi's VMU "A1" label rendered as
            # garbled "ΛΙ"/"A·1" changing frame-to-frame (frame-hash distinct≈frames = per-frame
            # instability). per-triangle renders the SAME quads CRISP (distinct stable). It is NOT an
            # abuffer overflow — 512MB AND 1GB were both garbled (sizing ruled out). It is NOT frame
            # ordering — the recurrence detector found no whole-frame staleness on the static menu (only at
            # scene transitions). Upstream corroborates per-pixel is a fragile flycast mode (libretro/
            # flycast #914 per-pixel crash, #691 can't-set). So the attract-only sample passed while menus
            # broke → the quality lever steps DOWN SYSTEM-WIDE per Eric's sampled-gate policy.
            # REVISIT trigger: a flycast upstream fix to per-pixel punch-through / UI-quad sorting.
            # per-pixel as a per-title opt-IN is BANNED (no-enrollment policy); a per-title opt-OUT is the
            # only allowed exception mechanism and none is needed here.
            reicast_alpha_sorting: "per-triangle (normal)"
            # reicast_alpha_sorting: "per-pixel (accurate)"   # REJECTED 2026-07-17 (menu UI-quad garble) — see evidence above
            # reicast_oit_abuffer_size: "512MB"               # only meaningful with per-pixel; kept for the revisit
            #
            # ⚠ reicast_threaded_rendering: LEFT AT DEFAULT (enabled). Disabling it (Option B, 2026-07-17) as a
            # zero-copy sync fix was TESTED AND REVERTED SAME DAY: Eric hit "crazy latency" (inline flycast
            # render blocks retro_run long enough to disturb the pacer/audio-master loop → frames queue
            # client-side) and the visual garbage/stale was inconclusive. Option B is PERMANENTLY off the table
            # for flycast. The real fix is Option A — a flycast custom-core patch that signals a renderComplete
            # VkSemaphore on the present-pass submit and passes it to set_image, which our deployed set_image
            # wait binds to (mirrors dolphin patch #3). See flycast-custom-core.patch hunk #2 + RESULTS-vulkan-w3.
          # ⚠ DC RESOLUTION IS NOT RAISEABLE FROM HERE. Measured 2026-07-08 (docs/arcade-quality-plan.md §10):
          # CloudRetro pins the encode size to the core's BASE geometry — Frontend.FrameSize() returns
          # nano.BaseWidth()/BaseHeight() (frontend.go:424) and ignores the per-frame size video_cb reports.
          # flycast ALWAYS advertises base 640x480 (its internal resolution lands in max_width — hence the
          # `System A/V >>> 640x480 (1706x1706)` log line). So `reicast_internal_resolution: 1280x960` was
          # ACCEPTED by the core (it logged `retro_get_system_av_info: Res=960`) and still delivered 640x480.
          # dolphin / ppsspp / mupen scale their BASE geometry, which is why gc (1280x1056), psp (960x544)
          # and n64 (960x720) really do stream at a higher resolution.
          #
          # A higher internal res could still SUPERSAMPLE (render 2x, downsample to 640x480) — plausibly
          # real AA — but we could not verify it: the probe reads the H.264-DECODED stream, and 5 Mbps
          # quantization erases exactly the sub-pixel gradients AA creates (hardEdgeFrac 1.986% @2x vs
          # 1.910% @1x on Crazy Taxi's static title screen — no smoothing, and the wrong direction). Left
          # at core defaults rather than burn GPU for an unverifiable gain. To settle it, compare RAW frames
          # at the worker, pre-encode — not the browser's decoded video.
          #
          # ⚠ If you DO add options here: THE PREFIX IS `reicast_`, NOT `flycast_`. The DLL exposes 140
          # reicast_* keys and zero real flycast_* keys, and libretro SILENTLY IGNORES unknown option keys —
          # a `flycast_*` line looks applied and does nothing. (docs/arcade-per-game-config.md named them
          # all wrong until 2026-07-08.)
          # Same libco-teardown stack-fault class as psp above (context_destroy on the small coroutine
          # stack → 0xc0000028). flycast's GL destroy is deep too; skip it and let glCtx.Deinit() drop
          # the context. Also de-risks the known DC teardown segfault + Power Stone mid-session death.
          hacks: [skip_hw_context_destroy]
          # PER-GAME FORCED FRAMERATE is now DATA-DRIVEN, not hardcoded here. The worker reads
          # game-overrides.json (generated by `arcade-gameconfig-export` from the ArcadeGameProfile table,
          # keyed by normalized game identity) at each game load. See docs/arcade-per-game-config.md.
          # The `fps4rom:` core-config field still exists as a static fallback, but production overrides
          # (e.g. Sonic Adventure 1/2 → 30fps for their frame-locked engines) live in the DB.
        naomi:
          lib: flycast_custom_libretro
          folder: naomi
          roms: ["zip", "chd", "lst", "dat", "bin"]
          # ── VULKAN + OIT (W4 lockstep, LIVE 2026-07-16) ── same flycast_custom core + mechanism as dc
          # (no renderer core-option; hwContext IS the selection; the hw_render copy fix in the worker is
          # what unblocked it). Inherits dc's PASSED OIT verdict. Per-game GL escape = hwContext:"gl" (F1).
          # Rollback: lib: flycast_libretro + isGlAllowed: true + delete hwContext + the two OIT options.
          isGlAllowed: false
          hwContext: "vulkan"
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          hacks: [skip_hw_context_destroy]
          # Same flycast base-geometry trap as dc: the core always reports base 640x480, so without an
          # explicit scale we would deliver 640x480 no matter what it renders. Kept in lockstep with dc.
          scale: 2
          scaleMethod: bilinear2
          options:
            reicast_internal_resolution: "1920x1440"
            reicast_anisotropic_filtering: "16"   # flycast libco-teardown fault — see dc note
            reicast_alpha_sorting: "per-triangle (normal)"   # lockstep w/ dc: per-pixel REJECTED (menu garble), see dc block
            # reicast_alpha_sorting: "per-pixel (accurate)"  # REJECTED 2026-07-17 (see dc)
            # reicast_oit_abuffer_size: "512MB"
            # reicast_threaded_rendering: LEFT AT DEFAULT (enabled) — Option B disabling REVERTED (latency); see dc block. Fix = Option A semaphore patch.
        atomiswave:
          lib: flycast_custom_libretro
          folder: atomiswave
          roms: ["zip", "chd"]
          # ── VULKAN + OIT (W4 lockstep, LIVE 2026-07-16) ── see the naomi note above; same custom core,
          # hw_render fix, OIT verdict, and rollback one-liner.
          isGlAllowed: false
          hwContext: "vulkan"
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          hacks: [skip_hw_context_destroy]
          # Same flycast base-geometry trap as dc: the core always reports base 640x480, so without an
          # explicit scale we would deliver 640x480 no matter what it renders. Kept in lockstep with dc.
          scale: 2
          scaleMethod: bilinear2
          options:
            reicast_internal_resolution: "1920x1440"
            reicast_anisotropic_filtering: "16"   # flycast libco-teardown fault — see dc note
            reicast_alpha_sorting: "per-triangle (normal)"   # lockstep w/ dc: per-pixel REJECTED (menu garble), see dc block
            # reicast_alpha_sorting: "per-pixel (accurate)"  # REJECTED 2026-07-17 (see dc)
            # reicast_oit_abuffer_size: "512MB"
            # reicast_threaded_rendering: LEFT AT DEFAULT (enabled) — Option B disabling REVERTED (latency); see dc block. Fix = Option A semaphore patch.

        # PS2 via pcsx2_libretro (LRPS2). GL 3D core like psp/dc: same isGlAllowed + coreAspectRatio
        # Flip contract, usesLibCo thread-affinity, and skip_hw_context_destroy teardown hack. Requires
        # the PS2 BIOS (scph39001.bin) staged in the system dir (both system/ and system/pcsx2/bios/).
        # Heaviest core we run: native internal res (upscale 1x, the core default) for the first boot to
        # prove the path on the 4070 Ti, bump pcsx2_upscale_multiplier once it renders. .cso = the
        # compressed-ISO master format (R:\Roms\Games\Sony Playstation 2), read directly by the core.
        ps2:
          # OUR PATCHED CORE (2026-07-14). Stock LRPS2 with ONE data edit: the Stuntman (SLUS-20250)
          # entry in the GameDB that is compiled into the DLL. Recipe + rationale + the byte-for-byte
          # constraint: docker/arcade/lrps2-patch-gamedb.py. NOT a code change — the executable code
          # is byte-identical to stock; 124 bytes of embedded YAML differ and nothing else.
          #
          # Why a patched DLL and not config: the GameDB is the ONLY way to reach roundModes/clampModes
          # (they are not core options), and the GameDB cannot be overridden — `pcsx2_use_external_
          # gameindex` is DEAD CODE in this port (re-tested 2026-07-14: still "12806 games on record",
          # and the core never even logs its own "External GameIndex.yaml not found" line). Setting the
          # GS fixes by hand instead would need pcsx2_enable_hw_hacks, which DISABLES the entire GameDB
          # auto-fix system for all 12,806 games. So: patch the data.
          #
          # The custom lib NAME is the guard: libretro.cores.repo.sync pulls nightly cores by name and
          # would silently overwrite a patched pcsx2_libretro.dll. Same trick as the custom Dolphin core.
          # ⚠ Re-run the script after any core update — it refuses to patch if the stock entry changed.
          # ROLLBACK: lib: pcsx2_libretro (stock is untouched and sits right beside it).
          lib: pcsx2_custom_libretro
          folder: ps2
          roms: ["iso", "cso", "chd", "bin", "mdf", "zso"]
          isGlAllowed: false   # Vulkan by default (see hwContext); GL zero-copy arming stays off
          # VULKAN BY DEFAULT: every PS2 game renders on paraLLEl-GS via the Vulkan-capture path.
          # Per-game GL escape: set pcsx2_renderer:"OpenGL" in game-overrides.json.
          hwContext: "vulkan"
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          # skip_boot_restore: PCSX2 "successfully" unserializes at boot into a wedged black GS,
          # then close-save re-serializes the wedge — a poison loop on the deterministic save id
          # (live 2026-07-09). Boot-resume stays OFF for ps2 until made safe; manual in-session
          # Save/Load (patch 0030) works.
          #
          # ⚠ DO NOT remove skip_hw_context_destroy to try to persist the GS shader cache (tried & REVERTED
          # 2026-07-15). PCSX2's context_destroy DEADLOCKS in our single-thread (LibCo/same_thread) model —
          # the room-close watchdog then kills the worker (exit 70) after 30 s, on EVERY ps2 close. A 64 MiB
          # same_thread stack (nanoarch.c) stopped the STATUS_BAD_STACK crash but NOT the deadlock. And it's
          # moot anyway: the gl_programs write does NOT live in context_destroy — it happens in
          # retro_unload_game (proven: the cache grew 71→98→101 across clean room-closes WITH this hack on).
          # The real cache-persist bug is elsewhere (see arcade-stuntman-audio-skip memory).
          hacks: [skip_hw_context_destroy, skip_boot_restore]
          # PS2 games often render a narrower framebuffer than the base geometry (God of War: raw 1024x896
          # vs delivered 1280x896 — measured with the patch-0022 frame dump). CloudRetro stretches that to
          # the output width, and the DEFAULT resampler is nearest-neighbour, so a 1.25x stretch duplicates
          # columns unevenly — visible shimmer on a 3D image. bilinear2 resamples it smoothly. (2D cores
          # keep nearest: there the ratio is an exact integer and nearest is what preserves the pixel art.)
          scaleMethod: bilinear2
          options:
            # OpenGL renderer so PCSX2 draws into CloudRetro's libretro GL (WGL) hw-render context.
            # Auto/Vulkan/D3D would render to a private device the GL capture never sees -> black frame.
            pcsx2_renderer: "paraLLEl-GS"   # Vulkan GS renderer — the default (was OpenGL)
            pcsx2_pgs_high_res_scanout: "enabled"
            pcsx2_pgs_ssaa: "8x SSAA (can high-res)"
            # Boot straight into the game, skipping the PS2 BIOS boot animation (faster attract testing).
            pcsx2_fastboot: "enabled"
            # Name the BIOS explicitly. LRPS2 read "Bios Found: USA v01.60" from its root scan but the
            # VM-load scan of system/pcsx2/bios/ reported "no valid BIOS" until the file is named here.
            pcsx2_bios: "scph39001.bin"
            # PER-GAME FIXES AT SCALE (docs §18). LRPS2 ships a built-in GameDB — 12,806 games of
            # gamefixes, clamp/round modes and AUTOMATIC GS hardware fixes keyed by serial+CRC — and it
            # verifiably runs on our stack: God of War's boot logs "[GameDB] Enabled GS Hardware Fix:
            # alignSprite/roundSprite/autoFlush" all by itself. So the per-title upscaling fixes the
            # quality plan deferred to ArcadeGameProfile are ALREADY being applied automatically.
            # ⚠ Two rules keep it working: (1) pcsx2_enable_hw_hacks must stay OFF — enabling manual hw
            # hacks DISABLES the automatic GameDB fixes (the DLL says so verbatim); (2) don't bother
            # with pcsx2_use_external_gameindex — it was tried ("enabled" + GameIndex.yaml staged at
            # both <system>/resources and <system>/pcsx2/resources) and the code path never ran (no
            # "External GameIndex" log either way, count stayed 12,806). Inert on this port.
            # QUALITY (docs/arcade-quality-plan.md Phase 3). PS2 shipped at 1x native (640x448) — the
            # softest 3D system we have. LRPS2 scales its BASE geometry with the multiplier (unlike
            # flycast), so this really does deliver more pixels: 640x448 -> 1280x896.
            #
            # ⚠ THE VALUE IS THE WHOLE STRING, not "2" — verified by parsing the core-option structs out
            # of pcsx2_libretro.dll. An unmatched value silently leaves the option at its default.
            #
            # Gated on the bitrate path actually working: at the old stuck 5 Mbps this would have been
            # ~0.073 bits/pixel/frame vs ~0.29 at native — i.e. it would have looked WORSE. It ships with
            # per-system Auto bitrate (ps2 = 12 Mbps ceiling) + ABR (patch 0021) behind it.
            pcsx2_upscale_multiplier: "2x Native (~720p)"
            # pcsx2_hw_download_mode stays at the core default ("Accurate") — MEASURED and REJECTED
            # 2026-07-14 (Stuntman audio). It is under `Video >`, not `HW Hacks >`, so unlike the sprite
            # hacks it can be set WITHOUT tripping pcsx2_enable_hw_hacks and killing the GameDB auto-fixes
            # — which makes it the tempting lever for a game whose GameDB entry forces CPU sprite
            # rendering (Stuntman: cpuSpriteRenderBW=4), since "Accurate" syncs CPU/GPU on every readback.
            # It did cut slow ticks (~143 -> ~105 per 5 s window driving) but introduced 58-92 ms maxTick
            # spikes where the default has none, and BOTH arms already held a flat 60 fps / 48000 audio.
            # Paying for noisy headroom with "incorrect results in games that read back GPU-rendered
            # content" (the core's own words) is a bad trade in the one game whose texture fix IS a
            # readback. Revisit only with a deterministic bed and a visual diff.
            # Values: Accurate|Disable Readbacks|Unsynchronized|Disabled.
            # Sharpens ground/road planes at oblique angles, and it HELPS the encoder: less texture
            # shimmer = less high-frequency temporal noise to spend bits on. Values: disabled|2x|4x|8x|16x.
            pcsx2_anisotropic_filtering: "8x"
            # Blending accuracy Basic -> Medium: more correct transparency/blend effects, and it measured
            # free (60fps, 0 freezes, 0 dropped at 1280x896).
            pcsx2_blending_accuracy: "Medium"
            # NOTE: upscaling PS2 exposes per-game half-pixel/sprite misalignment. Those fixes are
            # per-title (pcsx2_half_pixel_offset, pcsx2_round_sprite, ...) and are all gated behind
            # pcsx2_enable_hw_hacks, which must NEVER be a global default. They belong in
            # ArcadeGameProfile.CoreOptionsJson (docs/arcade-per-game-config.md).
            #
            # ── STUNTMAN (SLUS-20250) per-game setup — 2026-07-15, see docker/arcade/lrps2-patch-gamedb.py ──
            # Two independent layers, because the fix it needs is split across a GameDB field and a core
            # option: (1) `eeClampMode: 3` (Full FP clamp) for its non-IEEE-FP "crazy car AI" softlock —
            # reachable ONLY via the GameDB, hence the byte-patched pcsx2_custom_libretro.dll (lib: above);
            # (2) `pcsx2_upscale_multiplier: "1x Native (PS2)"` in game-overrides.json to claw back the
            # audio headroom Full clamp + the 2x cpuSpriteRenderBW readback eat in heavy scenes. Round modes
            # were tried and RETRACTED (vuRoundMode tanked fps 3x; even eeRoundMode doesn't fix the AI).
            # Soft-float (PCSX2 #12001) — the only complete AI fix — is interpreter-only and NOT in this
            # core (binary-scanned), so it is off the table. Full rationale in the patch script's header.

        # GameCube via dolphin_libretro. GL 3D core like psp/dc/ps2: same isGlAllowed + coreAspectRatio
        # Flip contract, usesLibCo thread-affinity, vfr:false (correct game speed), skip_hw_context_destroy
        # teardown hack. No BIOS required — Dolphin HLE-boots the GC IPL. Source ROMs are .gcz (Dolphin's
        # compressed format, R:\Roms\Games\Nintendo GameCube), read directly by the core → RomCache COPIES
        # the .gcz into roms/gc/ on first play (plain-file branch, like ps2 .cso), never a 7z extract.
        # 4 controller ports (MaxPlayers 4 at ingest) — a strong fit for the shared-room model.
        gc:
          # OUR PATCHED BUILD (2026-07-09, docker/arcade/dolphin-createsharedcontext.patch): implements
          # GLContextLR::CreateSharedContext (upstream's external-context path returns the base's nullptr,
          # which async-shader threads dereference — the 0xc0000005). The custom lib NAME pins it against
          # repo.sync nightly overwrites; the stock dolphin_libretro stays beside it as instant rollback
          # (flip lib back + shader_compilation_mode to "0"). Build recipe: D:\Arcade\build\dolphin\build-core.bat.
          # REBASED custom core (2026-07-09, task 22): the CreateSharedContext patch rebuilt on the
          # STOCK revision 287ab2dba6 (hash verified embedded in the DLL) — the master-drift build
          # ran races at half speed because its shader format could not reuse the warm pipeline
          # cache (measured via pace-diag). This build = yesterday's core + async shaders, nothing
          # else. Rollback: lib: dolphin_libretro + shader_compilation_mode "0".
          # STOCK CORE — VERDICT 2026-07-11 02:46, THE F-ZERO RACE-SLOWDOWN FIX. The custom core
          # (dolphin_custom_libretro, live 07-09 21:25 → 07-11 02:44) ran GX races at 28–50 ticks/s
          # (uniform ~25ms retro_run, one busy core, GPU idle) at DETERMINISTIC track spots; the
          # stock 2606.0.88 nightly runs the same races at a flat 58.5–60 (verified live, Big Blue,
          # raw-ISO rip, MSAA 0, sync shaders). Root cause inside the custom build unresolved
          # (deoptimized build despite the Release recipe? the CreateSharedContext patch itself?
          # its DLL is 30% larger than stock) — investigate before EVER redeploying it. Everything
          # else was exonerated one variable at a time on 07-10/11: GPU clocks, process priority,
          # E-cores, efb scale, codec, network, pacing, save-states, shader/pipeline caches, gcz
          # compression, MSAA, dual-core (GFZ.ini vetoes it). Async shaders are moot on stock
          # (mode "0" below is REQUIRED — stock's async path nulls shared contexts and crashes).
          #
          # ⚠ SUPERSEDED 2026-07-14 (commit c149cf2). The verdict above was measured against a CRIPPLED
          # custom build: its CMake set() shadowed the release flags, so the DLL shipped WITHOUT /O2 —
          # that, not CreateSharedContext and not async shaders, was the GX race slowdown. The rebuilt,
          # actually-optimized core (~13 MB; an unoptimized one is ~21 MB) holds a driven Big Blue race
          # at 60.0, slowTicks=0, maxTick ~8 ms with 4x MSAA + efb 3 + async ubershaders ALL on. So the
          # custom core is live and async shaders come WITH it: lib and shader_compilation_mode must move
          # together (mode "2" crashes on stock). Build: docker/arcade/dolphin-build-core.bat.
          # ⚠ As with audioMaster above, c149cf2 wrote this into config.yaml — which nothing reads. It
          # belongs HERE, in the file the workers actually load. Rollback pair: dolphin_libretro + "0".
          lib: dolphin_custom_libretro
          folder: gc
          roms: ["gcz", "iso", "rvz", "ciso", "gcm", "m3u"]
          # ── VULKAN ARM (W5 reversal, Eric 2026-07-16) ── The W5 audit verdict was NO-GO purely on the
          # cold-cache cost; Eric overruled it ("we don't have many caches built for GC — the flip is
          # worth it"). The audit's TECHNICAL findings all said Vk-safe: dolphin picks its backend from
          # the libretro hw-context TYPE, not dolphin_renderer (Video.cpp:135-138 cascade — Vulkan is
          # reachable only from a Vulkan-advertising frontend, which hwContext:"vulkan" makes us);
          # negotiation is effectively v1 on Windows (create_instance/create_device2 are __APPLE__-only,
          # Video.cpp:231-242); the custom-core /O2 patch covers VideoBackends/Vulkan/*; the
          # createsharedcontext patch is GL-only and INERT under Vk (VKGfx uses the base
          # AsyncShaderCompiler, no shared GL contexts needed — mode "2" still valid); Vk pipeline
          # caches land under User/Cache/Shaders/Vulkan-* (covered by coreCache.purge). Old OpenGL-*
          # caches stay on disk harmlessly (filename-prefix keyed); expect a per-game mode-2 ubershader
          # warm-up (~29 t/s for the first minutes) on each title's first Vk boot — accepted.
          # Rollback one-liner: isGlAllowed: true + delete the hwContext line.
          isGlAllowed: false          # Vulkan by default (see hwContext); GL zero-copy arming stays off
          hwContext: "vulkan"         # gc renders on Dolphin-Vk (VKGfx) via the Vulkan-capture path
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          # A pipeline cache is only readable by the exact core BUILD that wrote it — purge the stale
          # shader cache when the core identity changes, or the new build silently recompiles forever.
          coreCache:
            dir: "User/Cache"
            purge: ["Shaders", "*.uidcache"]
          # skip_serialize_size_probe (patch 0016): dolphin defers video/emu init to context_reset +
          # first retro_run, so the load-time retro_serialize_size probe walks save-state into a NULL
          # g_vertex_manager → 0xc0000005. The probe only feeds a log line; saves re-query at save time.
          #
          # ── vk_synthetic_surface (W5-LIVE, REQUIRED for the Vulkan arm) ── Dolphin's Vulkan libretro
          # backend gates its FRAME HANDOFF (video_cb/set_image) on having a swapchain, which needs a
          # VkSurfaceKHR. With VK_NULL_HANDLE it renders internally and hands us NOTHING — retro_run ticks,
          # audio + shaders run, but video_cb fires 0x (root-caused live 2026-07-16 with CLOUD_GAME_VK_DEBUG:
          # video_cb=0/set_image=0 over 3221 ticks; NOT a shader-cache warm-up). Unlike PPSSPP it does not
          # crash on the null surface — it silently produces no video. The hack hands it a real hidden-window
          # surface; Dolphin then makes its swapchain and its glue warps it to set_image → frames flow to
          # zero-copy (re-probe: video_cb=VALID=1511, set_image=1511, zc_tex=1511, warm-boot 60fps@1280x1056).
          # Inert on GL. REMOVE if gc ever rolls back to GL.
          hacks: [skip_hw_context_destroy, skip_serialize_size_probe, vk_synthetic_surface]
          # Render efb_scale 3 (1920x1584), deliver 1280x1056: supersampled on TOP of 4x MSAA — the
          # 07-09 quality-pass ideal, RESTORED 2026-07-11 after the race-slowdown hunt exonerated
          # resolution entirely (races dipped identically at efb 2 and 3; the culprit was the custom
          # dolphin core, now retired — see lib above).
          scale: 0.6667
          scaleMethod: bilinear2
          options:
            # OpenGL backend so Dolphin draws into CloudRetro's GL (WGL) hw-render context. A Vulkan/D3D
            # backend renders to a private device the GL capture never sees -> black frame (the ps2
            # pcsx2_renderer:OpenGL lesson). Native internal res for the first boot to prove the path on
            # the 4070 Ti; raise dolphin_efb_scale once it renders.
            dolphin_renderer: "Hardware"
            dolphin_cpu_core: "JIT64"
            # OPTION VALUES are the core-options-v2 VALUE strings, NOT the display labels (verified against
            # DolphinLibretro/Common/Options.cpp @287ab2dba6): efb_scale = "1".."6" (labels "1x Native
            # (640x528)" etc are display-only). An unmatched value leaves the port's typed cache at T{}=0
            # → retro_get_system_av_info returns 0x0 geometry → null video objects → 0xc0000005 at boot.
            # THAT was the gc boot crash. shader_compilation_mode: "0"=Synchronous "1"=Sync(Uber)
            # "2"=Async(Uber) "3"=Async(Skip Rendering).
            # efb_scale "2" = 1280x1056, verified 60fps/0-drop. NOTE: dolphin TEARDOWN can wedge the worker
            # (partial deadlock — /echo alive, coordinator WS dead) at ANY scale (reproduced at "1" too);
            # the GL Worker Watchdog task auto-recycles a wedged worker within ~60s. Real fix = debug the
            # teardown deadlock (dump: scratchpad worker-hung-27168.dmp).
            # "3" (paired with scale: 0.6667 above — supersampled to 1280x1056 on the wire).
            dolphin_efb_scale: "3"
            # 4x MSAA. The ONLY core where MSAA measurably does anything: A/B'd on RAW pre-encode frames
            # (patch 0022) over 3 runs each, the share of edges that are HARD fell 6.29% -> 4.08%, with no
            # overlap between the groups. n64 (gliden64) and psp (ppsspp) produce BIT-IDENTICAL frames with
            # their MSAA options on or off — libretro's hw_render FBO isn't multisampled, and only Dolphin's
            # OGL backend manages its own framebuffers. Values: 0 None, 1/2/3 = 2x/4x/8x MSAA, 4/5/6 = SSAA.
            #
            # This is invisible from the browser: H.264 quantization erases the sub-pixel edge gradients AA
            # creates. Never A/B anti-aliasing on the decoded stream.
            # 4x MSAA, RESTORED 2026-07-11 (was briefly "0" as a slowdown diagnostic — exonerated:
            # the bad custom core dipped identically with MSAA off; stock runs 60 regardless).
            dolphin_anti_aliasing: "2"
            # 16x anisotropic. Not an AA operation, so hardShare can't score it — what it does show is
            # RETAINED texture detail: on dc the same measurement moved mid-frequency edges +7% with no
            # meaningful hard-edge change. Values are numeric: 0=1x(off) 1=2x 2=4x 3=8x 4=16x.
            dolphin_max_anisotropy: "4"
            # NOT set on purpose: dolphin_force_true_color and dolphin_disable_copy_filter are already
            # default-ON in this libretro port — proven by deleting GFX.ini and regenerating it with the
            # options absent from this config (ForceTrueColor=True, DisableCopyFilter=True). Setting them
            # would be a no-op; leaving this note so nobody "adds" them again (docs §17). Also learned:
            # F-Zero GX boots are NOT frame-deterministic (raw dumps differ run-to-run), so dolphin
            # verdicts need GFX.ini/behavioural evidence, not raw-frame A/B.
            # SINGLE-THREADED + synchronous shaders — and this is a CORE limitation, not ours (settled
            # 2026-07-09): libretro-dolphin's external-context path never overrides the base
            # GLContext::CreateSharedContext(), which returns nullptr (Common/GL/GLContext.cpp:45) —
            # so with async shaders / a GPU thread enabled, Dolphin's worker threads deref that null
            # (0xc0000005 read @0x180) no matter what the frontend does. env 44 stays granted (it fixes
            # the single-context fallback crash); async paths stay OFF until someone patches the CORE
            # (implement CreateSharedContext for the external context — upstreamable). The sync-compile
            # stutter (rare audio skips on first sight of each effect) SELF-HEALS via the persistent
            # per-game shader cache (legacy_save/User/Cache/Shaders — F-Zero GX grew a 1.3 GB pipeline
            # cache in one evening); wait_for_shaders precompiles the cache at boot.
            # DUAL-CORE (2026-07-09, round 3 of the F-Zero audio hunt): with shaders fully cached the
            # audio still dropped at the SAME content points (race start, announcer) — that's not
            # compiles, it's single-core CPU saturation at the game's heaviest moments. Dual-core was
            # originally disabled for the null-shared-context crash — the exact thing our patched core
            # (dolphin_custom_libretro) fixes. If GC rooms crash at boot: revert to "disabled".
            # DUAL-CORE IS A DEAD END FOR F-ZERO GX — settled 2026-07-10 late, after a ~15-minute
            # "enabled" experiment kept logging "CPU Thread separate = No": Dolphin's OWN game INI
            # (Sys/GameSettings/GFZ.ini) sets `CPUThread = False` for GFZ* and the game-local config
            # layer overrides our base option. Upstream forbids dual-core for this game (it EFB-peeks
            # constantly — the same INI's Video_Hacks note). So the 07-09 "dual-core ON" round never
            # actually engaged for GX either, and per the per-ROM-fixes rule the emulator's DB wins:
            # this stays disabled (flipping it only affects OTHER GC titles, untested). The real
            # lever for GX's heavy-moment dips is EFB work ∝ internal resolution — see efb_scale.
            dolphin_main_cpu_thread: "disabled"
            # "2" = Async (Ubershaders): new shaders compile on SHARED-CONTEXT worker threads (our
            # patched core makes those real) while ubershaders render the frame meanwhile — no
            # compile stall, no first-sight audio skip. Was "0" (Synchronous), forced by the stock
            # core's nullptr CreateSharedContext. main_cpu_thread stays disabled deliberately: one
            # variable at a time — the dual-core GPU thread is a separate risk with its own testing.
            # BACK TO "0" SYNCHRONOUS (2026-07-11 02:30, the launch-week config): the entire GX
            # race-slowdown era (28-50 ticks/s, "skipping audio") coincides exactly with async
            # ubershaders (mode "2", deployed 07-09 21:25). Evidence the async path never delivers
            # specialized pipelines on our core: dips persist on a FRESHLY REBUILT cache; no compile
            # activity logs during dips (async workers idle/broken); the binary cache re-grew its
            # whole working set EVERY session (2.5 GB in 2 days); and the one great race since sat
            # on an accidental 8.5-min full synchronous precompile. Mode 2 = permanent ubershader
            # rendering in heavy scenes ≈ 25 ms/frame. Sync's old first-sight stutter is now ~nil
            # (NVIDIA driver shader cache warm). If mode 2 is ever re-attempted, verify with a REAL
            # driven race and check the specialized cache STOPS growing between sessions.
            # "2" = Async (Ubershaders), and it REQUIRES the custom core above (stock's async path nulls
            # the shared context and crashes). Ubershaders render the frame while specialized pipelines
            # compile on worker threads — no compile stall inside retro_run. Synchronous mode "0" is what
            # produced the 441 ms – 12.8 s stalls in the worker log (GLSL compiler output sits directly
            # in front of every one of them). wait_for_shaders is then unnecessary: nothing to wait for.
            dolphin_shader_compilation_mode: "2"
            # wait_for_shaders ENABLED (2026-07-17, default-on/opt-out policy). Precompiles the persisted
            # pipeline UID cache at boot so previously-seen content has NO mid-play compile stall (async
            # ubershaders mode "2" still covers genuinely-new content). MEASURED tradeoff: on a WARM cache
            # it costs only ~0.4-0.7s at boot (shaders are LOADED from disk, not recompiled — worker log
            # "Loaded N cached shaders from Vulkan-*.cache"); a cold first-ever boot per title pays the real
            # compile cost once, then it's cached. Rollback: dolphin_wait_for_shaders: "disabled".
            dolphin_wait_for_shaders: "enabled"

        # --- ported from docker/arcade/config.yaml (Windows-only migration): the tuned
        # non-GL cores so this pool renders 2D/N64 correctly (scale, N64 framebuffer opts). ---
        n64:
          lib: mupen64plus_next_libretro
          roms: ["n64", "v64", "z64"]
          isGlAllowed: false   # Vulkan by default (see hwContext); GL zero-copy arming stays off
          # VULKAN BY DEFAULT: every N64 game renders on paraLLEl-RDP via the Vulkan-capture path.
          # Per-game GL escape: set mupen64plus-rdp-plugin:"gliden64" in game-overrides.json.
          hwContext: "vulkan"
          usesLibCo: true
          # vfr OFF: variable frame timing produced juddery presentation in the browser — a steady
          # ~16% of frame intervals landed at ~50ms (measured via rVFC pacing histogram) and the
          # compositor dropped ~6%. Fixed 60Hz cadence paces the encoder/RTP timestamps evenly.
          vfr: false
          coreAspectRatio: true
          # SUPERSAMPLING (patch 0023). MSAA is INERT on this core — libretro's hw_render FBO isn't
          # multisampled, so mupen64plus/ppsspp produce BIT-IDENTICAL frames with it on or off (only
          # Dolphin, which owns its framebuffers, really multisamples). The AA that DOES work here is to
          # render big and average down: `scale` < 1 shrinks. Measured on raw frames from the same source
          # image, 1920x1440 -> 960x720: hard edges 2.112% (nearest) vs 1.792% (bilinear2), a 15% drop.
          # ⚠ A fractional scale MUST be paired with a smooth scaleMethod — downscaling with nearest
          # point-samples and ALIASES rather than anti-aliases.
          # Render 1920x1440 (6x native), deliver 1280x960: supersampled AND higher resolution.
          # Costs ~1.0 CPU core per room (0.37 without); two concurrent rooms fit easily on the 13700K.
          scale: 2
          scaleMethod: bilinear2
          options:
            # Legal values are a fixed list (verified in mupen64plus_next_libretro.dll):
            # 320x240, 640x480, 960x720, 1280x960, ..., 1920x1440 — not an arbitrary WxH.
            mupen64plus-43screensize: "640x480"
            mupen64plus-parallel-rdp-upscaling: "4x"
            mupen64plus-rdp-plugin: "parallel"   # paraLLEl-RDP (Vulkan LLE) — the default renderer
            mupen64plus-rsp-plugin: "parallel"   # LLE RSP accuracy pairing
            # MSAA left OFF (core default). "4" was tried and A/B-measured on Mario Kart 64 at 960x720:
            # hardEdgeFrac 1.033% (MSAA=4) vs 1.028% (MSAA=0) — NO measurable anti-aliasing. Two candidate
            # reasons, both unresolved: the probe reads the H.264-decoded stream (quantization at 5 Mbps
            # erases sub-pixel edge gradients), and CloudRetro's hw_render context may request no
            # multisample buffers. Not shipping a GPU cost with no demonstrated benefit. Values: 0,2,4,8,16.
            # mupen64plus-FXAA is inert too: FXAA=1 produced 30/30 BIT-IDENTICAL raw frames vs FXAA=0
            # (docs §17) — gliden64's post-process pass doesn't run under this hw_render setup, same
            # class as MSAA. Supersampling (scale < 1 above) is the only AA that works on this core.
            # Useful side-proof: MK64's attract is bit-deterministic across boots — the right test bed
            # for any future raw-frame A/B (F-Zero GX is NOT deterministic; see the gc note).
            # (It did NOT break framebuffer effects: Bomberman 64's flat-blue story cinematic renders
            # identically with MSAA 0 and 4 — that is the pre-existing gliden64 limit, not a regression.)
            mupen64plus-MultiSampling: "0"
            # REQUIRED once you upscale: gliden64 draws N64 2D "texrects" (HUDs, sprites, text) at the
            # upscaled resolution by default, which seams and blurs them. Optimized renders them at native
            # res. Values: Disabled|Unoptimized|Optimized.
            mupen64plus-EnableNativeResTexrects: "Optimized"
            # 3-point is the N64's real texture filter; "standard" bilinear is a PC approximation that
            # looks subtly wrong on N64 textures. Values: 3point|standard.
            mupen64plus-BilinearMode: "3point"
            # Framebuffer readback — the core defaults ship these Off, which renders framebuffer
            # effects BLACK (Bomberman 64's whole intro movie) or wrong (DKR uses FB/depth tricks).
            # Async color copy + software depth copy are the standard gliden64 compat settings;
            # cost is trivial on a real GPU.
            mupen64plus-EnableCopyColorToRDRAM: "Async"
            mupen64plus-EnableCopyDepthToRDRAM: "Software"
            # Legacy (fast, inaccurate) blending ships ON in the core defaults — with it, Bomberman
            # 64's intro cinematic renders as flat color planes with no geometry on the D3D12 path.
            mupen64plus-EnableLegacyBlending: "False"
            # Cutscenes/cinematics often composite via auxiliary color buffers. With this on,
            # Bomberman 64's attract/intro scenes render (mine-cart, snow demo — were flat planes).
            # KNOWN LIMIT: its STORY cinematics (Adventure opening movie) still render as flat
            # clear-color planes — every gliden64 FB option was tried (CopyColor To/From, CopyDepth,
            # CopyAux, LegacyBlending); a real fix needs LLE RSP/RDP or a renderer fix on D3D12.
            # In-engine gameplay/menus/training all render correctly; Battle mode has no cinematics.
            mupen64plus-EnableCopyAuxToRDRAM: "True"

        # 2D cores: stream at 3x with nearest-neighbour (the pipeline's default scaler) instead of
        # native 256x224 — the browser's bilinear stretch of a tiny stream is what read as "fuzzy
        # SNES", and no encoder preset can fix that. 768x672 crisp pixels cost NVENC nothing.
        # (These merge INTO the default core entries per-key — lib/roms/etc. survive.)
        snes:
          scale: 3
        nes:
          scale: 3
        gba:
          scale: 3
        # Game Boy / Game Boy Color via mgba (same lib as GBA). The stock config only exposes gba+gbc
        # roms under the `gba` folder; the JIT catalog files per system (gb/, gbc/), so give each its own
        # core+folder. mgba plays all three. scale:3 for the same crispness rationale as the other 2D cores.
        gb:
          lib: mgba_libretro
          folder: gb
          roms: ["gb"]
          scale: 3
        gbc:
          lib: mgba_libretro
          folder: gbc
          roms: ["gbc"]
          scale: 3

        gen:
          # lib name verified live 2026-07-03 (Sonic 2 streams).
          lib: genesis_plus_gx_libretro
          roms: ["md", "gen", "smd", "bin"]
          folder: genesis
          scale: 3   # 320x224 native -> 960x672 nearest (was 2; 3x matches snes/nes, costs NVENC nothing)

        # ARCADE (fbneo). The site's `arcade` system ingests into roms/mame and launches through the
        # core key `mame` (ArcadeIngestCommand.cs:242) -- the STOCK CloudRetro entry, which we had never
        # overridden. Two consequences, both fixed here (docs/arcade-quality-plan.md Phase 1):
        #   1. No `scale` -> 6,214 games encoded at raw 304x224, chroma below native (see pcsx note).
        #   2. Stock pins `scaleMethod: bilinear2` (pkg/config/config.yaml:295). Adding `scale` WITHOUT
        #      overriding that would upscale with a blurry multi-tap filter -- worse than before, and it
        #      would look like the change worked. nearest-neighbour is mandatory here, not cosmetic.
        # lib/folder/roms restated so the koanf deep-merge can't surprise us.
        mame:
          lib: fbneo_libretro
          folder: mame
          roms: ["zip"]
          scale: 3              # 304x224 -> 912x672
          scaleMethod: nearest-neighbour
          options:
            # 32-bit color (docs/arcade-quality-plan.md §17). A raw video_cb dump proved fbneo was
            # emitting RGB565 (bpp=2, pixFmtCode=2): 5-6 bit channels = banding on gradients before
            # the encoder ever sees the frame. "Allow" = fbneo picks XRGB8888 where the board's
            # driver supports it; verified bpp=4 after the flip, same fps. Phase 1 had parked this
            # as "can't confirm the default isn't already enabled" — the dump instrument settled it.
            fbneo-allow-depth-32: "enabled"
          # VERTICAL BOARDS RENDERED SIDEWAYS without this. The worker only sends the GAME_START `av`
          # payload when AspectEnabled() (coordinatorhandlers.go), i.e. when coreAspectRatio is set — so
          # fbneo never told the client its aspect (0.75 on a vertical cab) OR its rotation (90), and the
          # client drew a rotated, 4:3-squashed picture. fbneo is not a GL core, so Flipped() stays false
          # and this cannot introduce the upside-down GL bug. Horizontal boards are unaffected (a=1.333,
          # rot=0). Verified on 1942 (vertical) and Metal Slug (horizontal), 2026-07-08.
          coreAspectRatio: true

        # ─── GPU / GL 3D cores (same D3D12 + NVENC path proven by n64/psx) ────────────────────
        # GL cores MUST set isGlAllowed (HW render) AND coreAspectRatio: without the latter the
        # GAME_START `av` payload is null and the client never learns to flip the bottom-left-origin
        # GL frame → upside down (exact n64 lesson). Cores auto-download via repo.sync (no rebuild).
        #
        # PSP: no BIOS required. Ad-hoc multiplayer is unsupported in libretro → 1-player rooms
        # (set MaxPlayers 1 at ingest, like our n64 solo rooms).
        sms:
          lib: genesis_plus_gx_libretro
          folder: sms
          roms: ["sms"]
          scale: 3
        gg:
          lib: genesis_plus_gx_libretro
          folder: gg
          roms: ["gg"]
          scale: 4   # 160x144 native — needs more upscale than the console cores
        sg1000:
          lib: genesis_plus_gx_libretro
          folder: sg1000
          roms: ["sg"]
          scale: 3
        segacd:
          lib: genesis_plus_gx_libretro
          folder: segacd
          roms: ["cue", "chd", "iso"]
          scale: 3   # was 2 -- 320x224 native, matches gen

        # ─── Other 2D cores (each pins its folder so extension collisions can't cross-load) ──────
        sega32x:
          lib: picodrive_libretro
          folder: sega32x
          roms: ["32x", "bin"]
          scale: 3   # was 2 -- 320x224 native, matches gen
        pce:
          # mednafen_pce (full) covers TurboGrafx-16 / PC Engine + SuperGrafx + PCE-CD (syscard3.pce).
          lib: mednafen_pce_libretro
          folder: pce
          roms: ["pce", "sgx", "cue", "chd"]
          scale: 3
        ngpc:
          lib: mednafen_ngp_libretro
          folder: ngpc
          roms: ["ngp", "ngc"]
          scale: 4
        wsc:
          lib: mednafen_wswan_libretro
          folder: wsc
          roms: ["ws", "wsc", "pc2"]
          scale: 4
        a2600:
          lib: stella_libretro
          folder: a2600
          roms: ["a26", "bin"]
          scale: 3
        a7800:
          lib: prosystem_libretro
          folder: a7800
          roms: ["a78"]
          scale: 3
        lynx:
          # mednafen_lynx needs lynxboot.img in the BIOS mount.
          lib: mednafen_lynx_libretro
          folder: lynx
          roms: ["lnx"]
          scale: 4
        vb:
          lib: mednafen_vb_libretro
          folder: vb
          roms: ["vb", "vboy"]
          scale: 3
        fds:
          # Famicom Disk System via nestopia; needs disksys.rom in the BIOS mount.
          lib: nestopia_libretro
          folder: fds
          roms: ["fds"]
          scale: 3
        neogeo:
          # Neo Geo AES/MVS romsets via fbneo (the arcade core); needs neogeo.zip in the BIOS mount.
          # Finicky (parent romset grind) — stage last.
          lib: fbneo_libretro
          folder: neogeo
          roms: ["zip"]
          scale: 3   # was 2 -- 304x224 native, matches the mame entry above
          options:
            fbneo-allow-depth-32: "enabled"   # same 16-bit finding as the mame entry above


encoder:
  # Same NVENC H.264 + Opus-FEC path as the WSL stack (docker/arcade/config.yaml). nvcodec here comes
  # from MSYS2 gst-plugins-bad (dlopens nvEncodeAPI64.dll). INSTANT FALLBACK if nvcodec is absent on
  # this worker: set codec to vp8 (vpx ships in gst-plugins-good; the 13700K handles one 640x480 stream).
  video:
    # AV1 is the DEFAULT since 2026-07-09 (was h264; patch 0024 added the pipeline). The friend group
    # runs Chrome/Firefox — both take AV1 (verified live: video/AV1, 60fps) — and Safari is explicitly
    # unsupported (an AV1-only track would be NO VIDEO there; CloudRetro negotiates one codec per room).
    # Worth +0.884 dB at MATCHED bitrate ≈ 15% bitrate saving vs the H.264 baseline; client decode cost
    # 2.8-3.6ms vs 1.3ms (nowhere near the frame budget). ABR (0021) + VBV scaling (0025) carry over:
    # nvav1enc exposes the same live-changeable bitrate/vbv-buffer-size properties as nvh264enc.
    # INSTANT ROLLBACK: set codec: h264 and recycle the workers.
    # ⚠ TABLET FINDING (2026-07-10 late): AV1 can be a tablet-killer — Eric's tablet accepted the
    # AV1 track (Chrome advertises software dav1d, so negotiation succeeds) but could not
    # software-decode 1280x1056@60 in real time, and the infinite-GOP intra-refresh stream has NO
    # keyframes to resync/skip to, so the decode backlog grows WITHOUT BOUND (video minutes behind
    # the live audio, which rides its own trivially-decoded Opus PC; server + ABR blameless — 60
    # ticks/s and a clean worst-peer estimate all session; PCs with hardware AV1 unaffected). The
    # old "decode cost 2.8-3.6ms" verdict was measured on PC-class hardware only. AV1 STAYS the
    # default per Eric; the mitigation is the PER-ROOM codec override selectable in the lobby
    # ("video_codec" on the game start, patch 0036) — pick H.264 when a tablet will play: it is
    # hardware-decoded on effectively every device and its gop-size=120 IDR cadence naturally
    # bounds any receiver backlog.
    codec: av1
    threads: 0
    # ⚠ INERT for av1/h264: gstreamer.go only arms this when the encoder params carry the VPX-only
    # "keyframe-mode=disabled" token. Periodic keyframes for the NVENC codecs come from gop-size in
    # their params (see the av1 entry below). Kept for the vp8 fallback path, where it does work.
    keyframeInterval: 300
    # FULL-RANGE luma — shipped, reverted, then RE-SHIPPED after a real-Firefox WebRTC test
    # (2026-07-09; the full story is docs/arcade-quality-plan.md §17).
    #
    # The cores emit luma 0..255; without this key the pipeline converts to LIMITED (16..235),
    # discarding ~14% of code values. "1:3:5:1" (range:matrix:transfer:primaries = full:BT709:BT709:
    # BT709) makes the encode full-range and the SPS carries video_full_range_flag=1.
    #
    # The browser story, because it cost a full revert cycle: Chrome honours the flag (canvas values
    # match offline-decoded bytes EXACTLY). Firefox's FILE-PLAYBACK path does NOT (its displayed values
    # are the (y-16)*255/219 limited-read stretch) — that proxy result forced the revert. But Firefox's
    # WEBRTC path was then tested on a real laptop against a live room: its 1..15 dark-band mass matches
    # Chromium's (0.77%% vs 0.96%% — a limited misread would leave that band EMPTY), so WebRTC rendering
    # honours the flag in both browsers, and WebRTC is the only path this stream ever takes. Never trust
    # the file path as a proxy for the WebRTC path again.
    colorimetry: "1:3:5:1"
  list:
    # AV1 (patch 0024) — THE DEFAULT since 2026-07-09 (see encoder.video.codec above; h264 below is the
    # kept fallback for instant rollback / any future Safari need).
    # Measured offline against the RAW source frames, at MATCHED actual bitrate (nvav1enc overshoots its CBR
    # target by ~19%, so a naive same-`bitrate=` comparison flatters it by 2.4 dB — it isn't real):
    #   H.264 baseline  2,145,612 bytes  37.872 dB
    #   AV1             2,111,238 bytes  38.756 dB   (+0.884 dB for 1.6% FEWER bits, ~15% bitrate saving)
    # Verified live end-to-end: n64 1280x960, 60fps, 0 freezes, browser reports mimeType video/AV1 and
    # colorSpace.fullRange=true. Client decode cost rises (2.8-3.6ms vs 1.3ms for H.264) but nowhere near
    # the frame budget.
    #
    # NOT the default, purely a browser-support question: Chrome and Firefox both advertise video/AV1
    # receive; SAFARI DOES NOT. An AV1-only track means no video at all on a browser that can't decode it,
    # and CloudRetro negotiates one codec per room.
    #
    # ⚠ `av1parse` in the caps is not optional: Pion's AV1 payloader needs TEMPORAL-UNIT aligned OBUs.
    av1:
      # ⚠ gop-size is the ONLY periodic-keyframe mechanism on this pipeline. The top-level
      # keyframeInterval knob is INERT here: gstreamer.go arms its kfi path only when the params
      # contain the VPX-only token "keyframe-mode=disabled" (verified in source 2026-07-09), so the
      # previous gop-size=100000 meant an AV1 room emitted keyframes ONLY at startup + on joins
      # (patch 0012's join burst). CloudRetro ignores RTCP PLI, so any unrepaired loss or a browser
      # decoder hiccup then froze the video UNTIL THE NEXT JOIN while audio (aux PC) played on —
      # observed live on Firefox 2026-07-09, repeatedly. gop-size=120 = keyframe every 2 s, the same
      # cadence h264 shipped with for weeks; the "periodic IDR = audio hitch" rationale for infinite
      # GOP predates the aux audio PC (patch 0020) and no longer applies.
      # INTRA-REFRESH (2026-07-09): infinite GOP + a rolling intra wave every 2 s (15-frame wave).
      # Zero keyframe pulses — verified 600 frames -> exactly 1 keyframe. The properties come from
      # OUR patched nvcodec plugin (docker/arcade/gst-nvcodec-intrarefresh.patch — upstream GStreamer
      # left them as literal TODOs; the system libgstnvcodec.dll is the patched build, original kept
      # as .pre-intrarefresh.bak). ⚠ REQUIRED COMPANION: worker patch 0029 answers RTCP PLI/FIR with
      # a forced keyframe (rate-limited 500 ms) — with no periodic IDRs and PLI ignored, one
      # unrepaired loss would freeze a viewer forever (the exact bug fixed earlier today).
      # Join sync stays on patch 0012's join-burst. INSTANT ROLLBACK: gop-size=120, drop the
      # intra-refresh-* keys (works on the stock plugin too).
      #
      # TEMPORAL SVC (temporal-layers=3). NVENC emits a hierarchical-P pyramid — layer 0 references
      # only itself, so the SENDER can drop the upper layers for ONE peer without breaking anyone
      # else's reference chain. Each peer has its own Pion track/packetizer, so "drop a layer for this
      # peer" is literally "skip WriteSample" — no seq gaps, no NACKs, no Dependency Descriptor, and
      # the browser just sees a lower frame rate.
      #
      # This is what killed the worst-peer drag: ABR used to pull the room's ONE encode down to
      # whatever the weakest friend's link could carry, so one person on hotel wifi made the picture
      # worse for everybody. Now that peer gets fewer FRAMES and the room keeps its bitrate.
      #   tid<=0 = 28% of bitrate @15fps | tid<=1 = 54% @30fps | tid<=2 = 100% @60fps (measured)
      # A base-layer peer costs ~28% of what we send, so the room may run ~3.5x that peer's estimate.
      #
      # ⚠ NEEDS THE PATCHED PLUGIN: scripts/build-gst-nvcodec-patched.ps1 (upstream nvcodec exposes no
      # temporal-layer property for ANY codec, and it needs the SDK 13 header — SDK 12's
      # NV_ENC_CONFIG_AV1 has no enableTemporalSVC field at all). The GPU was never the limit: this Ada
      # 4070 Ti reports temporal_svc=1, 3 layers for AV1. Requires an NVENC 13.0 driver.
      # ⚠ A pacman -Syu that touches gstreamer restores the STOCK dll and this key stops doing
      # anything — silently, and the room falls back to 60fps-for-everyone + worst-peer ABR.
      # INSTANT ROLLBACK: drop temporal-layers=3 (the worker then reads 1 layer and never drops).
      params: "preset=p6 tune=ultra-low-latency rc-mode=cbr bitrate=5000 gop-size=-1 intra-refresh-period=120 intra-refresh-count=15 temporal-layers=3 zerolatency=true"
      caps: video/x-av1,stream-format=obu-stream ! av1parse ! video/x-av1,stream-format=obu-stream,alignment=tu
    h264:
      encoder: nvh264enc
      # gop-size=120 for the same reason as av1 above — keyframeInterval is inert on this path and
      # an infinite GOP freezes late joiners / post-loss viewers until someone joins (PLI ignored).
      params: "preset=p6 tune=ultra-low-latency rc-mode=cbr bitrate=5000 gop-size=120 repeat-sequence-header=true zerolatency=true"
      # ⚠ DO NOT ADD `,profile=high` HERE without also fixing SDP negotiation.
      #
      # It is tempting: measured offline against RAW worker frames (patch 0022 -> encode 120 deterministic
      # frames -> decode -> PSNR vs source), High profile is worth +1.02 dB at 8 Mbps (38.14 -> 39.16) and
      # +0.64 at 4 Mbps. CABAC + the 8x8 transform, free of latency.
      #
      # It was shipped for ~an hour and REVERTED. Without a profile in these caps nvh264enc emits
      # profile_idc=66 (Constrained Baseline), which is exactly what Pion advertises in SDP
      # (profile-level-id=42001f). Forcing High emits profile_idc=100 while the SDP still promises
      # baseline. Chrome decodes it anyway (verified live: gc/snes/ps1, 60fps, 0 freezes). Firefox's
      # WebRTC H.264 decoder is OpenH264, which only decodes SOME subsets of High
      # (https://bugzilla.mozilla.org/show_bug.cgi?id=1411681) — a friend on Firefox would get no video,
      # silently. Not worth 1 dB.
      #
      # The correct way to claim it is to register the H.264 codec with a matching profile-level-id
      # (e.g. 640028) in Pion's MediaEngine so browsers negotiate High honestly — at the price of Firefox
      # dropping H.264 entirely. The better answer is AV1 (patch 0024): +0.88 dB at MATCHED bitrate, and
      # Firefox DOES advertise video/AV1 receive. Safari does not.
      #
      # REJECTED by measurement: `multi-pass=two-pass-quarter` (37.51 dB, worse) and `spatial-aq` (36.98,
      # worse by construction — it moves bits to where the eye looks; PSNR cannot judge it, so it stays
      # off until someone A/Bs it on a real display).
      caps: video/x-h264,stream-format=byte-stream,alignment=au
    # In-band FEC ON (roadmap WS-A.2) — same override as the WSL stack; generic (not restricted-lowdelay)
    # + >=10ms frames are what make LBRR real. The gl-zone room binds a native Windows socket with no
    # mirrored-relay hop, so it's also the clean A/B control for the WS-A audio-loss hunt.
    opus:
      encoder: opusenc
      params: "audio-type=generic inband-fec=true packet-loss-percentage=15 frame-size=10 complexity=8 bitrate=96000"
  audio:
    codec: opus

storage:
  provider: ""    # never S3 — it would overwrite seeded saves at boot (arcade-saves-plan)
