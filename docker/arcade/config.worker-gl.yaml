# CloudRetro config for the Windows-native GL worker (roadmap WS-B, docs/arcade-windows-worker.md).
#
# This worker runs natively on Windows (MSYS2/UCRT64 build of ./cmd/worker) to get REAL NVIDIA
# OpenGL (WGL on a hidden window → GL 4.6 compat) for the GL 3D cores that WSLg's GLX/EGL can't
# host (flycast: dc/naomi/atomiswave, ppsspp: psp). It joins the SAME WSL coordinator
# (localhost:8000) but in a separate zone ("gl") so 2D/N64 rooms never land on it and vice-versa.
#
# The flat knobs (zone, singlePort, iceIpMap, coordinator, and the Windows paths) are set via
# CLOUD_GAME_* env in scripts/register-arcade-glworker-task.ps1 — this file carries the core list +
# encoder, exactly like docker/arcade/config.yaml does for the WSL stack. Run:
#   worker.exe --w-conf <dir containing this file renamed config.yaml>
# ⚠VERIFY at first boot (docs/arcade-windows-worker.md acceptance): NVIDIA GL 4.x context in the log,
# nvcodec present (else set encoder.video.codec: vp8), cores download from the windows/x86_64 buildbot.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# THIS FILE IS AUTHORITATIVE. It is the config BOTH GL worker tasks run — but each worker has its
# OWN ConfDir (worker-gl, worker-gl-2), and MUST: they would otherwise seed and harvest each other's
# memory cards (see cardVault below). Deploy this same file into each of them.
# It had drifted badly once: the repo copy lost the ps2/gc/2D core blocks that existed only on the
# worker box, so a redeploy would have silently reverted live tuning. Reconciled 2026-07-08.
#
#   Deploy:  scripts/deploy-arcade-glworker-config.ps1   ← ONE command does it all.
#            It diffs repo-vs-live, byte-copies this file into BOTH ConfDirs (worker-gl, worker-gl-2),
#            and GRACEFULLY recycles each worker whose running process is on a now-stale config so the
#            change takes effect immediately (the runner respawns in ~4s). -DryRun shows the diff only;
#            -Force also recycles a worker hosting a live room. Workers read config ONLY at startup, so
#            the recycle is what makes a deploy actually take — a bare cp is inert until then. (Belt AND
#            braces: watch-arcade-glworkers.ps1 check E ALSO auto-recycles a stale worker within a cycle
#            or two, so even a manual cp eventually self-applies; the deploy script just makes it instant.)
#            ⚠ Manual fallback (byte-exact copy — never Get-Content|Set-Content, it re-encodes → mojibake):
#            Copy-Item docker/arcade/config.worker-gl.yaml D:/ArcadeStorage/worker-gl/config.yaml (and
#            worker-gl-2), then scripts/recycle-arcade-glworker.ps1 -WorkerId N.
#            ⚠ Do NOT `Stop-Process worker -Force` to recycle. A force-kill of a GL/NVENC worker can
#            strand a kernel-stuck GPU-teardown thread → an UNKILLABLE zombie holding this ConfDir
#            locked (the PID-7948 class, 2026-07-15). The recycle script stops it GRACEFULLY (stop-file
#            sentinel), forces only as a fallback, and VERIFIES the kill.
#            (An earlier version of this note also claimed a force-kill dumps PCSX2's shader cache —
#            RETRACTED 2026-07-15: the cache appends immediately on compile, kills lose nothing. The
#            zombie risk above is the sole reason for the graceful path. docs/arcade-stuntman-plan.md)
#
#   ⚠ The SAME applies to game-overrides.json (per-game fps/core-option fixes, written by
#     `arcade-gameconfig-export -o <ConfDir>/game-overrides.json`). It is resolved from the worker's
#     CWD, i.e. PER ConfDir — export it into EVERY one. It was empty in worker-gl and absent from
#     worker-gl-2 (2026-07-13), which is harmless only while the manifest is empty: the moment a game
#     needs a fix, it would apply or not depending on which worker the coordinator happened to pick.
#     (Per-ROM fixes normally ride the emulators' OWN databases; this manifest is the exception path.)
#
# Edit HERE, then deploy. Never hand-edit the copy on D: — that is how the drift started.
# ⚠ Keep this plain UTF-8, no BOM. The D: copy had accumulated 27 mojibake sequences from a
#   PowerShell write with the wrong encoding; repaired during the reconcile.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

coordinator:
  origin:
    userWs: "https://theater.carpouzis.com"

library:
  # Native Windows path — NO /mnt/d translation on this worker. Overridable via CLOUD_GAME_LIBRARY_BASEPATH.
  basePath: "D:/ArcadeStorage/roms"
  watchMode: true
  # Room ids carry the SITE's system code (ArcadeGame.System), and the worker resolves the ROM
  # inside that system so a name shared with another system can't be launched by mistake (patch
  # 0037). It scopes by ROM sub-folder, which IS the site's code for every system except these
  # two. Add a line here whenever a new system's folder name differs from its site code —
  # otherwise it silently falls back to the old, unscoped, cross-system lookup.
  systemAliases:
    ps1: psx      # site "ps1"    -> roms/psx   (core key "pcsx")
    arcade: mame  # site "arcade" -> roms/mame  (core key "mame")

emulator:
  # GL ZERO-COPY (3D cores only: n64/gc/ps2/psp/dc). Hand the encoder the texture the core just
  # rendered instead of pulling every frame back to system memory with glReadPixels.
  #
  # The readback is SYNCHRONOUS and runs on the EMULATOR THREAD, so the core blocks on it. Measured
  # (CLOUD_GAME_GL_READBACK_STATS=1, which is still there for the A/B):
  #   GameCube (F-Zero GX)  1920x1584  11.6 MB/frame   p50 3.7-4.2ms  p95 6-8ms   max 14ms
  #   N64 (Mario Kart 64)   1920x1440  10.5 MB/frame   p50 3.0-3.2ms  p95 5.3-5.8ms
  # i.e. the core sat idle for ~a QUARTER of a 60fps frame budget, up to half at p95. Note the cores
  # render far LARGER than we encode (efb_scale / internal res), so the readback was ~11 MB/frame, not
  # the 1280x1056 we ship.
  #
  # nvav1enc takes video/x-raw(memory:GLMemory) in RGBA directly, so the frame never leaves VRAM:
  # appsrc(GLMemory) ! glcolorscale ! nvav1enc — no download, no upload, no videoconvert. The core's
  # frame is copied GPU->GPU into a small texture pool first (graphics/zerocopy.go) so the core can
  # render the next frame immediately without racing the encoder.
  #
  # Software (2D) cores ignore this entirely — their frames are already in system memory, there is
  # nothing to keep on the GPU. The capture lane has its own zero-copy (capture.zeroCopy).
  # ROLLBACK: set false. The readback path is untouched and stays the A/B baseline.
  glZeroCopy: true
  # autosave RE-ENABLED 2026-07-12. Without it the ONLY write to disk is a graceful room close, so a
  # killed or crashed worker loses the whole session — that is not theoretical: a worker restart mid-race
  # cost a player ~18 min of a race game (all three re-boots logged "Arcade save none (fresh)"), and the
  # known exit-139/exit-1 teardowns would do the same to any player. Autosave gives the gateway a recent
  # <roomId>.dat to harvest into the vault even when the process dies without a goodbye.
  #
  # It was 0 because the autosave path AV'd (glworker-2.log 2026-07-05, 0xc0000005 at autosave(0x3c)):
  # SaveState called retro_serialize_size DIRECTLY on the autosave goroutine — off the emulator's libco
  # thread — and PPSSPP's serialize_size touches live emu state. Worker patch 0030 FIXED exactly that
  # (serialize AND its size probe now run on the core's own thread), so the reason for 0 is stale.
  #
  # A serialize STOPS the emulator for its duration, and the GL cores' states are big (Dolphin
  # ~122 MB, PCSX2 ~50 MB) — the serialize memcpy IS the hitch (~126ms on gc, ROOT-CAUSED 7/18:
  # Eric's F-Zero spikes landed exactly on the 120s autosave grid). 300s per Eric's call 7/18:
  # one hitch per 5 min, crash-loss bound grows to 5 min. Autosave writes the CONTINUE slot (0); it
  # can never touch a player's Save, which lives in the reserved quicksave slot (SaveStore.QuickSlot).
  autosaveSec: 300
  storage: "D:/ArcadeStorage/saves"    # overridable via CLOUD_GAME_EMULATOR_STORAGE

  # (Wedge handling is NOT a tunable and deliberately has no knob here. A room closes when its last
  #  player leaves — an event, not a timer — and the coordinator is now told the moment that happens
  #  rather than after the core finishes tearing down, so a hung core can no longer keep this worker
  #  marked BUSY. See Room.Close in patch 0041.)

  # Per-user VIRTUAL MEMORY CARDS (patch 0039). A card is the one save class libretro never exposes —
  # PCSX2 and Dolphin write theirs into their own dirs — so until now it was ONE file shared by every
  # player, outside the save vault and unbacked. For some games the card IS the progress: Gauntlet
  # Dark Legacy keeps its named characters on the GameCube card, not in the save-state.
  #
  # The worker does the seed/harvest because only it knows which card dir is in play (the COORDINATOR
  # picks the worker, so the gateway can't know) and it runs one room at a time. That is why each GL
  # worker now has its OWN ConfDir — two workers sharing one would seed and harvest each other's cards.
  #
  # Paths are "<root>:<relpath>", root = save or system. NOTE the save root is the dir the CORES see,
  # <ConfDir>/libretro/legacy_save (nanoarch.go), NOT `storage:` above — that one holds CloudRetro's
  # own room-keyed save-states. Get this wrong and you vault an empty directory forever.
  #
  # ONLY the card moves. Everything else in these dirs is shared, disposable, or sacred: the save dir
  # also holds Dolphin's ~850 MB of shader cache and PPSSPP's config, and dc's card sits IN the BIOS
  # dir. If the last path element contains a wildcard the card is that FILE SET rather than the whole
  # directory (patch 0041) — that is the only safe way to express dc.
  cardVault: "D:/ArcadeStorage/cards"      # <vault>/<userId>/<system>/
  cards:
    gc:  "save:User/GC"                    # Dolphin: <region>/Card A/*.gci
    # Wii: the WHOLE Dolphin NAND (User/Wii — title saves, SYSCONF, Mii db, shared2, everything),
    # not just a save subfolder. Checked against Common/NandPaths.cpp + Core/WiiRoot.cpp: a disc
    # game's save data lives at Wii/title/<hi:08x>/<lo:08x>/data (GetTitleDataPath), sitting inside
    # Wii/ alongside SYSCONF (shared2/sys/SYSCONF) and the rest — there is no card-only subpath that
    # excludes the console-wide bits, the way GC's Card A file does. That turns out fine: Dolphin's
    # Wii NAND is HLE and self-formatting (WiiRoot.cpp — no real IOS/Nintendo NAND dump needed), so
    # an EMPTY Wii/ boots exactly like a brand-new console and Dolphin recreates SYSCONF etc. on its
    # own. So "fresh card = new console" (the existing ClearDir branch in seedCards) already does the
    # right thing here — same as GC's Card A, just a bigger subtree. Side effect: each player also
    # keeps their own Wii Menu settings/Mii, not only game saves, which is arguably more correct.
    wii: "save:User/Wii"
    ps2: "system:pcsx2/memcards"           # PCSX2: Mcd001.ps2 / Mcd002.ps2
    psp: "save:PSP/SAVEDATA"               # PPSSPP memstick: ms0:/PSP/SAVEDATA/<TITLEID>. Deliberately
                                           # NOT PSP/SYSTEM (ppsspp.ini + CACHE) or PSP/PPSSPP_STATE.
    dc:  "system:dc/vmu_save_*.bin"        # flycast VMUs A1-D1 — loose files sharing the Dreamcast
                                           # BIOS dir (dc_boot.bin, dc_flash.bin, data/), so this MUST
                                           # stay a glob. A dir spec here would vault the BIOS per user
                                           # and overwrite it on the next seed.
                                           # dc_nvmem.bin is machine state (clock/language), not a
                                           # card: it stays shared on purpose.
    # 3ds (citra, 2026-07-24): citra writes game saves as a DIRECTORY tree, not SAVE_RAM (.srm) the way
    # melonDS/nds does — so 3DS is the one carded core whose save is a dir. This is the virtual SD card:
    # retail game saves land at Citra/sdmc/Nintendo 3DS/<id>/<id>/title/<hi>/<lo>/data/... (Mario Kart 7's
    # systemN.dat verified there). One "SD card" per user holding all their 3DS saves, mirroring a real
    # console. sdmc ONLY, deliberately NOT the whole Citra/ user dir: that also holds `shaders/` (the GL/Vk
    # shader disk cache — regenerable, it CHURNS as you play so a whole-dir card would balloon the per-user
    # blob and reformat it on every fresh seed) and `cheats/`. KNOWN GAP: nand/extdata (Mii, Play Coins,
    # StreetPass + the handful of games that save there) is NOT covered — a single-path card can't express
    # "sdmc + extdata but not shaders". Revisit if a game's real progress proves to live in extdata.
    3ds: "save:Citra/sdmc"
    # naomi + atomiswave (flycast/reicast, 2026-07-24): these arcade boards have no VMU — flycast writes
    # per-game NVRAM/EEPROM as loose files in the SHARED save/reicast/ dir (<rom>.nvmem/.nvmem2/.eeprom;
    # verified: crzytaxi/ikaruga = naomi, mslug6 = atomiswave). NOT SAVE_RAM, so the .srm harvest missed
    # them entirely. A `*` GLOB (not a whole-dir spec) is REQUIRED because naomi AND atomiswave share this
    # one dir: a glob card gets a system-scoped `.owner-<system>` stamp, and each seed clears+restores only
    # the (user, system) set — so switching systems swaps the dir safely and the two never cross-vault.
    # dc does NOT use this dir (its saves are the system:dc VMUs above), so reicast/ is naomi+atomiswave only.
    naomi:      "save:reicast/*"
    atomiswave: "save:reicast/*"
    # segacd (genesis_plus_gx, 2026-07-24): the Sega CD INTERNAL backup RAM is a per-region console-wide file
    # scd_<region>.brm in the save root (verified: scd_U.brm + scd_J.brm), shared across all Sega CD games
    # like the real console's internal BRAM — written as a FILE, not SAVE_RAM, so it wasn't vaulted. Glob so
    # it's a fileset with a system-scoped owner; cart-RAM saves (if any) still ride the normal .srm path.
    segacd:     "save:scd_*.brm"
    # saturn / 3do / cdi / arcade (2026-07-27). The 07-24 audit GUESSED these were SAVE_RAM-covered and
    # left them "unconfirmed". They are not — inspecting the live save root found each core writing its
    # saves as FILES into a SHARED dir, i.e. one save visible to (and overwritable by) every player, the
    # exact class of gap the card vault exists to close. Paths verified on disk, NOT inferred: the saves
    # sit in SUBDIRS, so the obvious `save:<coredir>/*` would have vaulted nothing at all.
    #   saturn  kronos/saturn/<game>.ram          — Kronos per-game internal backup RAM
    #   3do     opera/shared/nvram.0.srm          — Opera console-wide NVRAM (despite the .srm name it is
    #                                               a file the core writes, never RETRO_MEMORY_SAVE_RAM)
    #   arcade  fbneo/<game>.fs                   — fbneo per-game memory/NVRAM
    saturn: "save:kronos/saturn"
    3do:    "save:opera/shared"
    # ⚠ cdi MUST be the nvram subtree, NEVER `same_cdi/*` or the whole dir: same_cdi/ ALSO holds cfg/
    # (cdimono1.cfg + default.cfg — MAME machine config, shared and not a save). A whole-dir card would
    # vault the machine config per user and stomp it on the next seed — the same trap dc's BIOS dir set.
    cdi:    "save:same_cdi/nvram"
    # arcade = BOTH fbneo cores. The worker's core keys are `mame` and `neogeo`, but the CARDS MAP IS
    # KEYED BY THE SITE'S SYSTEM CODE from the room id, and the site has no mame/neogeo system — all
    # 36,325 arcade cards are system `arcade` (verified against ArcadeGame). One key covers both cores,
    # and since nothing else writes to fbneo/ there is no cross-system hazard here (unlike reicast/).
    # Glob, not a dir spec: only the loose save files move, so a subdir the core may add later is left
    # alone rather than silently vaulted.
    arcade: "save:fbneo/*"
    # scummvm (2026-07-27) — the fifth unvaulted system, and the one that needed its path PROVEN rather
    # than assumed. Its saves were NOT under any core dir at all: scummvm.ini carried
    # savepath=D:/ArcadeStorage/saves/scummvm, i.e. the GATEWAY's saves mount, which no card can reach
    # (specs root at save:/system: only) and which the gateway's own harvest sweep ignores (it scans root
    # .dat/.srm + coresaves/<sessionId>/). One save folder for every player on both workers, unvaulted.
    #
    # Fix was to DELETE that savepath line (data/arcade/scummvm-deploy.ini): with it unset the libretro
    # backend falls back to the frontend-provided save dir. VERIFIED by booting a real Day of the
    # Tentacle room and reading what ScummVM wrote back into its own ini:
    #     savepath=D:\ArcadeStorage\worker-gl-2\libretro/legacy_save
    # — per-worker, and card-vaultable. Leaving it unset also keeps the deployed ini PORTABLE: each
    # worker self-heals to its own ConfDir, so one repo file still serves both.
    #
    # ⚠ It resolves to the ROOT of legacy_save, shared with every other core's files — so this MUST be a
    # narrow glob, never a dir spec (that would vault every core's saves into one user's ScummVM card).
    # `*.s[0-9][0-9]` is ScummVM's own <target>.s## slot naming and is deliberately tighter than `*.s??`,
    # which would also match a stray `.srm`. Verified to match nothing else at either root today.
    scummvm: "save:*.s[0-9][0-9]"

  # Wii SD-card + ELF/DOL loader boot (Brawl mods: Project REX, Smash Bros Infinite — 2026-07-18). A
  # small number of Wii ROM hacks crash when baked onto a standalone disc because their own
  # file/config loader (BrawlEx, here) only reliably reads from a real SD card. These ship as a
  # loader ELF/DOL (the ArcadeGame row's RomPath/content) instead of a disc image; before that ELF
  # boots, Dolphin needs [Core] WiiSDCard/WiiSDCardPath pointed at the mod's own SD card image AND
  # [Core] DefaultISO pointed at a paired "vanilla"/no-GCT base disc — Dolphin's stock Boot.cpp
  # (SetDefaultDisc) auto-inserts DefaultISO on any ELF/DOL ("Executable") boot, unmodified upstream
  # behavior, the same thing `Dolphin.exe -e loader.elf` does for the equivalent LOCAL setup
  # (Setup-BrawlSDMod.ps1, docker/arcade/../../.. Romhacks/Smash Brothers Brawl Mods/).
  #
  # <assetsDir>/<CloudRetroGameKey>/{sd.raw, base.<ext>} — folder name MUST equal the .elf's filename
  # sans extension (same convention as CloudRetroGameKey / game-overrides.json's romName key). Only
  # the two files above are read; base.<ext> is looked up by glob so either a base.iso or a
  # space-saving base.rvz works. Missing folder = ordinary ROM, not an error — every other Wii/GC
  # title (and any future one) is untouched.
  #
  # The worker (not the gateway) does this seed, right alongside the memory-card seed above and for
  # the same reason: only it knows which ROM is about to load, and Dolphin.ini is shared by every
  # Wii/GC room this worker ever serves, so a room WITHOUT a matching asset folder must explicitly
  # disable WiiSDCard rather than silently inherit a previous room's mount. The SD card image itself
  # is copied fresh into this worker's own systemDir on EVERY boot (never vaulted/harvested — it is
  # not per-user save data, it's static mod content re-copied from the shared master each time).
  # base.<ext> is opened READ-ONLY by Dolphin (disc emulation never writes back) so it's referenced
  # directly from assetsDir, no copy.
  wiiSdLoader:
    assetsDir: "D:/ArcadeStorage/wiisd-assets"

  libretro:
    saveCompression: false
    cores:
      repo:
        sync: true    # per-OS: pulls windows/x86_64 .dll cores from buildbot.libretro.com/nightly
      list:
        # PS1 leaks onto this pool when zoning is off (ArcadeZoningEnabled=false): the coordinator hands a
        # PSX room to any free worker. Without a pcsx entry the core falls back to the binary's EMBEDDED
        # default, which supplies NO memory-card option → pcsx logs "non memcard config?" and boots with no
        # card. Mirror the WSL pool's PS1 fix (docker/arcade/config.yaml) so a leaked PSX room works here too:
        # memcard1=libretro exposes card 1 via RETRO_MEMORY_SAVE_RAM (.srm), dualshock pads for analog games.
        # ── PS1 on Beetle PSX HW / VULKAN (W8, 2026-07-16) — LIVE. Hardware Vulkan renderer (parallel-psx):
        # real 3D + internal upscale, replacing pcsx_rearmed's software enhancement. Negotiation v2/no-callbacks
        # -> v1 create_device, zero-copy ACTIVE, NO synthetic surface needed. CTR renders 60fps/640x480 moving,
        # SotN survives its hi-res intro + mode changes (caps-reneg handles the varying delivered sizes).
        #
        # ⚠ THE SCANLINE OPTIONS BELOW ARE LOAD-BEARING — DO NOT REMOVE. Without them beetle FROZE at the
        # BIOS->game transition (~frame 147): its display_height collapsed to 1-2 lines (video_cb 1400x4 /
        # 560x2), sub-16px-guarded to a dead stream (root-caused live with CLOUD_GAME_VK_DEBUG + beetle source
        # rhi_lib_vulkan.c:7104 display_height = last_scanline - initial_scanline + 1). Cause: beetle's
        # core-options-v2 default for last_scanline is a bad first-value token ("210", not the C default 239),
        # and the unset option collapsed the range at the transition — the "values not labels" / embedded-default
        # class (dolphin patch 0016, pcsx frameskip). Pinning the full NTSC/PAL scanline window fixes it. See
        # RESULTS-vulkan-w3.md §W8-LIVE.
        #
        # ROLLBACK to the healthy software path: lib: pcsx_rearmed_libretro + drop hwContext/isGlAllowed/vfr/
        # usesLibCo + scaleMethod: nearest-neighbour + options {pcsx_rearmed_drc:enabled, frameskip_type:disabled,
        # pad1type/pad2type:dualshock, memcard1:libretro, memcard2:none, neon_enhancement_enable:enabled,
        # neon_enhancement_tex_adj_v2:enabled}. pcsx_rearmed stays on the fleet (repo.sync).
        pcsx:
          # CORE UPDATED 2026-07-18 to libretro buildbot nightly (DLL dated 2026-07-16, md5
          # e9d05ea4db030d668b6852a26d4910fd): fixes the SotN dog-death BLACK-RECTANGLE flash — a
          # hardware_vk semi-transparency artifact our old DLL (md5 d5331122...) showed on every kill.
          # A/B'd mechanically via the quicksave dog-kill repro (sotn-dog-repro.mjs): same config, same
          # save, same scene — old DLL flashes, nightly clean across 3 kills. Nightly verified: v5 vk
          # interface, zero-copy ACTIVE, all 9 pinned options recognized (no dead keys), old save-states
          # load, Crash 60fps. Rollback: assets\cores\mednafen_psx_hw_libretro.dll.pre-nightly.bak on
          # both workers.
          lib: mednafen_psx_hw_libretro
          roms: ["m3u", "cue", "chd"]
          folder: psx
          isGlAllowed: false          # Vulkan by default (see hwContext); GL zero-copy arming stays off
          hwContext: "vulkan"         # PS1 renders on Beetle PSX HW's Vulkan renderer via the capture path
          coreAspectRatio: true       # hw core reports av geometry (Flip contract) — see the psp/gc note
          vfr: false                  # correct game speed (matches ps2/n64/psp/dc/gc capture arms)
          usesLibCo: true             # retro_run + context_reset on one cothread (Vulkan-capture brings the
                                      # device up there). Non-libco crashed the worker (exit 2), live.
          # beetle pins base at PSX native (System A/V >>> 320x240 (1400x1152)) and puts internal-res in
          # max_width (the flycast pattern): scale:2 makes base(320x240)x2 == the 2x internal frame a
          # passthrough (patch 0015 caps-reneg), so full hardware detail reaches NVENC. Delivered sizes vary
          # by PSX display mode (1400x960 / 560x480 / ...); the caps-reneg tracks each.
          scale: 2
          scaleMethod: bilinear2
          options:
            beetle_psx_hw_renderer: "hardware_vk"   # Vulkan renderer (VALUE token verified from the DLL)
            # 4x internal (Phase 2 default-on raise 2026-07-18, was "2x round-1"). beetle puts internal-res
            # in max_width; scale:2 defines the encode OUTPUT at base(320x240)x2 while patch-0015 reneg tracks
            # the SOURCE — so 4x renders ~2x bigger than the encode target and DOWNSAMPLES (bilinear2) = pure
            # supersample AA on top of more 3D polygon/edge detail, at UNCHANGED encode geometry (no bitrate/VBV
            # change). The 4070 Ti eats 4x for PSX trivially. SMOKE reads the [video] caps line: if encode
            # geometry balloons past the 2x sizes (i.e. output tracks the 4x frame instead of supersampling)
            # or 60fps drops, roll back. ROLLBACK: "2x". (8x is the next step if 4x proves clean + wanted.)
            beetle_psx_hw_internal_resolution: "4x"
            # super_sampling was TESTED for SotN's death-sprite flash and REVERTED (2026-07-17): Eric confirmed
            # the flash persisted AND it cost sharpness (it downsamples 2x→native). Not the fix. The flash is a
            # beetle-hw semi-transparency artifact (the A/B ladder — internal_res 1x / dither / pgxp / sw
            # renderer — runs off a save-state repro, no default flip until proven). Do NOT re-add blindly.
            beetle_psx_hw_pgxp_mode: "disabled"     # PGXP off round 1 (geometry correction; per-title later)
            beetle_psx_hw_enable_memcard1: "enabled" # memcard 1 via RETRO_MEMORY_SAVE_RAM (.srm)
            # ⚠ SCANLINE WINDOW — pin the FULL range explicitly (see the block header). beetle's unset-option
            # default collapsed display_height at the game transition and froze the stream.
            beetle_psx_hw_initial_scanline: "0"
            beetle_psx_hw_last_scanline: "239"
            beetle_psx_hw_initial_scanline_pal: "0"
            beetle_psx_hw_last_scanline_pal: "287"
            # crop_overscan ENABLED (2026-07-18, coordinator bars verdict). The bars ARE core-baked: beetle
            # declares a constant AR=1.3333 for every mode because its output frame IS the full PSX raster
            # INCLUDING the horizontal-blanking overscan border regions a CRT hid — our W8 scanline pins
            # (crop_overscan:disabled + full 0/239 scanline window) make beetle emit those borders, the client
            # is object-fit:fill, and our scaler faithfully fills the declared 4:3 with border and all. So the
            # earlier "GPU scale step / per-mode letterbox" theory (2026-07-17) is DEAD; enabling crop_overscan
            # crops the horizontal blanking = the side pillars. The 2026-07-17 "didn't fix" trial ran under
            # hardware_vk and crop_overscan may be renderer-dependent (beetle's GL vs Vulkan rasterizers), so
            # this is smoked VISUALLY per-renderer (SotN on its new per-title GL + a vk ps1 title). KEEP the
            # scanline pins — the W8 anti-collapse fix is the PINNING itself, not the specific crop value.
            # Vertical borders (~8 lines top/bottom from the 0/239 window) may remain — left this round (cropping
            # them trades content for cleanliness; Eric's taste call later). ROLLBACK: "disabled".
            # Token is disabled/static/smart (the 2026-07-18 nightly changed it from enabled/disabled — the
            # old "enabled" was a silently-ignored no-op). "smart" crops the horizontal-blanking overscan
            # borders dynamically per frame. Per-game config can override this via the config module.
            beetle_psx_hw_crop_overscan: "smart"
        # ── PS1 ALTERNATE CORE: pcsx_rearmed (the pre-Vulkan "PSX GL" / software core) ──
        # Selectable PER-ROOM via the site's render-profile "core" override (StartGameRequest.Core →
        # HandleGameStart), for PS1 games that want the pre-Vulkan pcsx_rearmed setup instead of the default
        # Beetle (e.g. SotN, whose pillarbox/flashing is a Beetle-Vulkan artifact). This core-key boots ONLY
        # when a room explicitly requests core "pcsx_rearmed"; the DEFAULT psx core stays Beetle (the `pcsx`
        # entry above), so nothing changes for a normal PS1 room. Options mirror the documented rollback path
        # (block header ~line 201) + the WSL GL config. Software-rendered: no hwContext / isGlAllowed (no hw
        # render context); 2x nearest upscale so H.264 chroma sits at/above native (the 2D-core lesson).
        # ⚠ SAVE ISOLATION: the SITE keys this core's saves under a distinct namespace from Beetle — a
        # pcsx_rearmed save-state handed to Beetle (or vice-versa) crash-loops the room (arcade hard rule).
        pcsx_rearmed:
          lib: pcsx_rearmed_libretro
          roms: ["m3u", "cue", "chd"]
          folder: psx
          scale: 2
          scaleMethod: nearest-neighbour
          options:
            pcsx_rearmed_drc: enabled
            pcsx_rearmed_frameskip_type: disabled
            # pad1type/pad2type REMOVED 2026-08-02: the DEPLOYED pcsx_rearmed_libretro.dll declares
            # neither key (the Phase 1 runtime extraction — they were among the catalog's removed dead
            # keys), and every live room confirmed it: `[opt] DEAD keys: pcsx_rearmed_pad1type,
            # pcsx_rearmed_pad2type`, 20/20 samples + a fresh 2026-08-02 15:09 boot (6/8 read). They
            # were copied from the pre-Vulkan WSL config where an older core build read them. Pad type
            # on this build follows the frontend's controller-port device, not an option. Removing a
            # key libretro was silently ignoring is a behavioral no-op; it just stops polluting every
            # room's reconcile with known noise.
            pcsx_rearmed_memcard1: libretro
            pcsx_rearmed_memcard2: none
            pcsx_rearmed_neon_enhancement_enable: enabled
            pcsx_rearmed_neon_enhancement_tex_adj_v2: enabled
        # GL 3D cores only — this pool exists for these. isGlAllowed + coreAspectRatio are the Flip
        # contract (without coreAspectRatio the GAME_START av payload is null and the client renders
        # the bottom-left-origin GL frame upside down — the exact n64 lesson). Mirror of the WSL
        # config's GPU-core block; keep in lockstep with CloudRetroHost.ZoneForSystem's "gl" list.
        psp:
          # CUSTOM core is LIVE under Vulkan (W10 P1 A/B, 2026-07-18). Under the Vk renderer the custom
          # core (real x86-64 JIT + fastmem) HALVED the idle-attract tick on GoW:CoO — steady meanTick
          # ~1.03 ms / maxTick ~2 ms vs stock 2.4-2.6 ms / 3-11 ms, 60 t/s, zero-copy active, content
          # verified, clean close. The GL-era "stock feels snappier" verdict predates Vk (renderer win is
          # GPU-side, custom's is CPU-side — they stack); Eric's remote feel-check is the outstanding gate.
          # ── ROLLBACK to stock (all THREE lines move together) ──
          #   lib: ppsspp_libretro   +   ppsspp_cpu_core: "IR JIT"   +   ppsspp_fast_memory: "disabled"
          #
          # ── The custom core (docker/arcade/ppsspp-custom-core.patch + ppsspp-build-core.bat) ──
          # Built the buildbot's way: libretro/Makefile + MSVC, static /MT — NOT CMake, NEVER MinGW. It
          # exists because Common/MachineContext.h blanket-disables the machine context for ANY libretro
          # build, even on Windows x64 where CONTEXT + AddVectoredExceptionHandler are available, so
          # InstallExceptionHandler() fails, fastmem has no AV-rescue handler, and a stray guest access is a
          # raw 0xC0000005 that kills the worker — which is exactly what pins STOCK to IR JIT + fastmem=off.
          # The patch re-enables the handler for AMD64 only (safe: Memory::HandleFault declines any fault
          # whose PC is outside PPSSPP's own jit buffer), so the custom core can run real JIT + fastmem.
          # Earlier "custom is 20% slower / has ~1 s stalls" verdicts were RETRACTED measurement artifacts
          # (CMake /MD build; investigator's own file scans). The Makefile /MT build is at throughput PARITY.
          #
          # ── What the crackle actually is (measured 2026-07-14, pace-diag II + client WebRTC stats) ──
          # An audio UNDERRUN, downstream of the emulator: a core stall (savedata LIST/load, first-use VFPU
          # LUT read, a heavy screen like the World Map) drops audio the client then conceals
          # (concealedSamples up, packetsLost 0). The audio-mastered REPAY pacer (fork 1d3aa7c) already
          # killed the SUSTAINED crackle — what's left is a RARE single-event underrun when one stall
          # momentarily exceeds the ~150 ms jitter buffer. Custom's only edge here is HEADROOM (lower
          # meanTick shaves the worst tails); it is NOT a throughput win. The stock-vs-custom rare-crackle
          # RATE is still un-quantified — an idle box won't reproduce it and a local test browser contends
          # on Ziggy and fabricates stalls (see the arcade-benchmark-isolation memory).
          #
          # The custom lib NAME pins it against repo.sync nightly overwrites (same trick as dolphin).
          lib: ppsspp_custom_libretro
          folder: psp
          roms: ["iso", "cso", "pbp", "chd"]
          # ── VULKAN ARM (W3, docs/arcade-vulkan-w3w4w5-spec.md) — PROPOSED, gated ──
          # PPSSPP's Vk backend has lower driver overhead + steadier frame pacing than GL; the win we
          # want is HEADROOM (a lower/steadier tick shaves the rare crackle's worst tails — see the
          # crackle note below). Flip = these TWO lines only; the whole GL arm (stock lib, IR JIT,
          # fastmem off, audioMaster, vfr, usesLibCo, hacks, scale, all options) is UNCHANGED and
          # renderer-orthogonal — cpu_core stays pinned to IR JIT + fastmem off on the stock lib either
          # way (the renderer is a frontend hw-context choice, not a CPU one). PPSSPP has NO renderer
          # core-option, so this is the ONLY way to put psp on Vulkan (verified: no ppsspp_renderer/
          # gpu_backend option key in the DLL) — the frontend's hwContext IS the whole selection, and a
          # per-GAME GL escape must use the explicit hwContext:"gl" override field (W3 F1), not a core
          # option. Rollback one-liner: isGlAllowed: true  +  delete the hwContext line.
          #
          # ⚠ NEEDS worker.w3fix.exe (the vk_synthetic_surface fix) — see the hacks note below. The audit
          # blocker was CONFIRMED LIVE 2026-07-16 (psp Daxter): PPSSPP armed vk, created its device with
          # our VK_NULL_HANDLE surface, then crashed 0xC0000005 right after "Creating Vulkan surface for
          # window (data1=0 data2=0)" — its LibretroVulkanContext echoes the frontend surface handle back
          # through its swapchain warp and queries surface caps on it through the REAL driver, and a null
          # handle AVs there. FIXED in the fork (commit 0baec66): behind the vk_synthetic_surface hack the
          # frontend hands the core a real hidden-window VkSurfaceKHR. Re-probe on worker.w3fix.exe:
          # expect "synthetic headless surface created", "hw render context: Vulkan", zero-copy ACTIVE,
          # 60 t/s, close ×5 clean. See RESULTS-vulkan-w3.md §W3.1-LIVE.
          isGlAllowed: false          # Vulkan by default (see hwContext); GL zero-copy arming stays off
          hwContext: "vulkan"         # psp renders on PPSSPP-Vk via the Vulkan-capture path
          coreAspectRatio: true
          # audioMaster (patch 0043). PPSSPP declares 44100 Hz and delivers ~43850 (733 samples/frame
          # where its own fps + rate imply 735.7). The pacer's fps floor always beats that slow audio
          # clock, so the core under-feeds the Opus encoder by ~250 samples/sec, forever — the client's
          # audio buffer drains in ~15 s and the player hears a faint crackle. audioMaster lets the audio
          # clock pull the loop slightly above the fps floor (bounded 2%) so the core produces exactly
          # what the encoder consumes. gc does NOT need this: Dolphin emits the 533.9 samples/frame it
          # promises, which is why GameCube is clean in the same browser.
          # ⚠ THIS LINE LIVES HERE, NOT IN config.yaml. Commit 44ff8cd put it in config.yaml only — the
          # retired CPU/docker config that NOTHING reads — so it reached the live worker solely as an
          # undocumented hand-edit, and was lost the moment this file was deployed over it (2026-07-14).
          audioMaster: true
          # vfr OFF (matches the working N64 mupen entry): the default vfr:true timestamps each encoded
          # frame by its VARIABLE wall-clock delta, which on this path plays back too fast (Sonic Adventure
          # ran double-speed, Patapon/LocoRoco unplayable). Fixed cadence paces the RTP timestamps to the
          # core's real fps → correct game speed.
          vfr: false
          # REQUIRED for GL cores (matches the working N64 mupen entry): libco runs context_reset AND
          # retro_run on ONE cooperative thread. Without it, nanoarch's non-LibCo path runs context_reset
          # at init on one thread but retro_run with per-frame LockOSThread/BindContext on another — GL
          # objects made in context_reset are then used cross-thread → 0xc0000005 crash at "Starting graphics".
          usesLibCo: true
          # CAPTURED-CRASH FIX (glworker.log 2026-07-05, Exception 0xc0000028 STATUS_BAD_STACK
          # "during external code execution"): at teardown nanoarch's deinitVideo() calls the core's
          # hw_render.context_destroy on the SMALL fixed-size libco coroutine stack; PPSSPP's destroy
          # recurses into the NVIDIA GL driver (nvoglv64.dll) deep enough to blow that stack → the
          # worker crashed (exit 2) and every player on it "disconnected". skip_hw_context_destroy is
          # the core-author-documented remedy ("May help with crashes, for example, with PPSSPP" —
          # config.yaml hacks doc): we skip the core's per-object GL free and let glCtx.Deinit() drop
          # the whole context immediately after (driver frees everything) — safe at teardown.
          #
          # PPSSPP CANNOT BE SERIALIZED, EITHER WAY — MEASURED, 2026-07-13 (patch 0041). Both paths lose:
          #   * WITHOUT skip_same_thread_save (serialize on the core's libco cothread, the path patch
          #     0030 built and that mupen/flycast use happily): the SAVE works — a PSP room wrote a 40 MB
          #     state and closed cleanly — but the core then wedges. 6 of 7 rooms booted (modules loaded,
          #     FBO created, encoder running with peers=1) and the emulation thread simply stopped:
          #     zero frames, zero pace-diag, forever. A wedge is WORSE than a crash — it pins the worker.
          #   * WITH it (serialize off-thread, below): PPSSPP access-violates in retro_serialize_size
          #     (0xC0000005) — which patch 0039's autosave turned into a crash every 120s.
          # So the core streams reliably only if it is NEVER serialized: keep the hack AND turn states
          # off (noSaveStates). PSP's progress is its MEMSTICK SAVE, which the card vault now carries
          # per-user (cards.psp), so nothing is actually lost — this is the same bargain the real console
          # made. Revisit only with a PPSSPP build whose savestates work under libretro.
          # skip_serialize_size_probe: with noSaveStates the probe's result is DEAD — nothing ever
          # serializes this core — yet the boot probe still calls retro_serialize_size, the exact
          # function documented two lines up as access-violating here (0xC0000005). It only ever fed
          # a log line ("Save file size: 128.0 MiB"). Keeping a known-fragile call for a value we
          # discard is pure downside, so don't make it. (Same reasoning as dolphin's, patch 0016.)
          #
          # ── hacks UNDER VULKAN (W3.2) ── hacks are UNCHANGED for the Vk arm, deliberately. On the Vk
          # teardown path (nanoarch.go deinitVideoVulkan) skip_hw_context_destroy makes us skip the
          # core's context_destroy, matching the PROVEN paraLLEl-GS/PS2 pattern (leak the core's Vulkan
          # objects into a device we then destroy — accepted, verified clean on back-to-back rooms).
          # NOTE the GL-stack rationale above (context_destroy recurses into nvoglv64.dll and blows the
          # small libco stack) is renderer-SPECIFIC and does NOT apply on Vk — PPSSPP's Vk ContextDestroy
          # is just WaitUntilQueueIdle + Vulkan object frees, and the 64 MiB same_thread stack (patch
          # 43cb002) covers it anyway. So DROPPING skip_hw_context_destroy on the Vk arm (to let PPSSPP
          # free its own Vulkan objects cleanly before device destroy) is a valid, arguably-cleaner
          # alternative — but the close ×5 gate decides. Keep it for the first arm (conservative + proven);
          # revisit only if reuse leaks or a close wedges. skip_same_thread_save + noSaveStates are
          # renderer-agnostic (PPSSPP still can't serialize on Vk) — keep. See RESULTS-vulkan-w3.md §W3.2.
          #
          # ── vk_synthetic_surface (W3.1 fix, REQUIRED for the Vulkan arm; needs worker.w3fix.exe) ──
          # PPSSPP's libretro Vulkan context demands a non-null VkSurfaceKHR (it echoes the frontend handle
          # back through its swapchain warp and queries surface caps on it through the real driver). Our
          # headless frontend passed VK_NULL_HANDLE → 0xC0000005 at boot (CONFIRMED LIVE 2026-07-16). This
          # hack makes the frontend create a real hidden-window surface and hand it to create_device. It is
          # opt-in and inert on ps2/n64 (they never touch a surface). REMOVE this hack if psp ever rolls
          # back to GL (isGlAllowed: true) — it is meaningless on the GL path.
          hacks: [skip_hw_context_destroy, skip_same_thread_save, skip_serialize_size_probe, vk_synthetic_surface]
          # PPSSPP's per-game shader caches (<ID>.glshadercache / .vkshadercache) are format-tied to the
          # core build; a core update reading a stale-format cache is undefined. Same stamp/purge
          # mechanism as gc/wii (docs/arcade-shader-cache-plan.md G4a). Cache lives in the save dir
          # (NOT per-user-vaulted — the psp card is save:PSP/SAVEDATA only), so the purge can reach it.
          coreCache:
            dir: "PSP/SYSTEM/CACHE"
            purge: ["*.glshadercache", "*.vkshadercache"]
          noSaveStates: true
          # SUPERSAMPLING (patch 0023). MSAA is INERT on this core — libretro's hw_render FBO isn't
          # multisampled, so ppsspp/mupen64plus produce BIT-IDENTICAL frames with it on or off (only
          # Dolphin, which owns its framebuffers, really multisamples). The AA that DOES work here is to
          # render big and average down: `scale` < 1 shrinks. Measured on raw frames from the same source
          # image, 1920x1440 -> 960x720: hard edges 2.112% (nearest) vs 1.792% (bilinear2), a 15% drop.
          # ⚠ A fractional scale MUST be paired with a smooth scaleMethod — downscaling with nearest
          # point-samples and ALIASES rather than anti-aliases.
          # Render 1920x1088 (4x native), deliver 960x544: pure AA, no extra bitrate. ~0.64 CPU core.
          scale: 0.5
          scaleMethod: bilinear2
          options:
            # Phase-2 raise 4x->6x (2026-07-18): supersampled down to the unchanged delivery size.
            # ROLLBACK: "1920x1088".
            ppsspp_internal_resolution: "2880x1632"
            # Real x86-64 JIT — safe ONLY on the custom lib (its MachineContext patch installs the fastmem
            # AV-rescue handler; verify from the worker log: "Installing exception handler"). On the STOCK
            # lib this must be "IR JIT": stock has no exception handler, so fastmem's benign faults become
            # hard 0xc0000005 crashes in retro_run (all three lines together — see the lib: note above).
            ppsspp_cpu_core: "JIT"
            # 16x anisotropic (docs/arcade-quality-plan.md §17). dc/gc/ps2 all ship aniso; psp was the
            # one 3D core without it. Not an AA op — what it retains is texture detail at oblique
            # angles (the dc measurement: mid-frequency edges +7%, hard edges unchanged). Value token
            # "16x" read out of the DLL's option string table (it sits in the aniso value cluster),
            # not guessed — libretro silently ignores unmatched values, the recurring lesson.
            # Verified live: Daxter 960x540, 30fps content rate, 0 freezes/drops, no ppsspp crash.
            ppsspp_texture_anisotropic_filtering: "16x"
            # Core-author option: "gets rid of some visual artifacts" from unnecessary bilinear on 2D
            # UI/text elements — the PSP renders a lot of native-res 2D that plain filtering smears.
            ppsspp_smart_2d_texture_filtering: "enabled"
            # ENABLED — safe ONLY on the custom lib, whose patched MachineContext installs the AV-rescue
            # handler (3/3 fastmem arms ran clean). On the STOCK nightly this MUST be "disabled": the handler
            # is compiled out (MachineContext.h's empty __LIBRETRO__ branch) and IR JIT does not bypass
            # fastmem, so the first stray guest access is a raw host access violation that kills the worker —
            # which is why the core's own option text calls "enabled" Unstable (all three lines together).
            ppsspp_fast_memory: "enabled"
        dc:
          lib: flycast_custom_libretro
          folder: dc
          # "m3u" REQUIRED for multi-disc: the site collapses per-disc rows into one card that launches
          # "<name>.m3u" (ArcadeVersions.M3uKey) with in-game disc swap (patch 0005). Without the ext here
          # the scoped lookup (patch 0037) can't find the playlist under this system and falls back to the
          # global one, where gc/Dolphin owns .m3u — the exact segacd->Dolphin misroute. Single-disc unaffected.
          roms: ["m3u", "chd", "gdi", "cdi", "cue"]
          # ── VULKAN + zero-copy — LIVE 2026-07-16 (W4). dc renders on flycast-Vk, 60fps/0-freeze,
          #    zero-copy ACTIVE (set_image==zc_tex, 0 drops), VMU seed+harvest cycling, close x5 clean. ──
          # ── VULKAN + PER-PIXEL OIT ARM (W4, docs/arcade-vulkan-w3w4w5-spec.md) — PROPOSED, gated ──
          # flycast's Vulkan renderer (incl. the per-pixel OIT path, OITVulkanRenderer) fixes DC's chronic
          # alpha-sorting artifacts AND is expected to give the HEADROOM that made per-pixel OIT too
          # expensive on GL (rejected below at 58fps+3freezes). Flip = these TWO lines + the two OIT
          # options below.
          # ⚠ CRITICAL (static DLL audit, flycast_libretro.dll git 324d9c1): flycast has NO renderer
          # core-option — there is NO `reicast_renderer` key (only reicast_threaded_rendering), and a
          # `reicast_renderer:` line would be one of the SILENTLY-ignored unknown keys. So Vulkan is
          # selected PURELY by the frontend negotiating a Vulkan hw-context, i.e. hwContext:"vulkan" here
          # is the WHOLE mechanism (same worker-side path LRPS2/mupen use — it is NOT a config renderer
          # flip). There is likewise no OpenGL escape VALUE token; a per-GAME GL escape must use the
          # explicit hwContext:"gl" override field (W3 F1), NOT a core option.
          # Rollback one-liner: isGlAllowed: true + delete hwContext + delete the two OIT options.
          # UNBLOCKED 2026-07-16: the earlier "flycast-Vk not viable" verdict was WRONG. flycast IS a
          # genuine v1 core, but its v1 create_device honors our injected zero-copy extensions via the
          # custom core (flycast-custom-core.patch) — zero-copy is ACTIVE. The real crash was OURS: the
          # SET_HW_RENDER handler stored the core's retro_hw_render_callback POINTER, and flycast passes
          # a STACK-LOCAL struct (set_vulkan_hw_render), so context_reset later called a dangling/garbage
          # fn ptr (GPF PC=0/1 right after "zero-copy: ACTIVE"). Fix = copy the struct (nano_store_hw_render,
          # nanoarch.c/.go), matching RetroArch. See RESULTS-vulkan-w3.md §W4-LIVE.
          isGlAllowed: false
          hwContext: "vulkan"   # THE Vulkan-select mechanism (frontend negotiates a Vk hw-context)
          coreAspectRatio: true
          usesLibCo: true   # GL thread-affinity — see the psp note above (flycast GPF'd without it)
          vfr: false        # correct game speed — see the psp vfr note (Sonic Adventure ran double-speed)
          # QUALITY — flycast renders 1280x960 and we were THROWING 3 OF EVERY 4 SAMPLES AWAY.
          #
          # A raw frame dump at video_cb (patch 0022) proved it: with internal_resolution 1280x960 the
          # core hands us a 1280x960 buffer, but CloudRetro sizes the capsfilter OUTPUT from the core's
          # BASE geometry (640x480 — flycast never scales its base, its internal res goes to max_width).
          # videoconvertscale then downscaled 2:1 with the default NEAREST filter, i.e. point-sampled it.
          # Nearest downscale doesn't anti-alias, it ALIASES — strictly worse than rendering at native.
          #
          # The fix needs no worker patch. `scale` multiplies the base, and patch 0015 renegotiates the
          # SOURCE caps to the core's real frame size — so base(640x480) x scale(2) == source(1280x960)
          # makes videoconvertscale a passthrough and the full frame reaches NVENC. Verified: the client
          # receives 1280x960, 60fps, 0 dropped.
          #
          # ── scale UNDER VULKAN (W4) — expected UNCHANGED, must be live-confirmed ── flycast's
          # retro_get_system_av_info is renderer-AGNOSTIC (one code path; base = DC native 640x480,
          # internal-res multiplier → max_width) — the Vulkan renderer hands frames the same way the GL
          # renderer does, rendered at internal res and advertised base 640x480. So scale:2 should stay a
          # passthrough on Vk. This is INFERRED (static; flycast source not checked out) — the gated probe
          # MUST read the `retro_get_system_av_info: Res=` / `System A/V >>>` geometry line under the
          # Vulkan renderer: if base comes back as the internal res (not 640x480), re-derive scale to 1.
          scale: 2
          scaleMethod: bilinear2   # ⚠ REQUIRED: the source is now bigger than the output, so this is a
                                   # DOWNSCALE. nearest here would point-sample and alias.
          options:
            # ⚠ THE PREFIX IS `reicast_`, NOT `flycast_` — the DLL has 140 reicast_* keys and zero real
            # flycast_* keys, and libretro SILENTLY IGNORES unknown option keys.
            # Phase-2 raise (2026-07-18): 2560x1920 rendered, 1280x960 delivered (base 640x480 x
            # scale 2) => 2x supersample (was 1920x1440 = 1.5x). ROLLBACK: "1920x1440".
            reicast_internal_resolution: "2560x1920"
            # 16x anisotropic. `off` measured IDENTICAL to the core's stated default, so the default is
            # effectively off; 16 demonstrably changes the frame (mid-frequency detail +7%).
            reicast_anisotropic_filtering: "16"
            # ── ALPHA SORTING = per-triangle (dc default). PER-PIXEL OIT TESTED & REJECTED 2026-07-17. ──
            # Value tokens (verbatim from DLL, VALUES not labels): reicast_alpha_sorting ∈ {per-strip (fast,
            # least accurate) | per-triangle (normal) | per-pixel (accurate)}; reicast_oit_abuffer_size ∈
            # {512MB | 1GB | 2GB | 4GB} (NO space — the spaced "512 MB" forms are GUI translations).
            #
            # EVIDENCE CHAIN (menu-probe.mjs, RESULTS-vulkan-w3 §W4-OIT). per-pixel held 60/0-freeze in
            # in-level/attract play (Crazy Taxi, Sonic Adventure, Jet Grind Radio) — but it CORRUPTED and
            # FLICKERED the UI/punch-through text quads on MENUS: Crazy Taxi's VMU "A1" label rendered as
            # garbled "ΛΙ"/"A·1" changing frame-to-frame (frame-hash distinct≈frames = per-frame
            # instability). per-triangle renders the SAME quads CRISP (distinct stable). It is NOT an
            # abuffer overflow — 512MB AND 1GB were both garbled (sizing ruled out). It is NOT frame
            # ordering — the recurrence detector found no whole-frame staleness on the static menu (only at
            # scene transitions). Upstream corroborates per-pixel is a fragile flycast mode (libretro/
            # flycast #914 per-pixel crash, #691 can't-set). So the attract-only sample passed while menus
            # broke → the quality lever steps DOWN SYSTEM-WIDE per Eric's sampled-gate policy.
            # REVISIT trigger: a flycast upstream fix to per-pixel punch-through / UI-quad sorting.
            # per-pixel as a per-title opt-IN is BANNED (no-enrollment policy); a per-title opt-OUT is the
            # only allowed exception mechanism and none is needed here.
            reicast_alpha_sorting: "per-triangle (normal)"
            # reicast_alpha_sorting: "per-pixel (accurate)"   # REJECTED 2026-07-17 (menu UI-quad garble) — see evidence above
            # reicast_oit_abuffer_size: "512MB"               # only meaningful with per-pixel; kept for the revisit
            #
            # ⚠ reicast_threaded_rendering: LEFT AT DEFAULT (enabled). Disabling it (Option B, 2026-07-17) as a
            # zero-copy sync fix was TESTED AND REVERTED SAME DAY: Eric hit "crazy latency" (inline flycast
            # render blocks retro_run long enough to disturb the pacer/audio-master loop → frames queue
            # client-side) and the visual garbage/stale was inconclusive. Option B is PERMANENTLY off the table
            # for flycast. The real fix is Option A — a flycast custom-core patch that signals a renderComplete
            # VkSemaphore on the present-pass submit and passes it to set_image, which our deployed set_image
            # wait binds to (mirrors dolphin patch #3). See flycast-custom-core.patch hunk #2 + RESULTS-vulkan-w3.
          # ⚠ DC RESOLUTION IS NOT RAISEABLE FROM HERE. Measured 2026-07-08 (docs/arcade-quality-plan.md §10):
          # CloudRetro pins the encode size to the core's BASE geometry — Frontend.FrameSize() returns
          # nano.BaseWidth()/BaseHeight() (frontend.go:424) and ignores the per-frame size video_cb reports.
          # flycast ALWAYS advertises base 640x480 (its internal resolution lands in max_width — hence the
          # `System A/V >>> 640x480 (1706x1706)` log line). So `reicast_internal_resolution: 1280x960` was
          # ACCEPTED by the core (it logged `retro_get_system_av_info: Res=960`) and still delivered 640x480.
          # dolphin / ppsspp / mupen scale their BASE geometry, which is why gc (1280x1056), psp (960x544)
          # and n64 (960x720) really do stream at a higher resolution.
          #
          # A higher internal res could still SUPERSAMPLE (render 2x, downsample to 640x480) — plausibly
          # real AA — but we could not verify it: the probe reads the H.264-DECODED stream, and 5 Mbps
          # quantization erases exactly the sub-pixel gradients AA creates (hardEdgeFrac 1.986% @2x vs
          # 1.910% @1x on Crazy Taxi's static title screen — no smoothing, and the wrong direction). Left
          # at core defaults rather than burn GPU for an unverifiable gain. To settle it, compare RAW frames
          # at the worker, pre-encode — not the browser's decoded video.
          #
          # ⚠ If you DO add options here: THE PREFIX IS `reicast_`, NOT `flycast_`. The DLL exposes 140
          # reicast_* keys and zero real flycast_* keys, and libretro SILENTLY IGNORES unknown option keys —
          # a `flycast_*` line looks applied and does nothing. (docs/arcade-per-game-config.md named them
          # all wrong until 2026-07-08.)
          # Same libco-teardown stack-fault class as psp above (context_destroy on the small coroutine
          # stack → 0xc0000028). flycast's GL destroy is deep too; skip it and let glCtx.Deinit() drop
          # the context. Also de-risks the known DC teardown segfault + Power Stone mid-session death.
          hacks: [skip_hw_context_destroy]
          # PER-GAME FORCED FRAMERATE is now DATA-DRIVEN, not hardcoded here. The worker reads
          # game-overrides.json (generated by `arcade-gameconfig-export` from the ArcadeGameProfile table,
          # keyed by normalized game identity) at each game load. See docs/arcade-per-game-config.md.
          # The `fps4rom:` core-config field still exists as a static fallback, but production overrides
          # (e.g. Sonic Adventure 1/2 → 30fps for their frame-locked engines) live in the DB.
        naomi:
          lib: flycast_custom_libretro
          folder: naomi
          roms: ["zip", "chd", "lst", "dat", "bin"]
          # ── VULKAN + OIT (W4 lockstep, LIVE 2026-07-16) ── same flycast_custom core + mechanism as dc
          # (no renderer core-option; hwContext IS the selection; the hw_render copy fix in the worker is
          # what unblocked it). Inherits dc's PASSED OIT verdict. Per-game GL escape = hwContext:"gl" (F1).
          # Rollback: lib: flycast_libretro + isGlAllowed: true + delete hwContext + the two OIT options.
          isGlAllowed: false
          hwContext: "vulkan"
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          hacks: [skip_hw_context_destroy]
          # Same flycast base-geometry trap as dc: the core always reports base 640x480, so without an
          # explicit scale we would deliver 640x480 no matter what it renders. Kept in lockstep with dc.
          scale: 2
          scaleMethod: bilinear2
          options:
            reicast_internal_resolution: "2560x1920"   # Phase-2 raise, lockstep w/ dc; ROLLBACK "1920x1440"
            reicast_anisotropic_filtering: "16"   # flycast libco-teardown fault — see dc note
            reicast_alpha_sorting: "per-triangle (normal)"   # lockstep w/ dc: per-pixel REJECTED (menu garble), see dc block
            # reicast_alpha_sorting: "per-pixel (accurate)"  # REJECTED 2026-07-17 (see dc)
            # reicast_oit_abuffer_size: "512MB"
            # reicast_threaded_rendering: LEFT AT DEFAULT (enabled) — Option B disabling REVERTED (latency); see dc block. Fix = Option A semaphore patch.
        atomiswave:
          lib: flycast_custom_libretro
          folder: atomiswave
          roms: ["zip", "chd"]
          # ── VULKAN + OIT (W4 lockstep, LIVE 2026-07-16) ── see the naomi note above; same custom core,
          # hw_render fix, OIT verdict, and rollback one-liner.
          isGlAllowed: false
          hwContext: "vulkan"
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          hacks: [skip_hw_context_destroy]
          # Same flycast base-geometry trap as dc: the core always reports base 640x480, so without an
          # explicit scale we would deliver 640x480 no matter what it renders. Kept in lockstep with dc.
          scale: 2
          scaleMethod: bilinear2
          options:
            reicast_internal_resolution: "2560x1920"   # Phase-2 raise, lockstep w/ dc; ROLLBACK "1920x1440"
            reicast_anisotropic_filtering: "16"   # flycast libco-teardown fault — see dc note
            reicast_alpha_sorting: "per-triangle (normal)"   # lockstep w/ dc: per-pixel REJECTED (menu garble), see dc block
            # reicast_alpha_sorting: "per-pixel (accurate)"  # REJECTED 2026-07-17 (see dc)
            # reicast_oit_abuffer_size: "512MB"
            # reicast_threaded_rendering: LEFT AT DEFAULT (enabled) — Option B disabling REVERTED (latency); see dc block. Fix = Option A semaphore patch.

        # PS2 via pcsx2_libretro (LRPS2). GL 3D core like psp/dc: same isGlAllowed + coreAspectRatio
        # Flip contract, usesLibCo thread-affinity, and skip_hw_context_destroy teardown hack. Requires
        # the PS2 BIOS (scph39001.bin) staged in the system dir (both system/ and system/pcsx2/bios/).
        # Heaviest core we run: native internal res (upscale 1x, the core default) for the first boot to
        # prove the path on the 4070 Ti, bump pcsx2_upscale_multiplier once it renders. .cso = the
        # compressed-ISO master format (R:\Roms\Games\Sony Playstation 2), read directly by the core.
        ps2:
          # OUR PATCHED CORE (2026-07-14). Stock LRPS2 with ONE data edit: the Stuntman (SLUS-20250)
          # entry in the GameDB that is compiled into the DLL. Recipe + rationale + the byte-for-byte
          # constraint: docker/arcade/lrps2-patch-gamedb.py. NOT a code change — the executable code
          # is byte-identical to stock; 124 bytes of embedded YAML differ and nothing else.
          #
          # Why a patched DLL and not config: the GameDB is the ONLY way to reach roundModes/clampModes
          # (they are not core options), and the GameDB cannot be overridden — `pcsx2_use_external_
          # gameindex` is DEAD CODE in this port (re-tested 2026-07-14: still "12806 games on record",
          # and the core never even logs its own "External GameIndex.yaml not found" line). Setting the
          # GS fixes by hand instead would need pcsx2_enable_hw_hacks, which DISABLES the entire GameDB
          # auto-fix system for all 12,806 games. So: patch the data.
          #
          # The custom lib NAME is the guard: libretro.cores.repo.sync pulls nightly cores by name and
          # would silently overwrite a patched pcsx2_libretro.dll. Same trick as the custom Dolphin core.
          # ⚠ Re-run the script after any core update — it refuses to patch if the stock entry changed.
          # ROLLBACK: lib: pcsx2_libretro (stock is untouched and sits right beside it).
          lib: pcsx2_custom_libretro
          folder: ps2
          roms: ["m3u", "iso", "cso", "chd", "bin", "mdf", "zso"]   # m3u = multi-disc (see dc note)
          isGlAllowed: false   # Vulkan by default (see hwContext); GL zero-copy arming stays off
          # VULKAN BY DEFAULT: every PS2 game renders on paraLLEl-GS via the Vulkan-capture path.
          # Per-game GL escape: set pcsx2_renderer:"OpenGL" in game-overrides.json.
          hwContext: "vulkan"
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          # skip_boot_restore: PCSX2 "successfully" unserializes at boot into a wedged black GS,
          # then close-save re-serializes the wedge — a poison loop on the deterministic save id
          # (live 2026-07-09). Boot-resume stays OFF for ps2 until made safe; manual in-session
          # Save/Load (patch 0030) works.
          #
          # ⚠ DO NOT remove skip_hw_context_destroy to try to persist the GS shader cache (tried & REVERTED
          # 2026-07-15). PCSX2's context_destroy DEADLOCKS in our single-thread (LibCo/same_thread) model —
          # the room-close watchdog then kills the worker (exit 70) after 30 s, on EVERY ps2 close. A 64 MiB
          # same_thread stack (nanoarch.c) stopped the STATUS_BAD_STACK crash but NOT the deadlock. And it's
          # moot anyway: the gl_programs write does NOT live in context_destroy — it happens in
          # retro_unload_game (proven: the cache grew 71→98→101 across clean room-closes WITH this hack on).
          # The real cache-persist bug is elsewhere (see arcade-stuntman-audio-skip memory).
          hacks: [skip_hw_context_destroy, skip_boot_restore]
          # bootRestoreRetrySec (2026-08-08) — THE FIX for "lobby Resume does nothing on PS2".
          #
          # skip_boot_restore above defers the state restore to a fixed 5 s (patch 0032b). That is the
          # right mark for a core that is warm by then; PCSX2 is not. Fastboot is still in the BIOS /
          # ELF load at t+5 s — Stuntman's first game frame lands ~20-25 s in — so the state unserializes
          # into a pre-game VM, the continuing boot stomps it, and RestoreGameState returns nil anyway:
          # the log says "deferred boot-restore done" while the player watches the attract loop. Every
          # lobby Resume and named-snapshot start on ps2 was a silent no-op (diagnosed 2026-08-08; Eric's
          # 08-05 45 s room was him hitting it). The in-room 📂 Load button failed identically when
          # pressed early, which is where the "just click Load twice" habit came from.
          #
          # 22 s: comfortably past the first game frame, comfortably before a player gives up. The worker
          # keeps the 5 s attempt (free, and it wins outright on a fast-booting title) and re-fires the
          # SAME bytes once at this mark — which is exactly the second click, and idempotent.
          #
          # Two guards ride with the window, both from live regressions on 2026-08-08:
          #   * SAVES ARE HELD until the last attempt has run. The site's ~2 s pre-warm save (t=106) was
          #     serializing the BIOS screen over the seeded snapshot before the 5 s restore could read
          #     it — which is why Resume still failed after the re-fire shipped. Inside this window the
          #     .dat IS the player's save; nothing may overwrite it, including a human Save press
          #     (logged; at that age the live state is seconds from the seed anyway).
          #   * ATTEMPT 2 IS CANCELLED BY PLAYER INPUT. On a warm worker attempt 1 succeeds and the
          #     player drives off; re-restoring at 22 s stalled the room and silently threw the race
          #     back to the load point. A restore that arrives too late is worse than one that never
          #     fires. The in-room Load button is NOT auto-re-fired for the same reason — the player
          #     can see it and press it again, and the save hold keeps the bytes intact so it works.
          # Raising this widens BOTH guards; don't set it far past the core's first game frame.
          # 0 / unset = the old single-attempt behaviour, which is what every other core still gets.
          bootRestoreRetrySec: 22
          # noAutoSaveStates (2026-08-01) — REPLACES `noSaveStates: true`, which was set here on
          # 2026-07-22 and took a working feature down with it.
          #
          # What 07-22 was right about: the 120/300s autosave tick was minting whole-machine <roomId>.dat
          # states on a timer, paying a ~126 ms serialize stall each time on the heaviest core we run, for
          # a file nothing was going to boot from (skip_boot_restore). Killing THAT was correct.
          #
          # What it got wrong: it concluded from "boot-restore is off" that the states were dead weight
          # generally, and reached for the flag that refuses to serialize AT ALL. But boot-restore was
          # never how these were used — manual in-session Save/Load was (patch 0030 added it FOR ps2), and
          # the Stuntman audio investigation drove entirely off seeded slots. The evidence was already on
          # disk and pointed the other way: savestore\1\60439\slot-099.dat, 50 MB, dated 2026-07-17 —
          # slot 99 is the QUICKSAVE slot, which only a human ever writes. The "27 dead rows" that
          # justified the change were counting boot-restores that never fired, not saves nobody made.
          #
          # So the split is by WHO ASKED, not by which core: the automatic timer stays off the serialize
          # path (it harvests the card, exactly as before), while a deliberate save-state — the player's
          # Save/Load, save-on-quit, and the deferred warm-VM boot restore that lets you continue where you
          # left off — serializes normally. psp/scummvm keep the full noSaveStates: those cores CANNOT be
          # serialized at any time, which is a different fact about the core rather than a policy choice.
          #
          # ⚠ Watch on re-enable: save-on-quit + boot restore is the pairing that caused the 2026-07-09
          # poison loop (PCSX2 unserialized one tick after init into a wedged black GS, then close-save
          # wrote the wedge back). Patch 0032b is the mitigation and is what makes this safe now — under
          # skip_boot_restore the restore is DEFERRED ~5 s into a warm VM, the same path as a human
          # pressing Load, instead of running at init. If a black-GS resume ever reappears, that is the
          # mechanism, and the answer is the restore timing — not turning save-states off again.
          noAutoSaveStates: true
          # Build-stamp isolation for the GL shader cache (docs/arcade-shader-cache-plan.md G4b). We build
          # LRPS2 from source, and gl_programs written by one build can be garbage to the next (the same
          # struct-layout trap the gc/wii coreCache note documents). systemDir: the cache lives under the
          # SYSTEM dir (system/pcsx2/cache), not the save dir. Patterns are exact filenames on purpose —
          # the *.bak/*.frozen forensic copies in that dir must survive a purge. The paraLLEl-GS (Vulkan)
          # arm has NO disk cache to stamp: Granite only flushes at device teardown, which
          # skip_hw_context_destroy (above) permanently skips — NVIDIA's driver cache is that arm's warmup.
          coreCache:
            dir: "pcsx2/cache"
            systemDir: true
            purge: ["gl_programs.bin", "gl_programs.idx"]
          # PS2 games often render a narrower framebuffer than the base geometry (God of War: raw 1024x896
          # vs delivered 1280x896 — measured with the patch-0022 frame dump). CloudRetro stretches that to
          # the output width, and the DEFAULT resampler is nearest-neighbour, so a 1.25x stretch duplicates
          # columns unevenly — visible shimmer on a 3D image. bilinear2 resamples it smoothly. (2D cores
          # keep nearest: there the ratio is an exact integer and nearest is what preserves the pixel art.)
          scaleMethod: bilinear2
          options:
            # OpenGL renderer so PCSX2 draws into CloudRetro's libretro GL (WGL) hw-render context.
            # Auto/Vulkan/D3D would render to a private device the GL capture never sees -> black frame.
            pcsx2_renderer: "paraLLEl-GS"   # Vulkan GS renderer — the default (was OpenGL)
            pcsx2_pgs_high_res_scanout: "enabled"
            # BACK TO 8x (2026-07-22, the quality-tier review): the Phase-2 raise to 16x was "one step
            # past our old ceiling" on the heaviest core we run, gated only by an attract-mode smoke —
            # and slow-ROM reports followed. 8x is the proven ceiling; 16x now lives in the config
            # tool's MAX quality tier (ArcadeQualityPresets), a deliberate per-game opt-in. This value
            # is WELDED to ArcadeQualityPresets.UltraLiveSpec — change them together or the test fails.
            # ⚠ PS2 speed regressions present as AUDIO starvation (samples/frame ∝ fps) — smoke gate is
            # the HEAVIEST title (Stuntman attract), not an average one.
            pcsx2_pgs_ssaa: "8x SSAA (can high-res)"
            # Force Texture LOD0 (Phase-2 default-on 2026-07-18): per the core's own description, better
            # image quality with issues in "only a small handful of games" — the exact default-on/opt-out
            # shape. Per-title opt-out via game-overrides.json if a title mips wrong. ROLLBACK: delete
            # (core default disabled).
            pcsx2_pgs_disable_mipmaps: "enabled"
            # Boot straight into the game, skipping the PS2 BIOS boot animation (faster attract testing).
            pcsx2_fastboot: "enabled"
            # Name the BIOS explicitly. LRPS2 read "Bios Found: USA v01.60" from its root scan but the
            # VM-load scan of system/pcsx2/bios/ reported "no valid BIOS" until the file is named here.
            pcsx2_bios: "scph39001.bin"
            # PER-GAME FIXES AT SCALE (docs §18). LRPS2 ships a built-in GameDB — 12,806 games of
            # gamefixes, clamp/round modes and AUTOMATIC GS hardware fixes keyed by serial+CRC — and it
            # verifiably runs on our stack: God of War's boot logs "[GameDB] Enabled GS Hardware Fix:
            # alignSprite/roundSprite/autoFlush" all by itself. So the per-title upscaling fixes the
            # quality plan deferred to ArcadeGameProfile are ALREADY being applied automatically.
            # ⚠ Two rules keep it working: (1) pcsx2_enable_hw_hacks must stay OFF — enabling manual hw
            # hacks DISABLES the automatic GameDB fixes (the DLL says so verbatim); (2) don't bother
            # with pcsx2_use_external_gameindex — it was tried ("enabled" + GameIndex.yaml staged at
            # both <system>/resources and <system>/pcsx2/resources) and the code path never ran (no
            # "External GameIndex" log either way, count stayed 12,806). Inert on this port.
            # QUALITY (docs/arcade-quality-plan.md Phase 3). PS2 shipped at 1x native (640x448) — the
            # softest 3D system we have. LRPS2 scales its BASE geometry with the multiplier (unlike
            # flycast), so this really does deliver more pixels: 640x448 -> 1280x896.
            #
            # ⚠ THE VALUE IS THE WHOLE STRING, not "2" — verified by parsing the core-option structs out
            # of pcsx2_libretro.dll. An unmatched value silently leaves the option at its default.
            #
            # Gated on the bitrate path actually working: at the old stuck 5 Mbps this would have been
            # ~0.073 bits/pixel/frame vs ~0.29 at native — i.e. it would have looked WORSE. It ships with
            # per-system Auto bitrate (ps2 = 12 Mbps ceiling) + ABR (patch 0021) behind it.
            pcsx2_upscale_multiplier: "2x Native (~720p)"
            # pcsx2_hw_download_mode stays at the core default ("Accurate") — MEASURED and REJECTED
            # 2026-07-14 (Stuntman audio). It is under `Video >`, not `HW Hacks >`, so unlike the sprite
            # hacks it can be set WITHOUT tripping pcsx2_enable_hw_hacks and killing the GameDB auto-fixes
            # — which makes it the tempting lever for a game whose GameDB entry forces CPU sprite
            # rendering (Stuntman: cpuSpriteRenderBW=4), since "Accurate" syncs CPU/GPU on every readback.
            # It did cut slow ticks (~143 -> ~105 per 5 s window driving) but introduced 58-92 ms maxTick
            # spikes where the default has none, and BOTH arms already held a flat 60 fps / 48000 audio.
            # Paying for noisy headroom with "incorrect results in games that read back GPU-rendered
            # content" (the core's own words) is a bad trade in the one game whose texture fix IS a
            # readback. Revisit only with a deterministic bed and a visual diff.
            # Values: Accurate|Disable Readbacks|Unsynchronized|Disabled.
            # Sharpens ground/road planes at oblique angles, and it HELPS the encoder: less texture
            # shimmer = less high-frequency temporal noise to spend bits on. Values: disabled|2x|4x|8x|16x.
            # ⚠ DEAD KEY UNDER paraLLEl-GS (Phase-2 finding 2026-07-18, DEAD-keys instrumentation): the Vulkan
            # GS renderer NEVER queries pcsx2_anisotropic_filtering / pcsx2_blending_accuracy /
            # pcsx2_upscale_multiplier — the worker log emits "[opt] DEAD keys ... value INERT" for all three
            # (they belonged to the OLD GSdx OpenGL/Vk-HW renderer; paraLLEl-GS is a separate GS core with its
            # OWN option set). So this value does NOTHING; a Phase-2 8x->16x raise was tried and is a confirmed
            # no-op, reverted. PS2's REAL quality levers under pgs are pcsx2_pgs_ssaa ("8x SSAA", maxed) +
            # pcsx2_pgs_high_res_scanout ("enabled") below — those ARE queried and already at the ceiling.
            # Left at "8x" (harmless/inert) rather than deleted so the GSdx-renderer rollback path keeps it.
            pcsx2_anisotropic_filtering: "8x"
            # Blending accuracy Basic -> Medium: more correct transparency/blend effects, and it measured
            # free (60fps, 0 freezes, 0 dropped at 1280x896).
            pcsx2_blending_accuracy: "Medium"
            # NOTE: upscaling PS2 exposes per-game half-pixel/sprite misalignment. Those fixes are
            # per-title (pcsx2_half_pixel_offset, pcsx2_round_sprite, ...) and are all gated behind
            # pcsx2_enable_hw_hacks, which must NEVER be a global default. They belong in
            # ArcadeGameProfile.CoreOptionsJson (docs/arcade-per-game-config.md).
            #
            # ── STUNTMAN (SLUS-20250) per-game setup — 2026-07-15, see docker/arcade/lrps2-patch-gamedb.py ──
            # Two independent layers, because the fix it needs is split across a GameDB field and a core
            # option: (1) `eeClampMode: 3` (Full FP clamp) for its non-IEEE-FP "crazy car AI" softlock —
            # reachable ONLY via the GameDB, hence the byte-patched pcsx2_custom_libretro.dll (lib: above);
            # (2) `pcsx2_upscale_multiplier: "1x Native (PS2)"` in game-overrides.json to claw back the
            # audio headroom Full clamp + the 2x cpuSpriteRenderBW readback eat in heavy scenes. Round modes
            # were tried and RETRACTED (vuRoundMode tanked fps 3x; even eeRoundMode doesn't fix the AI).
            # Soft-float (PCSX2 #12001) — the only complete AI fix — is interpreter-only and NOT in this
            # core (binary-scanned), so it is off the table. Full rationale in the patch script's header.

        # Sega Saturn via Kronos (2026-07-18). The ONLY 3D core in this file that is NOT on the Vulkan
        # capture path: Kronos's renderer is OpenGL 4.3 compute-shader, mandatory (the legacy GL and
        # software renderers were both removed upstream) — there is currently no Vulkan Saturn core on
        # any libretro fork, so isGlAllowed:true/hwContext unset is correct here, not a rollback state.
        # Region-mixed BIOS: both sega_101.bin (JP) and mpr-17933.bin (US/EU) staged, plus a copy at
        # kronos/saturn_bios.bin (the core's own primary lookup path under the BIOS mount).
        # meshmode/bandingmode ON by default — VDP1 mesh transparency renders wrong (solid instead of a
        # dither pattern) on most Saturn cores without it; this is a library-wide correctness fix, not
        # a per-title tweak. addon_cartridge stays "none": a handful of fighting games (X-Men vs. Street
        # Fighter class) need a specific RAM-cart size to boot/save — that's a per-game override
        # (ArcadeGameProfile / game-overrides.json), same shape as the PS2 GameDB hack table, not a
        # global default. STAGE A PILOT FIRST (Panzer Dragoon / NiGHTS / Guardian Heroes are commonly
        # well-emulated) before trusting the full 2,522-game bulk ingest — Kronos compatibility is
        # documented as uneven across the tail of the library, and whether kronos_resolution_mode moves
        # the reported BASE geometry (Dolphin-style) or only an internal upscale (flycast-style, needing
        # our scale: workaround instead) is UNCONFIRMED — verify with scalecheck.mjs before raising it.
        saturn:
          lib: kronos_libretro
          folder: saturn
          roms: ["chd", "cue", "ccd", "iso", "mds", "zip", "m3u"]
          isGlAllowed: true
          # THE 0x3108 CRASH FIX (2026-07-18, gdb-proven): every crash was `jmp *0x3108(%rax)` with
          # rax=0 inside nvoglv64 — NVIDIA's per-thread dispatch stub with NO context current on the
          # calling thread (0x3108 = glMemoryBarrier's dispatch-slot offset; kronos's first retro_run
          # GL call). Init ran on the context thread; ticks ran on another. usesLibCo pins core
          # execution to the context thread — the same reason every other GL 3D core here sets it.
          usesLibCo: true
          coreAspectRatio: true
          scale: 2
          scaleMethod: bilinear2
          options:
            kronos_sh2coretype: "kronos"
            kronos_force_hle_bios: "disabled"
            kronos_videoformattype: "auto"
            kronos_meshmode: "enabled"
            kronos_bandingmode: "enabled"
            kronos_addon_cartridge: "none"

        # GameCube via dolphin_libretro. GL 3D core like psp/dc/ps2: same isGlAllowed + coreAspectRatio
        # Flip contract, usesLibCo thread-affinity, vfr:false (correct game speed), skip_hw_context_destroy
        # teardown hack. No BIOS required — Dolphin HLE-boots the GC IPL. Source ROMs are .gcz (Dolphin's
        # compressed format, R:\Roms\Games\Nintendo GameCube), read directly by the core → RomCache COPIES
        # the .gcz into roms/gc/ on first play (plain-file branch, like ps2 .cso), never a 7z extract.
        # 4 controller ports (MaxPlayers 4 at ingest) — a strong fit for the shared-room model.
        gc:
          # OUR PATCHED BUILD (2026-07-09, docker/arcade/dolphin-createsharedcontext.patch): implements
          # GLContextLR::CreateSharedContext (upstream's external-context path returns the base's nullptr,
          # which async-shader threads dereference — the 0xc0000005). The custom lib NAME pins it against
          # repo.sync nightly overwrites; the stock dolphin_libretro stays beside it as instant rollback
          # (flip lib back + shader_compilation_mode to "0"). Build recipe: D:\Arcade\build\dolphin\build-core.bat.
          # REBASED custom core (2026-07-09, task 22): the CreateSharedContext patch rebuilt on the
          # STOCK revision 287ab2dba6 (hash verified embedded in the DLL) — the master-drift build
          # ran races at half speed because its shader format could not reuse the warm pipeline
          # cache (measured via pace-diag). This build = yesterday's core + async shaders, nothing
          # else. Rollback: lib: dolphin_libretro + shader_compilation_mode "0".
          # STOCK CORE — VERDICT 2026-07-11 02:46, THE F-ZERO RACE-SLOWDOWN FIX. The custom core
          # (dolphin_custom_libretro, live 07-09 21:25 → 07-11 02:44) ran GX races at 28–50 ticks/s
          # (uniform ~25ms retro_run, one busy core, GPU idle) at DETERMINISTIC track spots; the
          # stock 2606.0.88 nightly runs the same races at a flat 58.5–60 (verified live, Big Blue,
          # raw-ISO rip, MSAA 0, sync shaders). Root cause inside the custom build unresolved
          # (deoptimized build despite the Release recipe? the CreateSharedContext patch itself?
          # its DLL is 30% larger than stock) — investigate before EVER redeploying it. Everything
          # else was exonerated one variable at a time on 07-10/11: GPU clocks, process priority,
          # E-cores, efb scale, codec, network, pacing, save-states, shader/pipeline caches, gcz
          # compression, MSAA, dual-core (GFZ.ini vetoes it). Async shaders are moot on stock
          # (mode "0" below is REQUIRED — stock's async path nulls shared contexts and crashes).
          #
          # ⚠ SUPERSEDED 2026-07-14 (commit c149cf2). The verdict above was measured against a CRIPPLED
          # custom build: its CMake set() shadowed the release flags, so the DLL shipped WITHOUT /O2 —
          # that, not CreateSharedContext and not async shaders, was the GX race slowdown. The rebuilt,
          # actually-optimized core (~13 MB; an unoptimized one is ~21 MB) holds a driven Big Blue race
          # at 60.0, slowTicks=0, maxTick ~8 ms with 4x MSAA + efb 3 + async ubershaders ALL on. So the
          # custom core is live and async shaders come WITH it: lib and shader_compilation_mode must move
          # together (mode "2" crashes on stock). Build: docker/arcade/dolphin-build-core.bat.
          # ⚠ As with audioMaster above, c149cf2 wrote this into config.yaml — which nothing reads. It
          # belongs HERE, in the file the workers actually load. Rollback pair: dolphin_libretro + "0".
          lib: dolphin_custom_libretro
          folder: gc
          roms: ["gcz", "iso", "rvz", "ciso", "gcm", "m3u"]
          # ── VULKAN ARM (W5 reversal, Eric 2026-07-16) ── The W5 audit verdict was NO-GO purely on the
          # cold-cache cost; Eric overruled it ("we don't have many caches built for GC — the flip is
          # worth it"). The audit's TECHNICAL findings all said Vk-safe: dolphin picks its backend from
          # the libretro hw-context TYPE, not dolphin_renderer (Video.cpp:135-138 cascade — Vulkan is
          # reachable only from a Vulkan-advertising frontend, which hwContext:"vulkan" makes us);
          # negotiation is effectively v1 on Windows (create_instance/create_device2 are __APPLE__-only,
          # Video.cpp:231-242); the custom-core /O2 patch covers VideoBackends/Vulkan/*; the
          # createsharedcontext patch is GL-only and INERT under Vk (VKGfx uses the base
          # AsyncShaderCompiler, no shared GL contexts needed — mode "2" still valid); Vk pipeline
          # caches land under User/Cache/Shaders/Vulkan-* (covered by coreCache.purge). Old OpenGL-*
          # caches stay on disk harmlessly (filename-prefix keyed); expect a per-game mode-2 ubershader
          # warm-up (~29 t/s for the first minutes) on each title's first Vk boot — accepted.
          # Rollback one-liner: isGlAllowed: true + delete the hwContext line.
          # A 2026-07-18 agent flip to GL was REVERTED same day: full Vulkan is the standing directive
          # (Eric). Its stall/latency concerns are handled by dolphin_wait_for_shaders below, not by
          # abandoning the backend.
          isGlAllowed: false          # Vulkan by default (see hwContext); GL zero-copy arming stays off
          hwContext: "vulkan"         # gc renders on Dolphin-Vk (VKGfx) via the Vulkan-capture path
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          # A pipeline cache is only readable by the exact core BUILD that wrote it — purge the stale
          # shader cache when the core identity changes, or the new build silently recompiles forever.
          coreCache:
            dir: "User/Cache"
            purge: ["Shaders", "*.uidcache"]
          # skip_serialize_size_probe (patch 0016): dolphin defers video/emu init to context_reset +
          # first retro_run, so the load-time retro_serialize_size probe walks save-state into a NULL
          # g_vertex_manager → 0xc0000005. The probe only feeds a log line; saves re-query at save time.
          #
          # ── vk_synthetic_surface (W5-LIVE, REQUIRED for the Vulkan arm) ── Dolphin's Vulkan libretro
          # backend gates its FRAME HANDOFF (video_cb/set_image) on having a swapchain, which needs a
          # VkSurfaceKHR. With VK_NULL_HANDLE it renders internally and hands us NOTHING — retro_run ticks,
          # audio + shaders run, but video_cb fires 0x (root-caused live 2026-07-16 with CLOUD_GAME_VK_DEBUG:
          # video_cb=0/set_image=0 over 3221 ticks; NOT a shader-cache warm-up). Unlike PPSSPP it does not
          # crash on the null surface — it silently produces no video. The hack hands it a real hidden-window
          # surface; Dolphin then makes its swapchain and its glue warps it to set_image → frames flow to
          # zero-copy (re-probe: video_cb=VALID=1511, set_image=1511, zc_tex=1511, warm-boot 60fps@1280x1056).
          # Inert on GL. REMOVE if gc ever rolls back to GL.
          hacks: [skip_hw_context_destroy, skip_serialize_size_probe, vk_synthetic_surface]
          # Render efb_scale 3 (1920x1584), deliver 1280x1056: supersampled on TOP of 4x MSAA — the
          # 07-09 quality-pass ideal, RESTORED 2026-07-11 after the race-slowdown hunt exonerated
          # resolution entirely (races dipped identically at efb 2 and 3; the culprit was the custom
          # dolphin core, now retired — see lib above).
          scale: 0.6667
          scaleMethod: bilinear2
          options:
            # OpenGL backend so Dolphin draws into CloudRetro's GL (WGL) hw-render context. A Vulkan/D3D
            # backend renders to a private device the GL capture never sees -> black frame (the ps2
            # pcsx2_renderer:OpenGL lesson). Native internal res for the first boot to prove the path on
            # the 4070 Ti; raise dolphin_efb_scale once it renders.
            dolphin_renderer: "Hardware"
            dolphin_cpu_core: "JIT64"
            # OPTION VALUES are the core-options-v2 VALUE strings, NOT the display labels (verified against
            # DolphinLibretro/Common/Options.cpp @287ab2dba6): efb_scale = "1".."6" (labels "1x Native
            # (640x528)" etc are display-only). An unmatched value leaves the port's typed cache at T{}=0
            # → retro_get_system_av_info returns 0x0 geometry → null video objects → 0xc0000005 at boot.
            # THAT was the gc boot crash. shader_compilation_mode: "0"=Synchronous "1"=Sync(Uber)
            # "2"=Async(Uber) "3"=Async(Skip Rendering).
            # efb_scale "2" = 1280x1056, verified 60fps/0-drop. NOTE: dolphin TEARDOWN can wedge the worker
            # (partial deadlock — /echo alive, coordinator WS dead) at ANY scale (reproduced at "1" too);
            # the GL Worker Watchdog task auto-recycles a wedged worker within ~60s. Real fix = debug the
            # teardown deadlock (dump: scratchpad worker-hung-27168.dmp).
            # "3" (paired with scale: 0.6667 above — supersampled to 1280x1056 on the wire).
            dolphin_efb_scale: "3"
            # 4x MSAA. The ONLY core where MSAA measurably does anything: A/B'd on RAW pre-encode frames
            # (patch 0022) over 3 runs each, the share of edges that are HARD fell 6.29% -> 4.08%, with no
            # overlap between the groups. n64 (gliden64) and psp (ppsspp) produce BIT-IDENTICAL frames with
            # their MSAA options on or off — libretro's hw_render FBO isn't multisampled, and only Dolphin's
            # OGL backend manages its own framebuffers. Values: 0 None, 1/2/3 = 2x/4x/8x MSAA, 4/5/6 = SSAA.
            #
            # This is invisible from the browser: H.264 quantization erases the sub-pixel edge gradients AA
            # creates. Never A/B anti-aliasing on the decoded stream.
            # 4x MSAA, RESTORED 2026-07-11 (was briefly "0" as a slowdown diagnostic — exonerated:
            # the bad custom core dipped identically with MSAA off; stock runs 60 regardless).
            dolphin_anti_aliasing: "2"
            # 16x anisotropic. Not an AA operation, so hardShare can't score it — what it does show is
            # RETAINED texture detail: on dc the same measurement moved mid-frequency edges +7% with no
            # meaningful hard-edge change. Values are numeric: 0=1x(off) 1=2x 2=4x 3=8x 4=16x.
            dolphin_max_anisotropy: "4"
            # NOT set on purpose: dolphin_force_true_color and dolphin_disable_copy_filter are already
            # default-ON in this libretro port — proven by deleting GFX.ini and regenerating it with the
            # options absent from this config (ForceTrueColor=True, DisableCopyFilter=True). Setting them
            # would be a no-op; leaving this note so nobody "adds" them again (docs §17). Also learned:
            # F-Zero GX boots are NOT frame-deterministic (raw dumps differ run-to-run), so dolphin
            # verdicts need GFX.ini/behavioural evidence, not raw-frame A/B.
            # SINGLE-THREADED + synchronous shaders — and this is a CORE limitation, not ours (settled
            # 2026-07-09): libretro-dolphin's external-context path never overrides the base
            # GLContext::CreateSharedContext(), which returns nullptr (Common/GL/GLContext.cpp:45) —
            # so with async shaders / a GPU thread enabled, Dolphin's worker threads deref that null
            # (0xc0000005 read @0x180) no matter what the frontend does. env 44 stays granted (it fixes
            # the single-context fallback crash); async paths stay OFF until someone patches the CORE
            # (implement CreateSharedContext for the external context — upstreamable). The sync-compile
            # stutter (rare audio skips on first sight of each effect) SELF-HEALS via the persistent
            # per-game shader cache (legacy_save/User/Cache/Shaders — F-Zero GX grew a 1.3 GB pipeline
            # cache in one evening); wait_for_shaders precompiles the cache at boot.
            # DUAL-CORE (2026-07-09, round 3 of the F-Zero audio hunt): with shaders fully cached the
            # audio still dropped at the SAME content points (race start, announcer) — that's not
            # compiles, it's single-core CPU saturation at the game's heaviest moments. Dual-core was
            # originally disabled for the null-shared-context crash — the exact thing our patched core
            # (dolphin_custom_libretro) fixes. If GC rooms crash at boot: revert to "disabled".
            # DUAL-CORE IS A DEAD END FOR F-ZERO GX — settled 2026-07-10 late, after a ~15-minute
            # "enabled" experiment kept logging "CPU Thread separate = No": Dolphin's OWN game INI
            # (Sys/GameSettings/GFZ.ini) sets `CPUThread = False` for GFZ* and the game-local config
            # layer overrides our base option. Upstream forbids dual-core for this game (it EFB-peeks
            # constantly — the same INI's Video_Hacks note). So the 07-09 "dual-core ON" round never
            # actually engaged for GX either, and per the per-ROM-fixes rule the emulator's DB wins:
            # this stays disabled (flipping it only affects OTHER GC titles, untested). The real
            # lever for GX's heavy-moment dips is EFB work ∝ internal resolution — see efb_scale.
            dolphin_main_cpu_thread: "disabled"
            # "2" = Async (Ubershaders): new shaders compile on SHARED-CONTEXT worker threads (our
            # patched core makes those real) while ubershaders render the frame meanwhile — no
            # compile stall, no first-sight audio skip. Was "0" (Synchronous), forced by the stock
            # core's nullptr CreateSharedContext. main_cpu_thread stays disabled deliberately: one
            # variable at a time — the dual-core GPU thread is a separate risk with its own testing.
            # BACK TO "0" SYNCHRONOUS (2026-07-11 02:30, the launch-week config): the entire GX
            # race-slowdown era (28-50 ticks/s, "skipping audio") coincides exactly with async
            # ubershaders (mode "2", deployed 07-09 21:25). Evidence the async path never delivers
            # specialized pipelines on our core: dips persist on a FRESHLY REBUILT cache; no compile
            # activity logs during dips (async workers idle/broken); the binary cache re-grew its
            # whole working set EVERY session (2.5 GB in 2 days); and the one great race since sat
            # on an accidental 8.5-min full synchronous precompile. Mode 2 = permanent ubershader
            # rendering in heavy scenes ≈ 25 ms/frame. Sync's old first-sight stutter is now ~nil
            # (NVIDIA driver shader cache warm). If mode 2 is ever re-attempted, verify with a REAL
            # driven race and check the specialized cache STOPS growing between sessions.
            # "2" = Async (Ubershaders), and it REQUIRES the custom core above (stock's async path nulls
            # the shared context and crashes). Ubershaders render the frame while specialized pipelines
            # compile on worker threads — no compile stall inside retro_run. Synchronous mode "0" is what
            # produced the 441 ms – 12.8 s stalls in the worker log (GLSL compiler output sits directly
            # in front of every one of them). wait_for_shaders is then unnecessary: nothing to wait for.
            dolphin_shader_compilation_mode: "2"
            # wait_for_shaders ENABLED (2026-07-17, default-on/opt-out policy). Precompiles the persisted
            # pipeline UID cache at boot so previously-seen content has NO mid-play compile stall (async
            # ubershaders mode "2" still covers genuinely-new content). MEASURED tradeoff: on a WARM cache
            # it costs only ~0.4-0.7s at boot (shaders are LOADED from disk, not recompiled — worker log
            # "Loaded N cached shaders from Vulkan-*.cache"); a cold first-ever boot per title pays the real
            # compile cost once, then it's cached. Rollback: dolphin_wait_for_shaders: "disabled".
            dolphin_wait_for_shaders: "enabled"

        # Wii — SAME dolphin_custom_libretro binary/worker path as gc above (own core-list entry only
        # because it needs its own "folder" + Wiimote input options); own roms/wii/ subfolder so a
        # same-named GC and Wii disc can never collide (patch 0038's lesson). L:\4 - Software\Wii\Disc
        # Games ships .rvz — Dolphin's own compressed format, read directly (no gcz-style decompress
        # step: RomCache's plain-copy branch handles it, same as a GC .gcz would if left compressed).
        # EFB/render tuning copied VERBATIM from gc — it's literally the same video pipeline (Wii didn't
        # change the EFB). Re-verify independently before trusting these numbers for Wii specifically.
        # "elf"/"dol": the two BrawlEx-based Brawl mods (Project REX, Smash Bros Infinite) that need
        # the SD-card + loader-boot method instead of a normal disc — see wiiSdLoader below, whose
        # per-ROM asset lookup (keyed by CloudRetroGameKey) is what actually makes these bootable;
        # listing the extensions here only gets them past the library scan/ingest.
        wii:
          lib: dolphin_custom_libretro
          folder: wii
          roms: ["rvz", "iso", "wbfs", "ciso", "gcm", "m3u", "elf", "dol"]
          isGlAllowed: false
          hwContext: "vulkan"
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          coreCache:
            dir: "User/Cache"
            purge: ["Shaders", "*.uidcache"]
          hacks: [skip_hw_context_destroy, skip_serialize_size_probe, vk_synthetic_surface]
          scale: 0.6667
          scaleMethod: bilinear2
          # Per-port device = Wiimote+Nunchuk (RETRO_DEVICE_WIIMOTE_NC = (3<<8)|RETRO_DEVICE_JOYPAD = 769,
          # DolphinLibretro/Input.cpp). Chosen over plain WiiMote/Classic/Sideways because it's the widest
          # real-game default (nunchuk-holding titles + most party games) and is the ONE mode the core
          # wires IR pointer + swing onto our existing analog-stick input (see options below) rather than
          # needing real motion data. All 4 ports set — unused ports are simply unconnected in-game, same
          # convention as gc's 4 seats.
          hid:
            0: [769]
            1: [769]
            2: [769]
            3: [769]
          # Per-ROM device override (worker patch: nanoarch hid4rom, mirrors options4rom/fps4rom).
          # The two Wii SD-loader BrawlEx mods are GC-controller-native like real Brawl — Wiimote+
          # Nunchuk's analog stick either never reaches the game or lands on a control scheme the
          # mod doesn't read, so the left stick does nothing (reported live 2026-07-19, Project REX).
          # RETRO_DEVICE_GC_ON_WII = (6<<8)|RETRO_DEVICE_JOYPAD = 1537 (DolphinLibretro/Input.cpp) —
          # explicitly disconnects the Wiimote on that port and routes input through the SAME
          # descGC button/analog-stick descriptor as the plain "gc" system, so it rides the already-
          # proven GameCube input path instead of the untested Nunchuk-analog one. The site must
          # mirror this with the "gc" RetroPad profile for these two ROM keys (cloudRetroClient.js
          # GC_ON_WII_GAME_KEYS) or the client sends Wiimote+Nunchuk bits the core no longer reads.
          hid4rom:
            "Project REX":
              0: [1537]
              1: [1537]
              2: [1537]
              3: [1537]
            "Super Smash Bros Infinite":
              0: [1537]
              1: [1537]
              2: [1537]
              3: [1537]
          # System default for the per-room "gc" controller scheme (site room-create picker). The
          # picker is offered on EVERY Wii title now, not just the two BrawlEx mods above — a creator
          # can play any Wii game with a GameCube controller. When the chosen ROM has no hid4rom row of
          # its own, the worker's "gc" case falls back to this mapping: RETRO_DEVICE_GC_ON_WII = 1537 on
          # all 4 ports (same descGC input path the plain "gc" system uses). The site mirrors it with the
          # "gc" RetroPad profile whenever the room's scheme is "gc" (cloudRetroClient.js
          # effectiveInputSystem) — otherwise the client would send Wiimote+Nunchuk bits the core no
          # longer reads. Default stays Wiimote+Nunchuk (the `hid` block above); "gc" is opt-in per room.
          hidGc:
            0: [1537]
            1: [1537]
            2: [1537]
            3: [1537]
          options:
            dolphin_renderer: "Hardware"
            dolphin_cpu_core: "JIT64"
            dolphin_efb_scale: "3"
            dolphin_anti_aliasing: "2"
            dolphin_max_anisotropy: "4"
            dolphin_main_cpu_thread: "disabled"
            dolphin_shader_compilation_mode: "2"
            dolphin_wait_for_shaders: "enabled"
            # ── Wiimote IR / Swing (DolphinLibretro/Common/Options.cpp) — the reason Wii is ingestable
            # at all despite no real motion/pointer input existing in cloudRetroClient.js: this core maps
            # both onto the RetroPad right stick instead of real Wiimote sensors.
            # "1" = right stick controls pointer, ABSOLUTE (core default). "0" (relative, mouse-like) may
            # suit some players better for aiming-heavy games — untested, easy per-game override.
            dolphin_ir_mode: "1"
            # "None" = pointer always follows the right stick (core default) — no held button needed to
            # aim, matches "pick up the Wiimote and point" expectation.
            dolphin_ir_modifier: "None"
            # Core SHIPS this "Disabled" (swing off) — turned ON here behind L2 so bowling/tennis/baseball-
            # style swing gestures (hold L2, flick right stick) work at all, without stealing the right
            # stick from IR aiming when L2 isn't held. UNVERIFIED end-to-end — flag/adjust per game as
            # reports come in (this whole system is "ingest now, curate later").
            dolphin_swing_modifier: "L2"
          # Per-user card = the WHOLE NAND (config `cards.wii` above, "save:User/Wii"), not just a save
          # subfolder — see the comment there for why that's actually correct rather than a shortcut.
          # Save-states (autosave slot 0 + the Save/Load quicksave slot) still work independently on top.

        # --- ported from docker/arcade/config.yaml (Windows-only migration): the tuned
        # non-GL cores so this pool renders 2D/N64 correctly (scale, N64 framebuffer opts). ---
        n64:
          lib: mupen64plus_next_libretro
          roms: ["n64", "v64", "z64"]
          isGlAllowed: false   # Vulkan by default (see hwContext); GL zero-copy arming stays off
          # VULKAN BY DEFAULT: every N64 game renders on paraLLEl-RDP via the Vulkan-capture path.
          # Per-game GL escape: set mupen64plus-rdp-plugin:"gliden64" in game-overrides.json.
          hwContext: "vulkan"
          usesLibCo: true
          # vfr OFF: variable frame timing produced juddery presentation in the browser — a steady
          # ~16% of frame intervals landed at ~50ms (measured via rVFC pacing histogram) and the
          # compositor dropped ~6%. Fixed 60Hz cadence paces the encoder/RTP timestamps evenly.
          vfr: false
          coreAspectRatio: true
          # SUPERSAMPLING (patch 0023). MSAA is INERT on this core — libretro's hw_render FBO isn't
          # multisampled, so mupen64plus/ppsspp produce BIT-IDENTICAL frames with it on or off (only
          # Dolphin, which owns its framebuffers, really multisamples). The AA that DOES work here is to
          # render big and average down: `scale` < 1 shrinks. Measured on raw frames from the same source
          # image, 1920x1440 -> 960x720: hard edges 2.112% (nearest) vs 1.792% (bilinear2), a 15% drop.
          # ⚠ A fractional scale MUST be paired with a smooth scaleMethod — downscaling with nearest
          # point-samples and ALIASES rather than anti-aliases.
          # Render 1920x1440 (6x native), deliver 1280x960: supersampled AND higher resolution.
          # Costs ~1.0 CPU core per room (0.37 without); two concurrent rooms fit easily on the 13700K.
          scale: 2
          scaleMethod: bilinear2
          # REWIND: OFF, and the reason is MEASURED, not inherited (2026-07-29).
          # The old blanket refusal ("usesLibCo cores can't serialize safely, mupen is flaky") was
          # stale — that flakiness WAS patch 0030's bug (same_thread_with_args read the Go
          # pointer-to-size as the size, so every LibCo serialize got a garbage byte count), fixed
          # long since. So it was tried here properly, and the cost is what disqualifies it:
          #   rewind-diag: snapshot 16.02 MB mean=11.61ms max=17.54ms
          # 11.6 ms is most of a 16.7 ms frame, and a serialize STOPS the emulator. A/B on the same
          # game and scene, step 12: video 55.4 fps armed vs 60.0 fps off — an ~8% frame-rate tax
          # paid by EVERY player in EVERY N64 room, whether or not anyone ever holds rewind.
          # Widening the step to hide it (≥36 frames) makes the rewind itself a 600 ms scrub, which
          # is not the feature. parallel_n64 serializes the SAME state in 2.42 ms and is armed —
          # see its block. Re-test here if mupen's serialize ever gets cheaper.
          options:
            # Legal values are a fixed list (verified in mupen64plus_next_libretro.dll):
            # 320x240, 640x480, 960x720, 1280x960, ..., 1920x1440 — not an arbitrary WxH.
            mupen64plus-43screensize: "640x480"
            # Phase-2 raise 4x->8x (2026-07-18): renders 8x native, downsampled to the unchanged
            # 1280x960 delivery = deeper supersampling. Smoke gate: 60fps attract + geometry
            # unchanged.
            # ROLLED BACK TO 4x 2026-07-29. The 8x smoke gate only checked fps + geometry, never
            # SHARPNESS, and 8x is not a clean supersample here: N64 native is 640x240 on this title,
            # so 8x produces a 5120x1920 core frame (logged: "gl source caps 640x480 -> 5120x1920").
            # Against the 1280x960 delivery that is 4x horizontally but only 2x vertically - a
            # NON-UNIFORM downscale, which softens and fringes rather than anti-aliasing. 4x halves
            # the axis mismatch and the GPU cost. The honest fix would be to derive upscaling from the
            # delivered geometry per title instead of pinning one multiplier for every N64 game; until
            # then this is the documented rollback value from the line above.
            mupen64plus-parallel-rdp-upscaling: "4x"
            mupen64plus-rdp-plugin: "parallel"   # paraLLEl-RDP (Vulkan LLE) — the default renderer
            mupen64plus-rsp-plugin: "parallel"   # LLE RSP accuracy pairing
            # MSAA left OFF (core default). "4" was tried and A/B-measured on Mario Kart 64 at 960x720:
            # hardEdgeFrac 1.033% (MSAA=4) vs 1.028% (MSAA=0) — NO measurable anti-aliasing. Two candidate
            # reasons, both unresolved: the probe reads the H.264-decoded stream (quantization at 5 Mbps
            # erases sub-pixel edge gradients), and CloudRetro's hw_render context may request no
            # multisample buffers. Not shipping a GPU cost with no demonstrated benefit. Values: 0,2,4,8,16.
            # mupen64plus-FXAA is inert too: FXAA=1 produced 30/30 BIT-IDENTICAL raw frames vs FXAA=0
            # (docs §17) — gliden64's post-process pass doesn't run under this hw_render setup, same
            # class as MSAA. Supersampling (scale < 1 above) is the only AA that works on this core.
            # Useful side-proof: MK64's attract is bit-deterministic across boots — the right test bed
            # for any future raw-frame A/B (F-Zero GX is NOT deterministic; see the gc note).
            # (It did NOT break framebuffer effects: Bomberman 64's flat-blue story cinematic renders
            # identically with MSAA 0 and 4 — that is the pre-existing gliden64 limit, not a regression.)
            # ── GLideN64 framebuffer/filter settings are NOT set here. DO NOT ADD THEM BACK. ──────
            # They are CamelCase libretro keys, and CloudRetro's loader (pkg/config/loader.go keysToLower)
            # lowercases every YAML key while libretro option keys are case-SENSITIVE. A CamelCase key
            # written here therefore arrives as `...enable...`, is never queried, and its value is INERT.
            # They used to sit here "for documentation of intent" - REMOVED 2026-07-29 because being
            # delivered-but-inert is worse than absent: the worker logs 7 DEAD keys every single N64 room,
            # and reading that list as real configuration sent a debugging session badly off course (it
            # looks exactly like "our settings are being ignored", when the settings that matter were
            # never meant to come from here).
            # WHERE THEY ACTUALLY LIVE: the n64 "opengl" render profile in ArcadeRendererProfiles.cs,
            # delivered case-preserved as per-room options (t=104). That path is authoritative and is why
            # the GLideN64 profile renders correctly. Values pinned there, with the reasons kept here so
            # they are not lost: EnableNativeResTexrects=Optimized (2D texrects/HUD/text at native res,
            # else they seam and blur once upscaled); BilinearMode=3point (the N64's real texture filter);
            # EnableCopyColorToRDRAM=Async + EnableCopyDepthToRDRAM=Software (core ships both Off, which
            # renders framebuffer effects BLACK - Bomberman 64's intro movie - or wrong, e.g. DKR's
            # FB/depth tricks); EnableLegacyBlending=False (ships ON; with it Bomberman 64's intro is flat
            # colour planes with no geometry on D3D12); EnableCopyAuxToRDRAM=True (aux-buffer composites,
            # i.e. Bomberman 64's attract/mine-cart/snow scenes). MultiSampling stays at the core default
            # 0 - MSAA is INERT on this core (measured bit-identical frames, see the note above).
            # KNOWN LIMIT, unrelated to any of this: Bomberman 64's STORY cinematics still render as flat
            # clear-colour planes on D3D12; every gliden64 FB combination was tried. In-engine gameplay,
            # menus and training all render correctly.
            # Under the DEFAULT Vulkan profile none of the above applies at all - paraLLEl-RDP is a
            # different (LLE) renderer and never queries GLideN64's options.

        # ── N64 ALTERNATE CORE: parallel_n64 (compatibility) ─────────────────────────────────────
        # A SECOND N64 core, booted per-room ONLY when the render profile sets core-key "parallel_n64"
        # (ArcadeRendererProfiles "parallel_n64" → StartGameRequest.Core → HandleGameStart core override).
        # The DEFAULT n64 core stays mupen64plus_next. Why it exists: some romhacks — proven with
        # SM64: Last Impact — crash mupen64plus_next's R4300 with `reserved opcode` / `error in ERET`
        # ~11 s into boot, on EVERY renderer (parallel-RDP AND GLideN64), BOTH cpucores, and with
        # CountPerOp=1 (all verified read-by-core in the worker logs, 2026-07-22/23).
        # ⚠ CORRECTED 2026-07-29: that fault is NOT an R4300 difference between the two forks — it is
        # UNALIGNED DMA, which the game requires and only THIS core can be told to allow (see
        # parallel-n64-allow-unaligned-dma below). mupen64plus_next lacks the option entirely, so the
        # earlier "both are mupen forks, both share the fault, Last Impact is unsupportable" verdict
        # was wrong: the forks differ in the option, not the CPU. Do not re-derive the old conclusion.
        # RENDERERS (updated 2026-07-29 — this core now has THREE, not one):
        #   parallel  = paraLLEl-RDP (Vulkan LLE)  -> render profile "parallel_n64"
        #   gliden64  = GLideN64 (GL)              -> render profile "parallel_n64_gl"
        #   glide64   = Glide64 (GL)               -> render profile "parallel_n64_glide64"  [ROMHACKS]
        # Glide64 is why this core matters now: it is the libretro-era descendant of Project64's Jabo's
        # Direct3D, and Jabo's is the ONLY plugin that renders SM64: Last Impact's custom assets and music
        # correctly (verified live in P64 3.0.1 — GLideN64 fails THERE too, so this is a plugin-LINEAGE
        # requirement, not an accuracy one). Jabo's is closed-source + P64-only and cannot be ported;
        # `rice` is the remaining legacy fallback in this core. angrylion stays BANNED (it hard-panics
        # CloudRetro's GL scaffolding on isGlAllowed cores, arcade hard rule) — note the CORE's own
        # gfxplugin default IS angrylion, so this block must always set gfxplugin explicitly.
        # ⚠ The GL plugins do NOT supersample, so `scale: 2` below is a pure 2x BLUR up to the 1280x960
        # delivery on those paths (it is a supersample only on the Vulkan path, where parallel-rdp-upscaling
        # renders large first). Sharpness on GL comes from parallel-n64-screensize instead — but only up to
        # 1920x1440 on THESE plugins: the core declares tokens to 5760x4320, while the mupen config bridge
        # the GL plugins read (api/config.c ScreenWidth/ScreenHeight table) knows nothing above 2048x2048,
        # and ConfigGetParamInt returns 0 on a miss. 1440x1080/2240x1680/2880x2160/5760x4320 therefore hand
        # glide64 a width of ZERO. The site catalog offers only bridge-known tokens; do not widen it here.
        # ⚠ parallel-n64-gfxplugin-accuracy defaults to "veryhigh" and this block has never set it, so
        # every GL room pays the most expensive setting. Same GL Flip contract as the other GL 3D cores
        # (isGlAllowed + coreAspectRatio, or the bottom-left-origin frame renders upside down).
        # ⚠ SAVE ISOLATION: the SITE keys this core's saves under "n64-parallel_n64" (renderProfile.CoreKey),
        # distinct from mupen's "n64" — a save-state is core-specific and cross-feeding crash-loops the room.
        parallel_n64:
          lib: parallel_n64_libretro
          # ⚠ roms is DELIBERATELY EMPTY (2026-07-29). It used to be ["n64","v64","z64"], identical to
          # the `n64` entry above — and config.Emulator.GetEmulator (pkg/config/emulator.go:234) picks a
          # core by scanning Cores.List for the first entry matching the ROM's extension AND folder, over
          # a Go MAP (randomized order) with an early return. With both entries claiming z64 + folder n64,
          # WHICH CORE BOOTED A NO-OVERRIDE N64 ROOM WAS NOT DETERMINISTIC — and in practice parallel_n64
          # won 5/5 measured rooms, so every "default N64 core" room was silently running the alternate
          # fork. That is the 2026-07-23 "no-override room booted the WRONG core, render-profile options
          # reconciled DEAD" footgun, and it invalidated a week of mupen-vs-parallel A/B testing.
          # An EMPTY roms list cannot match, so this core can never be auto-selected — while an EXPLICIT
          # per-room override still works, because coordinatorhandlers.go:170 sets game.System straight
          # from rq.Core (checking only that the key exists in Cores.List) and the ROM path was already
          # resolved by FindApp under the game's REAL system. So: dropdown-selectable, never the default.
          roms: []
          folder: n64
          # VULKAN (paraLLEl-RDP) BY DEFAULT — same high-fidelity LLE renderer mupen runs, paired here with
          # parallel_n64's compatibility R4300. Mirrors the mupen64plus_next n64 block (isGlAllowed:false +
          # hwContext:vulkan); the "parallel_n64_gl" render profile forces GLideN64 on the GL surface as the
          # fallback. angrylion is BANNED either way (it hard-panics CloudRetro's GL scaffolding).
          isGlAllowed: false
          hwContext: "vulkan"
          coreAspectRatio: true
          usesLibCo: true
          vfr: false
          # audioMaster (patch 0043) — ADDED 2026-07-29 for the SCRATCHY AUDIO on this core.
          # This core's declared A/V contract is off-nominal in BOTH axes where mupen's is clean:
          #   parallel_n64 : [60.13fps]  audio [32040Hz]      <- 532.9 samples/frame implied
          #   mupen64plus  : [60fps]     audio [44100Hz]      <- clean, and mupen sounds clean
          # 60.13 Hz is the N64's REAL NTSC refresh (~60.0988), so the core is being honest; the problem
          # is that `vfr: false` paces on a fixed 60 Hz cadence, so the pacer's fps floor outruns the
          # slightly-slower audio clock and the core under-feeds the Opus encoder every second, forever.
          # The client's jitter buffer drains and you hear crackle - the SAME mechanism documented at
          # length on the psp block (PPSSPP declares 44100 and delivers ~43850). audioMaster lets the
          # audio clock pull the loop slightly above the fps floor (bounded 2%) so the core produces
          # exactly what the encoder consumes.
          # Why not the alternatives: `vfr: true` is what made Sonic Adventure run double-speed on the
          # psp path (and both N64 blocks pin vfr:false deliberately); `audioSilenceFill` is for a core
          # that stops calling the audio callback entirely while quiet (ScummVM) and its own note warns
          # explicitly against using audioMaster for THAT - the two fix opposite faults, do not swap them.
          # NOT set on the mupen n64 block: it declares a clean 60/44100 and has no drift to correct.
          audioMaster: true
          # 640x480 core base (2x native) → the pipeline scale:2 delivers 1280x960, matching mupen's N64;
          # parallel-rdp-upscaling supersamples ON TOP of that (deeper SSAA, delivery size unchanged).
          scale: 2
          scaleMethod: bilinear2
          # REWIND: ON here and OFF on mupen, and the split is a MEASUREMENT, not a preference. Same
          # 16 MB N64 state, same box, same game — mupen64plus_next serializes it in 11.6 ms (an ~8%
          # frame-rate tax on every room, see its block), parallel_n64 in 2.42 ms:
          #   rewind-diag: snapshot 16.01 MB mean=2.42ms max=6.72ms ring=63 (~12.6s of history)
          # A/B: 60.1 fps armed vs 60.1 fps off — no measurable cost. Step 12 = 200 ms granularity;
          # 1024 MB = ~63 snapshots = ~12.6 s of history. Watch `rewind-diag` after any core update:
          # this arming is only justified while that mean stays low.
          rewind: true
          rewindStepFrames: 12
          rewindMB: 1024
          options:
            # Value tokens verified from parallel_n64_libretro.dll (2026-07-23). gfxplugin values are
            # gln64|gliden64|rice|glide64|angrylion|parallel — "parallel" = paraLLEl-RDP (Vulkan compute),
            # angrylion BANNED (CloudRetro panic). rspplugin "parallel" = paraLLEl-RSP (LLE accuracy pair).
            parallel-n64-gfxplugin: "parallel"
            parallel-n64-rspplugin: "parallel"
            # parallel-rdp-upscaling MOVED to the site's "parallel_n64" render profile (2026-08-02,
            # planned in ArcadeRendererProfiles since 07-29): config options are per-CORE, so a copy
            # here shipped `8x` to EVERY profile of this core — including the two GL-plugin profiles,
            # where paraLLEl-RDP's supersampling lever is at best inert noise in the room's option set
            # (a glide64 room was observed QUERYING it 2026-08-02 15:12, so "inert" is unproven — but
            # the Vulkan profile delivering it per-room is proven live, and one owner beats two).
            # The VALUE stays 8x, delivered from the profile. mupen's own 4x copy above is DIFFERENT:
            # that one is the yaml-welded Ultra baseline (UltraLiveSpec) and must stay in the yaml.
            # ── ROMHACK COMPATIBILITY (2026-07-29) — NECESSARY BUT NOT SUFFICIENT, see the ⚠ below ──
            # Last Impact issues UNALIGNED DMA transfers. Every emulator that masks the DMA address
            # instead of honouring them executes garbage a few seconds later; that is the origin of
            # BOTH log lines we chased for a week (`Unaligned dword write 00000101` and the
            # reserved-opcode / `error in ERET` that follows it). The write was never the bug — it
            # was the core telling us the game needs this flag. Project64's community ROM database
            # says the same thing per-ROM: `[DC493C8D-E033E6F2-C:45] Unaligned DMA=1` (that CRC pair
            # is our exact v1.2 image, verified against the header). P64 2.4 has no such entry and
            # black-screens; 3.0.1 has it and plays. mupen64plus_next has NO equivalent option key
            # (verified by symbol dump), which is why the DEFAULT core cannot run these hacks at all
            # and this core is the only home for them — not because its R4300 differs.
            # Both keys are all-lowercase, so they survive the config loader's keysToLower (unlike
            # the mixed-case gliden64 keys, which must ride the render-profile path).
            # ✅ ROOT CAUSE CONFIRMED 2026-07-29 by direct A/B in Project64 3.0.1, same ROM, one checkbox
            # apart: per-game `Unaligned DMA` ON = plays; OFF = **the EXACT same reserved-opcode / ERET
            # fault our cores produce**. That is a controlled single-variable proof, not an inference —
            # unaligned DMA is THE requirement, and every failure we logged (mupen64plus_next,
            # parallel_n64, P64 2.4) is the same missing capability wearing different hats.
            # ⚠ AND THIS CORE'S FLAG IS A NO-OP — do not re-run this experiment. Counter Factor was ruled
            # out too (P64 3.0.1 still boots the game at Counter factor 2), so unaligned DMA is the SOLE
            # requirement — which means this core's identically-named option simply does not implement it.
            # A read option is NOT an applied option: `reconcile` proves delivery, never effect. Both flags were
            # delivered and CONFIRMED CONSUMED (`[opt] reconcile: 13/13 provided keys were read by the
            # core`), on BOTH renderers back to back: parallel_n64·Vulkan 20:37:52 (gfxplugin=parallel,
            # Vulkan zero-copy ACTIVE) and parallel_n64·GLideN64 20:39:05 (gfxplugin=gliden64). Both still
            # died on `reserved opcode: 8027F550` -> `error in ERET`, same address, ~11 s in. So this core's
            # allow-unaligned-dma does NOT implement what the game needs the way P64 3.0.1's does. Left
            # enabled: it is what the ROM legitimately requires and is harmless (nothing else regressed),
            # but it is NECESSARY-not-sufficient. The remaining paths are a core patch to the PI DMA path
            # or the heavy lane running P64 3.0.1 (which plays it) — NOT a core port, and NOT this flag.
            parallel-n64-allow-unaligned-dma: "True"
            # 64 MB image (b3313 is 96 MB). This flag exists for exactly these oversized hack ROMs;
            # off by default, and a large ROM that is silently refused looks identical to a crash.
            parallel-n64-allow-large-roms: "True"
            # dynamic_recompiler = parallel_n64's native Hacktarux JIT (its default). Chosen over the
            # interpreters because on the shared mupen R4300 fault that SM64: Last Impact triggers
            # (reserved-opcode / error-in-ERET ~11s in), the interpreters WEDGE the worker (core never
            # finishes teardown → the unkillable-worker class), while the dynarec faults ONCE then
            # recovers/restarts the R4300 without wedging. The dynarec fails SAFELY, so it is the
            # correct default regardless. (The "neither core can ever run Last Impact" claim that used
            # to sit here was wrong — see the allow-unaligned-dma note above.)
            # Tokens: pure_interpreter|cached_interpreter|dynamic_recompiler.
            parallel-n64-cpucore: "dynamic_recompiler"
            # 2x-native base (WxH tokens verified in the DLL). Expansion Pak stays enabled (Last Impact
            # needs the 8 MB) — disable_expmem defaults False, left unset.
            parallel-n64-screensize: "640x480"
            # ⚠ GLideN64 framebuffer options are NOT set here on purpose: CloudRetro's config loader
            # (pkg/config/loader.go keysToLower) LOWERCASES every YAML key, and libretro option keys are
            # case-SENSITIVE — so a mixed-case key like `...-EnableFBEmulation` in config.yaml arrives as
            # `...-enablefbemulation` and the core silently ignores it (shows up in the worker's "DEAD keys"
            # reconcile line). Only naturally-lowercase keys (gfxplugin, rspplugin, screensize, cpucore)
            # survive config. The mixed-case FB options are delivered instead via the "parallel_n64_gl"
            # RENDER PROFILE (ArcadeRendererProfiles.cs), whose options ride the room-options runtime path
            # (t=104 → SetRoomCheats), which preserves case. See that profile for the actual FB values.

        # 2D cores: stream at 3x with nearest-neighbour (the pipeline's default scaler) instead of
        # native 256x224 — the browser's bilinear stretch of a tiny stream is what read as "fuzzy
        # SNES", and no encoder preset can fix that. 768x672 crisp pixels cost NVENC nothing.
        # (These merge INTO the default core entries per-key — lib/roms/etc. survive.)
        # rewind (2026-07-26): arms the worker's in-memory savestate ring (snapshot every 6 frames,
        # 512 MB cap — code defaults) so a held Select+West chord walks time backward. Opt-in per
        # core; on this 2D software tier serialize is sub-ms and reliable, so the defaults are left
        # alone. The worker hard-refuses rewind only on noSaveStates cores (psp/ps2 — they cannot be
        # serialized at ALL), so a stray flag there is a no-op with a warning, and a core whose
        # serialize fails 3x in a row drops rewind for that session on its own. Heavier cores CAN be
        # armed — parallel_n64 is (2026-07-29) — but the deciding number is the SERIALIZE COST, and
        # it is per-CORE, not per-system: the two N64 cores hold the same 16 MB state and differ 5x
        # (2.4 ms vs 11.6 ms), which is the difference between free and an 8% frame-rate tax. Arm a
        # heavy core only after reading its `rewind-diag` mean out of a real room.
        snes:
          scale: 3
          rewind: true
          runAhead: 1   # P8 VERIFIED 2026-09-06: picture compare 0 differing frames in 4,787 (state bytes 5/4,787, APU sync phase)
        nes:
          scale: 3
          rewind: true
          # runAhead (perf program P8, 2026-09-05): one preemptive frame — on an input edge the frontend restores
          # the state from one frame ago and re-simulates it with the new input before the visible frame, so a
          # press lands one frame (16.7 ms) earlier than the game itself would show it. Armed on nestopia ONLY:
          # the determinism check (runAheadVerify) passed 3,908/3,908 frames of driven Mega Man 2 after the first
          # boot frame. snes9x/genesis_plus_gx/mgba showed frame-parity mismatches in STATE BYTES that the fork's
          # diff report traced to a few scheduler/sound-chip counter bytes at fixed offsets; the picture compare
          # (fork 215f8e8: the hidden re-run's framebuffer hash vs the visible run's) then showed 0 / 0 / 1 differing
          # frames in ~5,000 each — see each block. That is the criterion a player feels, and it is met.
          # Rollback = delete the key + .stop recycle. CLOUD_GAME_RUNAHEAD=0 kills it at runtime.
          runAhead: 1
        gba:
          scale: 3
          rewind: true
          runAhead: 1   # P8 VERIFIED 2026-09-06: picture compare 0 differing frames in 5,055 (state bytes differ every other frame @0x132..0x152 = scheduler bookkeeping, picture identical)
        # Game Boy / Game Boy Color via mgba (same lib as GBA). The stock config only exposes gba+gbc
        # roms under the `gba` folder; the JIT catalog files per system (gb/, gbc/), so give each its own
        # core+folder. mgba plays all three. scale:3 for the same crispness rationale as the other 2D cores.
        gb:
          lib: mgba_libretro
          folder: gb
          roms: ["gb"]
          scale: 3
          rewind: true
          runAhead: 1   # P8: same mgba core and state format as gba (armed there after the verify pass)
        gbc:
          lib: mgba_libretro
          folder: gbc
          roms: ["gbc"]
          scale: 3
          rewind: true
          runAhead: 1   # P8: same mgba core and state format as gba (armed there after the verify pass)

        gen:
          # lib name verified live 2026-07-03 (Sonic 2 streams).
          lib: genesis_plus_gx_libretro
          roms: ["md", "gen", "smd", "bin"]
          folder: genesis
          scale: 3   # 320x224 native -> 960x672 nearest (was 2; 3x matches snes/nes, costs NVENC nothing)
          rewind: true
          runAhead: 1   # P8 VERIFIED 2026-09-06: picture compare 1 differing frame in 5,009 (a menu transition; state bytes differ every other frame @0x23418..0x23462 = sound-chip/cycle bookkeeping)

        # ARCADE (fbneo). The site's `arcade` system ingests into roms/mame and launches through the
        # core key `mame` (ArcadeIngestCommand.cs:242) -- the STOCK CloudRetro entry, which we had never
        # overridden. Two consequences, both fixed here (docs/arcade-quality-plan.md Phase 1):
        #   1. No `scale` -> 6,214 games encoded at raw 304x224, chroma below native (see pcsx note).
        #   2. Stock pins `scaleMethod: bilinear2` (pkg/config/config.yaml:295). Adding `scale` WITHOUT
        #      overriding that would upscale with a blurry multi-tap filter -- worse than before, and it
        #      would look like the change worked. nearest-neighbour is mandatory here, not cosmetic.
        # lib/folder/roms restated so the koanf deep-merge can't surprise us.
        mame:
          lib: fbneo_libretro
          folder: mame
          roms: ["zip"]
          scale: 3              # 304x224 -> 912x672
          scaleMethod: nearest-neighbour
          rewind: true          # fbneo serialize is solid on the mainstream boards; flaky drivers self-disable
          options:
            # 32-bit color (docs/arcade-quality-plan.md §17). A raw video_cb dump proved fbneo was
            # emitting RGB565 (bpp=2, pixFmtCode=2): 5-6 bit channels = banding on gradients before
            # the encoder ever sees the frame. "Allow" = fbneo picks XRGB8888 where the board's
            # driver supports it; verified bpp=4 after the flip, same fps. Phase 1 had parked this
            # as "can't confirm the default isn't already enabled" — the dump instrument settled it.
            fbneo-allow-depth-32: "enabled"
          # VERTICAL BOARDS RENDERED SIDEWAYS without this. The worker only sends the GAME_START `av`
          # payload when AspectEnabled() (coordinatorhandlers.go), i.e. when coreAspectRatio is set — so
          # fbneo never told the client its aspect (0.75 on a vertical cab) OR its rotation (90), and the
          # client drew a rotated, 4:3-squashed picture. fbneo is not a GL core, so Flipped() stays false
          # and this cannot introduce the upside-down GL bug. Horizontal boards are unaffected (a=1.333,
          # rot=0). Verified on 1942 (vertical) and Metal Slug (horizontal), 2026-07-08.
          coreAspectRatio: true

        # ─── GPU / GL 3D cores (same D3D12 + NVENC path proven by n64/psx) ────────────────────
        # GL cores MUST set isGlAllowed (HW render) AND coreAspectRatio: without the latter the
        # GAME_START `av` payload is null and the client never learns to flip the bottom-left-origin
        # GL frame → upside down (exact n64 lesson). Cores auto-download via repo.sync (no rebuild).
        #
        # PSP: no BIOS required. Ad-hoc multiplayer is unsupported in libretro → 1-player rooms
        # (set MaxPlayers 1 at ingest, like our n64 solo rooms).
        sms:
          lib: genesis_plus_gx_libretro
          folder: sms
          roms: ["sms"]
          scale: 3
          rewind: true
        gg:
          lib: genesis_plus_gx_libretro
          folder: gg
          roms: ["gg"]
          scale: 4   # 160x144 native — needs more upscale than the console cores
          rewind: true
        sg1000:
          lib: genesis_plus_gx_libretro
          folder: sg1000
          roms: ["sg"]
          scale: 3
          rewind: true
        segacd:
          lib: genesis_plus_gx_libretro
          folder: segacd
          roms: ["m3u", "cue", "chd", "iso"]   # m3u = multi-disc (see dc note); fixes segacd->Dolphin misroute
          scale: 3   # was 2 -- 320x224 native, matches gen
          rewind: true

        # ─── Other 2D cores (each pins its folder so extension collisions can't cross-load) ──────
        sega32x:
          lib: picodrive_libretro
          folder: sega32x
          roms: ["32x", "bin"]
          scale: 3   # was 2 -- 320x224 native, matches gen
          rewind: true
        pce:
          # mednafen_pce (full) covers TurboGrafx-16 / PC Engine + SuperGrafx + PCE-CD (syscard3.pce).
          lib: mednafen_pce_libretro
          folder: pce
          roms: ["m3u", "pce", "sgx", "cue", "chd"]   # m3u = multi-disc (see dc note)
          scale: 3
          rewind: true
        ngpc:
          lib: mednafen_ngp_libretro
          folder: ngpc
          roms: ["ngp", "ngc"]
          scale: 4
          rewind: true
        wsc:
          lib: mednafen_wswan_libretro
          folder: wsc
          roms: ["ws", "wsc", "pc2"]
          scale: 4
          rewind: true
        a2600:
          lib: stella_libretro
          folder: a2600
          roms: ["a26", "bin"]
          scale: 3
          rewind: true
        a7800:
          lib: prosystem_libretro
          folder: a7800
          roms: ["a78"]
          scale: 3
          rewind: true
        lynx:
          # mednafen_lynx needs lynxboot.img in the BIOS mount.
          lib: mednafen_lynx_libretro
          folder: lynx
          roms: ["lnx"]
          scale: 4
          rewind: true
        vb:
          lib: mednafen_vb_libretro
          folder: vb
          roms: ["vb", "vboy"]
          scale: 3
          rewind: true
        fds:
          # Famicom Disk System via nestopia; needs disksys.rom in the BIOS mount.
          lib: nestopia_libretro
          folder: fds
          roms: ["fds"]
          scale: 3
          rewind: true
        neogeo:
          # Neo Geo AES/MVS romsets via fbneo (the arcade core); needs neogeo.zip in the BIOS mount.
          # Finicky (parent romset grind) — stage last.
          lib: fbneo_libretro
          folder: neogeo
          roms: ["zip"]
          scale: 3   # was 2 -- 304x224 native, matches the mame entry above
          rewind: true
          options:
            fbneo-allow-depth-32: "enabled"   # same 16-bit finding as the mame entry above

        # ─── R: systems expansion (2026-07-18) — small 8-bit consoles, all pure-software cores on the
        # standard libretro buildbot, no custom build. Same safety profile as the rest of this 2D tier. ───
        vectrex:
          lib: vecx_libretro
          folder: vectrex
          roms: ["bin", "vec"]
          scale: 4   # 330x410 native, tall/narrow vector display
          rewind: true
        intv:
          # Needs exec.bin + grom.bin in the BIOS mount.
          lib: freeintv_libretro
          folder: intv
          roms: ["int", "rom", "bin"]
          scale: 4
          rewind: true
        coleco:
          # gearcoleco (modern replacement for the old coleco core). Needs colecovision.rom in the BIOS mount.
          lib: gearcoleco_libretro
          folder: coleco
          roms: ["col", "cv", "bin", "rom"]
          scale: 3
          rewind: true
        channelf:
          # Needs sl31253.bin + sl31254.bin (PSU I/II) in the BIOS mount.
          lib: freechaf_libretro
          folder: channelf
          roms: ["bin", "rom", "chf"]
          scale: 4
          rewind: true
        o2em:
          # Odyssey2/Videopac (base hardware only — Videopac+/G7400's g7400.bin needs an unsupported
          # rename-as-o2rom.bin workaround, so that ~32-file subset is left uningested). Needs o2rom.bin.
          lib: o2em_libretro
          folder: o2em
          roms: ["bin"]
          scale: 4
          rewind: true
        arcadia:
          # Auto-detects ROM variant/clone by CRC32; no BIOS needed.
          lib: amiarcadia_libretro
          folder: arcadia
          roms: ["bin", "rom"]
          scale: 4
          rewind: true
        supervision:
          # Watara Supervision; public-domain core, no BIOS needed.
          lib: potator_libretro
          folder: supervision
          roms: ["bin", "sv"]
          scale: 4
          rewind: true
        pokemini:
          # BIOS optional (bios.min) — runs fine without it.
          lib: pokemini_libretro
          folder: pokemini
          roms: ["min"]
          scale: 4
          rewind: true
        3do:
          # Opera (active 4DO/FreeDO fork) — pure software, no GL scaffolding touched (unlike angrylion,
          # it never declares HW-render capability, so no nil-deref risk). BIOS auto-selects by disc
          # region; both US (panafz10.bin) and JP-adjacent (goldstar.bin) staged for a mixed-region set.
          lib: opera_libretro
          folder: 3do
          roms: ["m3u", "cue", "chd", "iso"]   # m3u = multi-disc (see dc note)
          scale: 3
          rewind: true   # opera serializes fine; states are a few MB so the 512 MB ring just holds less history
          options:
            opera_bios: "panafz10.bin"
        scummvm:
          # Pure software, safe (same profile as opera/same_cdi above). "ROM" = a tiny generated
          # .scummvm hook file naming a target in the deployed scummvm.ini; the actual game data is a
          # directory the gateway's companion mechanism stages into roms/scummvm/<target>/ (same fix
          # that unlocked Naomi's GD-ROM pairs — see RomCache.StageCompanionAsync). Needs
          # system/scummvm/scummvm.dat (GUI/engine resources, must version-match this core build) and a
          # scummvm.ini with one [target] section per game, path= pointing at that same materialized
          # location — both deployed alongside this config, not carried here.
          # Playable with EITHER device: the core's OWN built-in cursor emulation (left stick moves the
          # pointer, L/R = click) reads our existing continuous analog axes — no input-profile change —
          # and a real mouse rides the separate RETRO_DEVICE_MOUSE path (kbMouseSupport + the option
          # below). The two are independent code paths inside the core, so enabling one keeps the other.
          lib: scummvm_libretro
          folder: scummvm
          roms: ["scummvm"]
          # ENCODE GEOMETRY. This core is the reason scaleMaxWidth exists: unlike every console here, its
          # games do NOT share one native resolution — most SCUMM/Sierra classics are 320x200, the later
          # ones (Curse of Monkey Island, Broken Sword) are 640x480 — so a bare multiplier is wrong for
          # half the catalog either way. `scale` is therefore a CEILING: the worker picks the largest
          # INTEGER factor whose output still fits scaleMaxWidth, per game, from the frame the core
          # actually renders (Frontend.Scale).
          #   320x200 -> x6 = 1920x1200      640x480 -> x3 = 1920x1440      320x240 -> x6 = 1920x1440
          # Measured 2026-07-27: at the old flat `scale: 3` a 320x200 game shipped a 960x600 stream, and
          # the browser's bilinear stretch of that across a full window is the whole of the "ScummVM looks
          # fuzzy even at 16 Mbps" complaint — the bitrate was never the constraint (ABR reached 15956
          # kbps in 9 s and held; 960x600 is simply not many pixels). Integer factors matter: a fractional
          # nearest-neighbour ratio duplicates some rows more than others and shimmers on panning shots.
          scale: 6
          scaleMaxWidth: 1920
          # This core stops calling the audio callback ENTIRELY while a game is quiet — it does not emit
          # zeros the way every other core here does. Verified 2026-07-26/27 in the worker log: whole 5 s
          # pace-diag windows at audio/s=0 with video/s steady at 60, then exactly 48000/s again the
          # moment sound resumed, and `deficit` climbing 26.7 s across one 3.5 min session while maxTick
          # and ticks/s stayed perfectly healthy. So the core is NOT stalling; its audio clock simply
          # stops. Left alone that freezes the Opus/RTP timeline for the length of every silence, draining
          # the client's jitter buffer so it has to re-ramp on the next sound — which in a point-and-click
          # lands on the front of dialogue lines.
          # ⚠ Do NOT "fix" this with audioMaster (an earlier note here proposed exactly that). audioMaster
          # repays a deficit by running the core up to 2% FAST, which can never make up silence that was
          # never owed — it would just hold this core permanently above its fps floor. The two settings
          # are mutually exclusive and the worker refuses the combination out loud.
          audioSilenceFill: true
          # ⚠ RELATED BUT SEPARATE, and the one that actually cost a player something: scummvm.ini's
          # global [scummvm] section had `music_driver=null` + `opl_driver=null`. `null` is not "unset",
          # it is ScummVM's real "No music" DEVICE — so every MIDI-scored game (iMUSE/AdLib/GM/MT-32)
          # threw its score away. Found 2026-07-27 from "music missing at the beginning" of Day of the
          # Tentacle. Now `adlib` + `nuked` in data/arcade/scummvm-deploy.ini (⚠ data/ is GITIGNORED, so
          # that file is NOT in this repo — this comment is the tracked record of the setting; the live
          # copies are <ConfDir>/libretro/system/scummvm.ini on both workers, with .pre-musicdriver.bak
          # beside them). audioSilenceFill above does NOT fix or mask this: it cannot invent music the
          # core never produced. It is what made it VISIBLE — silence/s showed DoTT quiet ~80% of the
          # time while Monkey Island CD, whose music is digital redbook audio through the MIXER rather
          # than the MIDI device, sat at a clean 48000/s and was never affected. That contrast is the
          # reason this hid for so long: it is invisible on every digitally-scored game in the catalog.
          # ⚠ REQUIRED by scummvm_pointer_device: "mouse" below — and the reason the first attempt at
          # relative-mouse support shipped DEAD (2026-07-27). RETRO_DEVICE_MOUSE deltas ride a dedicated
          # "mouse" DataChannel, and the worker only OPENS that channel (and the "keyboard" one) when the
          # core declares kbMouseSupport (coordinatorhandlers.go: `needsKbMouse := r.App().KbMouseSupport()`).
          # Stock sets it on exactly one core (dos/dosbox_pure) and nothing else in this file had it, so the
          # browser's pc.ondatachannel never fired for "mouse", every delta/click was dropped into a null
          # channel, and flipping the option away from "pointer" removed the only path that had been
          # working — mouse support went from "clicks work, hover doesn't" to nothing at all.
          # The flag ONLY gates channel creation; it costs an unused keyboard channel and nothing else.
          kbMouseSupport: true
          # no_options_update_flag (patch 0046): do NOT raise the one-shot GET_VARIABLE_UPDATE
          # "options changed" flag for this core. ScummVM answers that flag inside retro_run by walking
          # its options/GUI path on tick 1 — before its engine and graphics manager exist — and
          # access-violates at [NULL+8]. EVERY ScummVM game has died that way since the flag started
          # firing (e52e927, 2026-07-23): Myst was just the first launch after it, and Day of the
          # Tentacle, verified good on 07-18, crashes identically. Stock nanoarch hardcoded this flag
          # to false, which is what all 376 targets were verified on. Cores that need it (melonDS DS,
          # citra) are unaffected — they keep the flag.
          hacks: [no_options_update_flag]
          options:
            # FORCE the software surface path (2026-07-18 root-cause). The core's default OpenGL
            # graphics mode sends RETRO_HW_FRAME_BUFFER_VALID frames; on this software-armed room
            # (no GL context) that crashed the worker in ReadFramebuffer (now fail-softed). Disabled
            # = REQUEST_SW from boot: real RGB565 pixel frames down the normal software path.
            # NOTE the companion fix that unblocked ANY output at all: the frontend now ANSWERS
            # GET_AUDIO_VIDEO_ENABLE (nanoarch.c) — ScummVM reads a refusal as "produce nothing"
            # and ticked forever with video_cb never called.
            scummvm_video_hw_acceleration: "disabled"
            # MOUSE (2026-07-27, corrected same day). These are point-and-click games and the room streams
            # the player's real mouse. First attempt used "pointer" (RETRO_DEVICE_POINTER, hover with
            # pressed=0) by analogy with the 3DS/NDS stylus work — WRONG for this core: verified against
            # ScummVM's own source (backends/platform/libretro/src/libretro-os-inputs.cpp), its cursor only
            # moves on a PRESSED transition or while held, because POINTER models a touchscreen (no touch =
            # no valid position, by design). Hover packets landed and were silently never applied — the
            # cursor never tracked the mouse. citra/melonDS happen to read POINTER x/y regardless of
            # pressed for their own crosshair rendering; ScummVM does not.
            #
            # "mouse" = RETRO_DEVICE_MOUSE relative deltas, which ScummVM DOES apply unconditionally every
            # poll (its mouse-speed code path has no pressed gate at all) — that's what makes hover work.
            # cloudRetroClient.js now sends deltas over CloudRetro's own pre-existing (never-before-wired)
            # "mouse" DataChannel (MOUSE_SYSTEMS). Only the raw tokens "mouse"/"pointer" exist for this
            # option (confirmed from the deployed core's own option strings) — no separate "retropad-only"
            # value; the RetroPad stick-driven cursor is a SEPARATE always-on code path in the core, not
            # gated by this option, so switching to "mouse" does not remove it. Pinned explicitly because
            # the core's own default for this option is PLATFORM-CONDITIONAL.
            scummvm_pointer_device: "mouse"
            # ⚠ MUST equal MOUSE_SPEED in cloudRetroClient.js. The shim drives the cursor to an ABSOLUTE
            # position over this relative device — it keeps a model of where the cursor is and sends
            # (target - model) — which means it has to invert whatever the core multiplies by. ScummVM's
            # own source is `deltaAcc = (float)x * mouse_speed`, a bare multiplier with no screen ratios
            # of any kind (backends/platform/libretro/src/libretro-os-inputs.cpp), so inverting a KNOWN
            # value is exact. Leaving it unpinned is what made the cursor feel like someone else's mouse:
            # the core's default is not documented anywhere and we were multiplying by it blind.
            # 1.25 rather than 1.0 for one reason: 1.25 is a token this exact DLL's option table
            # PROVABLY contains (extracted: 0.05 0.15 0.35 0.45 1.25 1.75 ...), and libretro silently
            # ignores an unknown option VALUE — pinning "1.0" on a build whose table lacks it would look
            # applied, log nothing, and quietly leave the core on its default. It is also exactly
            # representable in binary floating point, so the client's division introduces no error.
            scummvm_mouse_speed: "1.25"
            # ScummVM's own Global Main Menu (save/load, engine options, quit) on a stick-click. This is
            # the one core in the arcade where an in-core menu even exists: libretro cores normally have
            # no UI of their own (RetroArch draws the options screen, and CloudRetro has no menu layer —
            # which is why the site has its own ⚙ Configure panel instead). ScummVM is the exception
            # because the core embeds ScummVM itself and draws its GUI into the video frame.
            #
            # ⚠ Mapper VALUES are RETROK_* tokens (verified in the deployed DLL's option table, alongside
            # labels like "Keyboard F5" — the recurring values-not-labels trap). They are NOT ScummVM's
            # internal keymapper action ids (MENU/OPTS/LCLK...), which look plausible in a strings dump
            # but belong to a different layer entirely.
            #
            # L3/R3 chosen because they are unused by the core's gamepad cursor emulation, so nothing
            # that works today is clobbered. If a game swallows F5 for its own save dialog, switch this
            # to RETROK_F1 — one token, no other change.
            scummvm_mapper_l3: "RETROK_F5"
            scummvm_mapper_r3: "RETROK_F7"
        cdi:
          # same_cdi (MAME's CD-i driver, stripped to a libretro core) — pure software, safe. Needs
          # cdimono1.zip both at the BIOS root AND under same_cdi/bios/ (the core's own lookup path).
          # Lower hit rate than other systems by design: MAME's driver has no DVC/MPEG-FMV emulation,
          # so FMV-heavy titles (e.g. the Zelda CD-i trilogy) will be degraded/broken regardless of
          # config — that's upstream, not ours to fix. No save-states/cheats on this core.
          lib: same_cdi_libretro
          folder: cdi
          roms: ["m3u", "chd", "iso", "cue"]   # m3u = multi-disc (see dc note)
          scale: 3

        # ─── Nintendo DS via melonDS DS (W10, 2026-07-23) ───────────────────────────────────────
        # melondsds_libretro — the MAINTAINED melonDS DS rewrite (NOT legacy melonds_libretro, which is
        # kept beside it as a rollback). Booted SOFTWARE-rendered first to prove the path without the GL
        # Flip contract; the OpenGL renderer (internal 3D upscale like ppsspp) is a deliberate follow-up.
        #
        # ENCODE GEOMETRY: melonds' base geometry IS the COMPOSITED layout (top-bottom = 256x384), so DS
        # behaves like a 2D core for the encoder — scale>=2 for H.264/AV1 chroma correctness (the 2D-core
        # lesson), nearest-neighbour (pixel art + 2D UI). scale:2 -> 512x768 PORTRAIT encode; the client
        # letterboxes it. No coreAspectRatio (software core; the encoded frame's own dims carry the aspect,
        # exactly like snes/nes/gba).
        #
        # ⚠ OPTION KEYS ARE `melonds_` (NOT `melonds_ds_`) and VALUE tokens are lowercase-hyphenated — BOTH
        # extracted from melondsds_libretro.dll strings, NOT the docs. The docs' `melonds_ds_` prefix would
        # be one of libretro's SILENTLY-IGNORED unknown keys (the recurring "values not labels" trap).
        #
        # SAVES: melonds exposes RETRO_MEMORY_SAVE_RAM (.sav) -> standard .srm harvest class (like nes/snes/
        # gba/n64/ps1), so DS saves ride the EXISTING save vault with no new machinery. (Verified in the DLL.)
        #
        # BIOS: builtin FreeBIOS + direct boot needs NO real BIOS for retail carts (removes a boot-path risk
        # from enablement). The real DS BIOS (bios7.bin/bios9.bin/firmware.bin, copied from C:\Network Share\
        # bios) IS staged under each worker's libretro/system/melonDS DS/ so sysfile_mode can flip to native
        # later. DSi mode (needs a NAND dump) is out of scope.
        #
        # POINTER/TOUCH (W10 deliverable): melonds_touch_mode:touch reads RETRO_DEVICE_POINTER (absolute) and
        # the CORE maps it through the active screen layout to bottom-screen touch coords itself (cursor.cpp
        # layout.TransformPointerInput, bounds-checked to NDS_SCREEN_SIZE 256x192). So the site's pointer
        # mechanism only has to deliver a letterbox-corrected FULL-FRAME normalized coord — it never needs to
        # know the DS layout. The pointer wire mechanism is W10 Phase C (not yet built; a pad works today).
        #
        # LAYOUT PINNED to ONE top-bottom layout (number_of_screen_layouts:1) so encode geometry is STABLE:
        # no R2-cycle to a different-sized layout mid-room (which would force an encode caps-reneg). The
        # dual-screen layout will be exposed per-game via the ⚙ Configure tool (W10 Phase C).
        nds:
          lib: melondsds_libretro
          folder: nds
          roms: ["nds"]
          # OPENGL upscaling (2026-07-24). melonDS renders the 3D at 4x native via its OpenGL renderer
          # (melonds_render_mode:opengl + melonds_opengl_resolution:4 below) → the frame arrives at
          # 1024x1536 already, so scale:1 (no server nearest-stretch). Real detail, not a blur.
          # STOCK melondsds_libretro.dll — NO custom core build (the from-source build with symbols was
          # only used to DIAGNOSE the crash; the actual fixes are worker-side + these three flags).
          isGlAllowed: true      # GL hw-render path (melonDS's OpenGL renderer wants a GL context)
          coreAspectRatio: true  # GL cores must send their AR or the client can't orient/letterbox
          # usesLibCo IS LOAD-BEARING for the OpenGL renderer, NOT a perf knob. Without it the worker
          # makes the GL context current on the LoadGame thread, UNLOCKS it, then runs retro_run on
          # another thread — so melonDS's GLCompositor::RenderFrame issues glBindFramebuffer with NO
          # current context and the NVIDIA driver access-violates (gdb on a from-source build pinned it
          # to GPU_OpenGL.cpp:242). LibCo keeps context_reset + retro_run on ONE cothread where the
          # context stays current. It also incidentally fixed the JIT fastmem crash, so fastmem stays
          # ENABLED (default). (melonDS has NO Vulkan renderer — Software/OpenGL/GL-Compute only — so
          # unlike 3ds this is OpenGL-only; there is no Vulkan path to mirror.)
          usesLibCo: true
          scale: 1
          scaleMethod: nearest-neighbour
          options:
            melonds_render_mode: "opengl"
            # 4x internal (256x192 → 1024x768 per screen; stacked frame 1024x1536). The 4070 Ti renders
            # DS at 4x for free (60.0 ticks/s). Pairs with "nds" => 8000 in
            # CloudRetroHost.DefaultVideoBitrateKbps for the larger portrait encode. Lower for less
            # bandwidth (a bad token PANICS the core — values 1..8).
            melonds_opengl_resolution: "4"
            melonds_touch_mode: "touch"
            melonds_console_mode: "ds"
            melonds_boot_mode: "direct"
            melonds_sysfile_mode: "builtin"
            melonds_screen_layout1: "top-bottom"
            melonds_number_of_screen_layouts: "1"
            # Cursor shown only WHILE TOUCHING. The player's OS mouse cursor is the aim indicator (so the
            # shim streams pointer only while pressed — no hover flood), and the DS overlay then just gives
            # touch feedback at the contact point. "always" would leave a stale cursor parked at the last
            # touch when the mouse is idle/off the video. (Was "always" during W10 bring-up.)
            melonds_show_cursor: "touching"

        # ─── Nintendo 3DS via citra_libretro — VULKAN RENDERER (W10, 2026-07-23) ────────────────────────
        # The GL path is a dead end here: the DEPLOYED citra_libretro.dll (Lime3DS/PabloMK7 lineage, built
        # 2026-07-23) requested a GL 3.3 CORE context and then null-called (0xC0000005 rip=0) into its own
        # glad loader for a GL 4.x entry point right after GL init — the classic "core needs 4.3+ compute,
        # got a 3.3 context" fault (Saturn Kronos crash class). BUT the same DLL ships a FULL Vulkan
        # renderer (video_core/renderer_vulkan: vk_instance/vk_swapchain/RasterizerVulkan) AND a software
        # one, and — DLL string audit — has NO renderer core-option (`graphics_api` is an internal Settings
        # field, not a citra_* option, sitting beside physical_device/use_gles/renderer_debug). So, exactly
        # like flycast/dolphin/ppsspp, citra picks its renderer from the FRONTEND's preferred HW context:
        # GET_PREFERRED_HW_RENDER answers VULKAN when hwContext:"vulkan" (nanoarch.go), and citra then runs
        # renderer_vulkan on our proven Vulkan-capture plumbing (vkm2) — no worker rebuild, the Vk frontend
        # is already live (it runs ps2/psp/dc/ps1). Same recipe as those: isGlAllowed:false + hwContext:
        # vulkan + usesLibCo + skip_hw_context_destroy. ROMs are DECRYPTED No-Intro .3ds (NCCH NoCrypto),
        # no aes_keys.txt needed. First boot runs with NO options (citra defaults every setting → valid
        # geometry); the prior GL attempt PANICKED on bad option value tokens — re-add citra_layout_option/
        # citra_resolution_factor/touchscreen only with tokens extracted from the DLL, AFTER it boots.
        # Touch (bottom screen) rides the existing pointer mechanism (citra polls RETRO_DEVICE_POINTER) —
        # add "3ds" to POINTER_SYSTEMS once video is proven. 2 ingested rows: 68835/68836.
        3ds:
          # CUSTOM CORE (2026-07-24): citra_custom_libretro.dll = libretro/citra + a 2-line MovieTheater
          # patch (docker/arcade/citra-build-core.bat) that un-comments the citra_graphics_api option +
          # FetchVariable — stock HARDCODES graphicsApi="OpenGL" so it always asked for OPENGL_CORE (which
          # our WGL can't host → GL3.3-ctx null-call 0xC0000005). With the patch + citra_graphics_api:Vulkan
          # below, citra runs its renderer_vulkan on our vkm2 Vulkan-capture path. The custom NAME pins it
          # vs libretro.cores.repo.sync (same trick as dolphin_custom/pcsx2_custom). ROLLBACK: lib:
          # citra_libretro (stock sits beside it). ⚠ re-run the build script after any citra core update.
          lib: citra_custom_libretro
          folder: 3ds
          roms: ["3ds", "cci", "cxi", "cia", "app"]
          # GL, and NOT by preference — TOUCH ONLY EXISTS ON THE GL PATH. citra builds its
          # MouseTracker in EmuWindow_LibRetro::CreateContext() behind `if (useOpenGL)`, and that
          # tracker is what feeds TouchPressed/TouchMoved; under Vulkan it is never constructed, so
          # the 3DS bottom screen is untouchable. It cannot simply be constructed anyway: its ctor
          # COMPILES GL SHADERS for the cursor overlay, so Vulkan touch needs input state split from
          # that overlay — a real citra refactor, not a flag.
          # Both renderers were A/B'd live on MK7 and draw an identical picture, and GL zero-copy is
          # armed here ("GL zero-copy armed for 3ds (no glReadPixels)"), so choosing GL costs nothing.
          # GL depends on the custom core asking for a 4.3 context (stock asked 3.3 while citra's own
          # gl_driver demands 4.3 and nothing checks IsSuitable() — that was the rip=0x0 crash).
          # The old "3DS is black" was NEVER a renderer bug: it was the MSVC handler-table miscompile
          # (citra-build-core.bat /vmg + service.h), which killed the guest under EITHER renderer.
          # ROLLBACK to Vulkan (renders fine + upscales at 2x, but NO touch — validated 2026-07-24:
          # synthetic surface sizes 800x960 from the factor-scaled av_info max, no crop):
          #   isGlAllowed: false + hwContext: "vulkan"
          # + citra_graphics_api: "Vulkan".
          isGlAllowed: true
          coreAspectRatio: true
          usesLibCo: true             # retro_run + context_reset on one cothread (the Vulkan-capture path)
          vfr: false
          # scale 1 (2026-07-24): citra now renders the stacked frame at 800x960 NATIVELY via
          # citra_resolution_factor:2x below (real 2x internal detail), so a server-side nearest 2x
          # would DOUBLE it again to 1600x1920 for no benefit. scale 1 keeps the encode at 800x960 --
          # same size as the old scale:2-of-400x480, but real rendered detail instead of a stretch.
          # Pairs with "3ds" => 6000 in CloudRetroHost.DefaultVideoBitrateKbps (800x960 @ 6 Mbps).
          scale: 1
          # Vulkan teardown hack (proven on ps2/psp/dc): skip the core's context_destroy so a Vk room close
          # can't deadlock/crash the single-thread model. Remove only if citra's Vk teardown proves clean.
          # vk_synthetic_surface (added 2026-07-24): citra_libretro carries its OWN swapchain
          # (src/citra_libretro/vulkan/vk_swapchain.cpp) and stashes the frontend surface
          # (emu_window->vkSurface = surface) in vk_create_device, so a VK_NULL_HANDLE there is the same
          # trap PPSSPP hit on 2026-07-16 — it access-violates once the presentation path touches it.
          hacks: [skip_hw_context_destroy, vk_synthetic_surface]
          options:
            # Deterministic renderer select (custom-core option; token from the DLL's own value list).
            # This is the ONLY option for first boot — citra defaults everything else (valid geometry);
            # the prior GL attempt PANICKED on bad layout/resolution tokens, so add those later, from the DLL.
            citra_graphics_api: "OpenGL"
            # Stylus/touch (2026-07-24). citra's MouseTracker reads RETRO_DEVICE_ID_POINTER_PRESSED only
            # when THIS option is on, and it ships "disabled" — so the pointer packets the client already
            # sends (the melonDS mechanism, unchanged) moved the cursor but never tapped. citra does the
            # same full-frame->layout transform melonDS does: it maps the normalized pointer into the
            # frame, clamps to the bottomScreen rect and subtracts its origin, so the client stays
            # layout-agnostic and "3ds" just joins POINTER_SYSTEMS. Tokens taken from the DLL's own
            # values[] list ("disabled|enabled") — bad tokens PANIC this core.
            citra_touch_touchscreen: "enabled"
            # Draw the stylus cursor (2026-07-25). MouseTracker::Render early-returns unless THIS is on,
            # and it ships "disabled" — so the touch WORKED but there was no on-screen crosshair, and with
            # hover positions now streamed by the client (pressed=0), the crosshair tracks the mouse so you
            # can SEE where the stylus is before tapping. Token from the DLL's values[] ("disabled|enabled")
            # — a bad token PANICS this core. mouse_touchscreen ships "enabled" already (position tracking).
            citra_render_touchscreen: "enabled"
            # Internal-res upscale (2026-07-24): renders the 3D at 2x native — the real quality lever
            # every other 3D system already has (n64/gc/ps2/psp). Token from the DLL's values[]
            # ("1x (Native)|2x|...|10x"); a bad token PANICS this core. The custom core's
            # retro_get_system_av_info scales base+max by this factor so the GL hw FBO is allocated
            # 800x960 (it is sized ONCE from av_info max and never grows) — a mismatched max clips the
            # render to BLACK. Validated live on MK7 + 50 Classic (sharp text/3D, touch lands, 59.8
            # ticks/s on the 4070Ti). ⚠ raising this re-derives the FBO size from the core, no config
            # coupling — but bumping it also grows the encode, so re-tune scale/bitrate together.
            citra_resolution_factor: "2x"
            # Custom texture packs (2026-07-25). Lets a game load replacement textures from
            # <ConfDir>/libretro/legacy_save/Citra/load/textures/<TITLEID:016X>/ (citra_libretro sets
            # its UserDir to <libretro save dir>/Citra/, so LoadDir is per-worker — install a pack on
            # EVERY GL worker or it applies on some rooms and not others). Token from the DLL's own
            # values[] ("disabled|enabled"); a bad token PANICS this core. Costs nothing for the ~120
            # 3DS titles with no pack: CustomTexManager just creates an empty dir and finds no files.
            # ⚠ DO NOT add a pack.json unless the pack was authored for it. FindCustomTextures falls
            # back to use_new_hash=false + skip_mipmap=true ONLY when ReadConfig finds no pack.json,
            # and that legacy pair is exactly what pre-2023 packs (the ones people actually have) were
            # dumped against. Writing a pack.json flips use_new_hash to whatever it says — get that
            # wrong and every lookup misses SILENTLY, the usual libretro failure mode.
            # First pack: Monster Hunter XX (0004000000197100), the HD UI set that ships with the
            # Complete English Patch. See memory 3ds-bake-update-cia-into-3ds.
            #
            # ⚠ PER-WORKER STATIC ASSETS live under <ConfDir>/libretro/legacy_save/Citra/load/ and are
            # NOT in the repo, NOT in the per-user card, and NOT recreated if a ConfDir is rebuilt —
            # re-copy them by hand onto every GL worker. Currently:
            #   load/textures/0004000000197100/     MHXX HD UI pack (429 files, from FinalPatchV3HD-UI.zip)
            #   load/updates/0004000000197100.app   MHXX English Patch v3.1 Crossplay update title
            # The updates/ path only works because of change 5 in citra-build-core.bat (stock citra
            # looks for updates ONLY inside sdmc/, which is the per-user card and gets wiped per room).
            # Source of the .app = the NCCH content of MHXXFinalPatchV3.1(Crossplay).cia; a copy is
            # kept at D:\ArcadeStorage\_deploy-backup\. The ROM stays the STOCK Japanese dump — the
            # patch CANNOT be baked into the .3ds (see the build script comment for why).
            citra_custom_textures: "enabled"


encoder:
  # Same NVENC H.264 + Opus-FEC path as the WSL stack (docker/arcade/config.yaml). nvcodec here comes
  # from MSYS2 gst-plugins-bad (dlopens nvEncodeAPI64.dll). INSTANT FALLBACK if nvcodec is absent on
  # this worker: set codec to vp8 (vpx ships in gst-plugins-good; the 13700K handles one 640x480 stream).
  video:
    # AV1 is the DEFAULT since 2026-07-09 (was h264; patch 0024 added the pipeline). The friend group
    # runs Chrome/Firefox — both take AV1 (verified live: video/AV1, 60fps) — and Safari is explicitly
    # unsupported (an AV1-only track would be NO VIDEO there; CloudRetro negotiates one codec per room).
    # Worth +0.884 dB at MATCHED bitrate ≈ 15% bitrate saving vs the H.264 baseline; client decode cost
    # 2.8-3.6ms vs 1.3ms (nowhere near the frame budget). ABR (0021) + VBV scaling (0025) carry over:
    # nvav1enc exposes the same live-changeable bitrate/vbv-buffer-size properties as nvh264enc.
    # INSTANT ROLLBACK: set codec: h264 and recycle the workers.
    # ⚠ TABLET FINDING (2026-07-10 late): AV1 can be a tablet-killer — Eric's tablet accepted the
    # AV1 track (Chrome advertises software dav1d, so negotiation succeeds) but could not
    # software-decode 1280x1056@60 in real time, and the infinite-GOP intra-refresh stream has NO
    # keyframes to resync/skip to, so the decode backlog grows WITHOUT BOUND (video minutes behind
    # the live audio, which rides its own trivially-decoded Opus PC; server + ABR blameless — 60
    # ticks/s and a clean worst-peer estimate all session; PCs with hardware AV1 unaffected). The
    # old "decode cost 2.8-3.6ms" verdict was measured on PC-class hardware only. AV1 STAYS the
    # default per Eric; the mitigation is the PER-ROOM codec override selectable in the lobby
    # ("video_codec" on the game start, patch 0036) — pick H.264 when a tablet will play: it is
    # hardware-decoded on effectively every device and its gop-size=120 IDR cadence naturally
    # bounds any receiver backlog.
    codec: av1
    threads: 0
    # ⚠ INERT for av1/h264: gstreamer.go only arms this when the encoder params carry the VPX-only
    # "keyframe-mode=disabled" token. Periodic keyframes for the NVENC codecs come from gop-size in
    # their params (see the av1 entry below). Kept for the vp8 fallback path, where it does work.
    keyframeInterval: 300
    # FULL-RANGE luma — shipped, reverted, then RE-SHIPPED after a real-Firefox WebRTC test
    # (2026-07-09; the full story is docs/arcade-quality-plan.md §17).
    #
    # The cores emit luma 0..255; without this key the pipeline converts to LIMITED (16..235),
    # discarding ~14% of code values. "1:3:5:1" (range:matrix:transfer:primaries = full:BT709:BT709:
    # BT709) makes the encode full-range and the SPS carries video_full_range_flag=1.
    #
    # The browser story, because it cost a full revert cycle: Chrome honours the flag (canvas values
    # match offline-decoded bytes EXACTLY). Firefox's FILE-PLAYBACK path does NOT (its displayed values
    # are the (y-16)*255/219 limited-read stretch) — that proxy result forced the revert. But Firefox's
    # WEBRTC path was then tested on a real laptop against a live room: its 1..15 dark-band mass matches
    # Chromium's (0.77%% vs 0.96%% — a limited misread would leave that band EMPTY), so WebRTC rendering
    # honours the flag in both browsers, and WebRTC is the only path this stream ever takes. Never trust
    # the file path as a proxy for the WebRTC path again.
    colorimetry: "1:3:5:1"
  list:
    # AV1 (patch 0024) — THE DEFAULT since 2026-07-09 (see encoder.video.codec above; h264 below is the
    # kept fallback for instant rollback / any future Safari need).
    # Measured offline against the RAW source frames, at MATCHED actual bitrate (nvav1enc overshoots its CBR
    # target by ~19%, so a naive same-`bitrate=` comparison flatters it by 2.4 dB — it isn't real):
    #   H.264 baseline  2,145,612 bytes  37.872 dB
    #   AV1             2,111,238 bytes  38.756 dB   (+0.884 dB for 1.6% FEWER bits, ~15% bitrate saving)
    # Verified live end-to-end: n64 1280x960, 60fps, 0 freezes, browser reports mimeType video/AV1 and
    # colorSpace.fullRange=true. Client decode cost rises (2.8-3.6ms vs 1.3ms for H.264) but nowhere near
    # the frame budget.
    #
    # NOT the default, purely a browser-support question: Chrome and Firefox both advertise video/AV1
    # receive; SAFARI DOES NOT. An AV1-only track means no video at all on a browser that can't decode it,
    # and CloudRetro negotiates one codec per room.
    #
    # ⚠ `av1parse` in the caps is not optional: Pion's AV1 payloader needs TEMPORAL-UNIT aligned OBUs.
    av1:
      # ⚠ gop-size is the ONLY periodic-keyframe mechanism on this pipeline. The top-level
      # keyframeInterval knob is INERT here: gstreamer.go arms its kfi path only when the params
      # contain the VPX-only token "keyframe-mode=disabled" (verified in source 2026-07-09), so the
      # previous gop-size=100000 meant an AV1 room emitted keyframes ONLY at startup + on joins
      # (patch 0012's join burst). CloudRetro ignores RTCP PLI, so any unrepaired loss or a browser
      # decoder hiccup then froze the video UNTIL THE NEXT JOIN while audio (aux PC) played on —
      # observed live on Firefox 2026-07-09, repeatedly. gop-size=120 = keyframe every 2 s, the same
      # cadence h264 shipped with for weeks; the "periodic IDR = audio hitch" rationale for infinite
      # GOP predates the aux audio PC (patch 0020) and no longer applies.
      # INTRA-REFRESH (2026-07-09): infinite GOP + a rolling intra wave every 2 s (15-frame wave).
      # Zero keyframe pulses — verified 600 frames -> exactly 1 keyframe. The properties come from
      # OUR patched nvcodec plugin (docker/arcade/gst-nvcodec-intrarefresh.patch — upstream GStreamer
      # left them as literal TODOs; the system libgstnvcodec.dll is the patched build, original kept
      # as .pre-intrarefresh.bak). ⚠ REQUIRED COMPANION: worker patch 0029 answers RTCP PLI/FIR with
      # a forced keyframe (rate-limited 500 ms) — with no periodic IDRs and PLI ignored, one
      # unrepaired loss would freeze a viewer forever (the exact bug fixed earlier today).
      # Join sync stays on patch 0012's join-burst. INSTANT ROLLBACK: gop-size=120, drop the
      # intra-refresh-* keys (works on the stock plugin too).
      #
      # TEMPORAL SVC (temporal-layers=3). NVENC emits a hierarchical-P pyramid — layer 0 references
      # only itself, so the SENDER can drop the upper layers for ONE peer without breaking anyone
      # else's reference chain. Each peer has its own Pion track/packetizer, so "drop a layer for this
      # peer" is literally "skip WriteSample" — no seq gaps, no NACKs, no Dependency Descriptor, and
      # the browser just sees a lower frame rate.
      #
      # This is what killed the worst-peer drag: ABR used to pull the room's ONE encode down to
      # whatever the weakest friend's link could carry, so one person on hotel wifi made the picture
      # worse for everybody. Now that peer gets fewer FRAMES and the room keeps its bitrate.
      #   tid<=0 = 28% of bitrate @15fps | tid<=1 = 54% @30fps | tid<=2 = 100% @60fps (measured)
      # A base-layer peer costs ~28% of what we send, so the room may run ~3.5x that peer's estimate.
      #
      # ⚠ NEEDS THE PATCHED PLUGIN: scripts/build-gst-nvcodec-patched.ps1 (upstream nvcodec exposes no
      # temporal-layer property for ANY codec, and it needs the SDK 13 header — SDK 12's
      # NV_ENC_CONFIG_AV1 has no enableTemporalSVC field at all). The GPU was never the limit: this Ada
      # 4070 Ti reports temporal_svc=1, 3 layers for AV1. Requires an NVENC 13.0 driver.
      # ⚠ A pacman -Syu that touches gstreamer restores the STOCK dll and this key stops doing
      # anything — silently, and the room falls back to 60fps-for-everyone + worst-peer ABR.
      # INSTANT ROLLBACK: drop temporal-layers=3 (the worker then reads 1 layer and never drops).
      # SPATIAL AQ (2026-07-30). Redistributes bits WITHIN a frame toward the blocks that need them,
      # instead of quantising the whole frame evenly. Added because a wired-LAN player saw blocking
      # confined to busy/moving regions while the encoder sat pinned at its ceiling with zero congestion
      # — the signature of per-frame bit starvation in specific areas, not of a thin link. Costs no
      # latency and no bitrate (it moves bits, it does not ask for more), which is why it goes in ahead
      # of any rate-control change. aq-strength left unset (0 = NVENC autoselect); property verified
      # present on BOTH nvav1enc and nvh264enc via gst-inspect before shipping, since an unknown
      # property fails the pipeline build and wedges the room.
      # ⚠ If blocking persists, the next lever is vbv-buffer-size, NOT more bitrate: tune=ultra-low-latency
      # with rc-mode=cbr gives the encoder ~1 frame of VBV, so a full-screen scroll cannot borrow bits
      # from its neighbours no matter how high the ceiling goes (16 Mbps was measured "better but not
      # clean"). vbv-buffer-size is settable directly and does not require changing tune.
      params: "preset=p6 tune=ultra-low-latency rc-mode=cbr bitrate=5000 gop-size=-1 intra-refresh-period=120 intra-refresh-count=15 temporal-layers=3 spatial-aq=true zerolatency=true"
      caps: video/x-av1,stream-format=obu-stream ! av1parse ! video/x-av1,stream-format=obu-stream,alignment=tu
    h264:
      encoder: nvh264enc
      # gop-size=120 for the same reason as av1 above — keyframeInterval is inert on this path and
      # an infinite GOP freezes late joiners / post-loss viewers until someone joins (PLI ignored).
      # spatial-aq: same rationale as the av1 block above, applied here too so the tablet lane (which
      # negotiates h264) gets the same within-frame bit distribution. Verified present on nvh264enc.
      # temporal-layers=2 (added 2026-08-02): the H.264 ladder shipped 2026-07-26 - gst patch
      # (hierarchicalPFrames=1), h264TemporalID reading nal_ref_idc in svc.go, and a MEASURED
      # layerShare["h264"][2] = {80,100} in abr.go - but the TOKEN was never added here, and
      # media/gstreamer.go TemporalLayers() parses the layer count out of THIS STRING (one source of
      # truth, by design). The element defaults to 1, so the whole ladder sat dark: every h264 room
      # logged "temporal layers 1" and every congestion event became a room-wide bitrate cut instead
      # of "30 fps for the one weak peer". Found via the capture lane 2026-08-02; same fix, both lanes.
      #
      # 2 is the CEILING and that part IS deliberate (abr.go): at 3 the middle layer becomes a
      # reference frame, nal_ref_idc stops separating the layers, and dropping them would punch
      # frame_num holes into a stream we negotiate as Constrained Baseline. The patched element
      # enforces it too ("Range: 1 - 2"). The h264 ladder is REAL but SHALLOW - a base-only peer still
      # costs ~80% of the room vs AV1's ~28% - so it is a cushion, not a substitute for AV1.
      # INSTANT ROLLBACK: drop the token (the worker then reads 1 layer and never drops).
      params: "preset=p6 tune=ultra-low-latency rc-mode=cbr bitrate=5000 gop-size=120 repeat-sequence-header=true temporal-layers=2 spatial-aq=true zerolatency=true"
      # ⚠ DO NOT ADD `,profile=high` HERE without also fixing SDP negotiation.
      #
      # It is tempting: measured offline against RAW worker frames (patch 0022 -> encode 120 deterministic
      # frames -> decode -> PSNR vs source), High profile is worth +1.02 dB at 8 Mbps (38.14 -> 39.16) and
      # +0.64 at 4 Mbps. CABAC + the 8x8 transform, free of latency.
      #
      # It was shipped for ~an hour and REVERTED. Without a profile in these caps nvh264enc emits
      # profile_idc=66 (Constrained Baseline), which is exactly what Pion advertises in SDP
      # (profile-level-id=42001f). Forcing High emits profile_idc=100 while the SDP still promises
      # baseline. Chrome decodes it anyway (verified live: gc/snes/ps1, 60fps, 0 freezes). Firefox's
      # WebRTC H.264 decoder is OpenH264, which only decodes SOME subsets of High
      # (https://bugzilla.mozilla.org/show_bug.cgi?id=1411681) — a friend on Firefox would get no video,
      # silently. Not worth 1 dB.
      #
      # The correct way to claim it is to register the H.264 codec with a matching profile-level-id
      # (e.g. 640028) in Pion's MediaEngine so browsers negotiate High honestly — at the price of Firefox
      # dropping H.264 entirely. The better answer is AV1 (patch 0024): +0.88 dB at MATCHED bitrate, and
      # Firefox DOES advertise video/AV1 receive. Safari does not.
      #
      # REJECTED by measurement: `multi-pass=two-pass-quarter` (37.51 dB, worse) and `spatial-aq` (36.98,
      # worse by construction — it moves bits to where the eye looks; PSNR cannot judge it, so it stays
      # off until someone A/Bs it on a real display).
      caps: video/x-h264,stream-format=byte-stream,alignment=au
    # In-band FEC ON (roadmap WS-A.2) — same override as the WSL stack; generic (not restricted-lowdelay)
    # + >=10ms frames are what make LBRR real. The gl-zone room binds a native Windows socket with no
    # mirrored-relay hop, so it's also the clean A/B control for the WS-A audio-loss hunt.
    opus:
      encoder: opusenc
      # frame-size 10 -> 20 (2026-07-29), chasing CRACKLE on N64 music that a client jitter buffer
      # CANNOT fix: 80 ms and 400 ms (arcade.audioJitterMs) sounded identical, which rules out drift and
      # underrun — a jitter buffer only smooths samples that ARRIVE. The audio path has no slack by
      # design (`queue max-size-buffers=1` into `appsink max-buffers=1 drop=true`, gstreamer.go
      # buildAudioPipeline), so a buffer the Go consumer fails to pull inside one frame period is
      # DROPPED, not delayed. 20 ms frames double that deadline and halve the packet rate, and 20 ms is
      # the usual Opus frame for music besides. Still >=10 ms, so in-band FEC/LBRR stays real.
      # Cost: ~10 ms more audio latency for every system (the rhythm-game concern in the psp audio
      # note applies). ROLLBACK: frame-size=10.
      # ⚠ If this does not fix it, the next step is a FORK patch giving the audio queue real depth
      # (audio drops are inaudible in the metrics we have — pace-diag's audio/s counts what the CORE
      # produced, not what survived the pipeline), NOT more client buffering.
      # ⚠ REVERTED 2026-07-30. A diagnostic briefly set packet-loss-percentage=0 / inband-fec=false /
      # complexity=10 / bitrate=128000 while hunting the SM64 Last Impact crackle. It made NO difference,
      # and the real cause turned out to be upstream of the encoder entirely (the HLE audio microcode —
      # see the parallel_n64 block's send_alist_to_lle_rsp note). Restored, because disabling loss
      # resilience is a genuine regression for anyone on a lossy link and there is now no reason to pay it.
      # frame-size stays 20 ms: also not the crackle, but 20 ms is the conventional Opus frame for music,
      # halves packet rate, keeps LBRR valid (needs >=10 ms), and costs ~10 ms of latency nobody reported.
      # NOT the place to chase audio faults — this whole line was eliminated by a pre-encode PCM capture
      # (nanoarch/audiodump.go) showing the samples were already correct before Opus ever saw them.
      # LOW-DELAY OPUS (arcade perf program P4, 2026-09-05). audio-type generic -> restricted-lowdelay: the
      # game's PCM has no use for SILK/hybrid modes, and CELT-only cuts Opus's own algorithmic delay
      # (~4 ms less lookahead). frame-size 20 -> 10: the 20 was set on 2026-07-29 chasing a crackle whose
      # real cause turned out to be the N64 HLE audio microcode (see the note above) — 10 ms halves the
      # framing delay and keeps in-band FEC/LBRR real (needs >= 10 ms). Audio used to sit ~80-100 ms behind
      # video; this is the encoder half of closing that (the client's link-tiered jitter target is the
      # other half). pipe.frameDur reads frame-size back, so RTP durations follow automatically.
      # ROLLBACK: audio-type=generic frame-size=20. Keep the two lanes' params in lockstep.
      params: "audio-type=restricted-lowdelay inband-fec=true packet-loss-percentage=15 frame-size=10 complexity=8 bitrate=96000"
  audio:
    codec: opus

storage:
  provider: ""    # never S3 — it would overwrite seeded saves at boot (arcade-saves-plan)

# DTLS ROLE WHEN ANSWERING (arcade perf program P13b, 2026-09-05). Only consulted when the BROWSER offers
# (INIT_WEBRTC initiator:true — the shim's arcade.browserOffers=1 A/B flag): Pion then answers a=setup:active
# and sends the DTLS ClientHello itself, once it is ready. Today's worker-offers rooms are untouched (Pion
# never answers there). Why: with Chrome as DTLS client its ClientHello lands before Pion's DTLS transport
# listens, the flight is lost and Chrome waits the RFC 6347 1 s RTO — measured 1041/1057 ms of every
# same-host room start. 2 = webrtc.DTLSRoleClient (1 auto, 3 server).
webrtc:
  dtlsRole: 2
