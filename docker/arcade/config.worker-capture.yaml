# CloudRetro config for the Windows-native CAPTURE worker (heavy browser lane, H5 —
# docs/arcade-capture-worker-plan.md). This worker runs the SAME cmd/worker binary as the GL
# workers, but with the capture caged mod enabled (capture.enabled: true) instead of libretro
# cores. It launches native heavy titles (yuzu/RPCS3/…) and streams the desktop through the
# UNCHANGED encode/WebRTC pipeline, so the encoder block below is IDENTICAL to config.worker-gl.yaml.
#
# It joins the SAME coordinator (localhost:8000) but in zone "capture" so retro rooms never land on
# it and vice-versa (⚠ retro rooms MUST send zone=main — the gateway derives it from the room-id
# system, plan §5.1). The flat knobs (zone, singlePort, iceIpMap, coordinator, Windows paths) come
# from CLOUD_GAME_* env in scripts/register-arcade-glworker-task.ps1 -Zone capture.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# THIS FILE IS AUTHORITATIVE. Deploy:
#   cp docker/arcade/config.worker-capture.yaml D:/ArcadeStorage/worker-capture/config.yaml
#   then recycle the capture worker (Stop-Process worker for that task — runner respawns in ~4s).
# Edit HERE, then deploy. Never hand-edit the D: copy (that is how config.worker-gl.yaml drifted).
# ⚠ Keep plain UTF-8, no BOM. Keep the encoder block in LOCKSTEP with config.worker-gl.yaml.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

coordinator:
  origin:
    userWs: "https://theater.carpouzis.com"

library:
  # The capture stubs: one empty file <heavyAppId>.capture per capture-enabled title. The FILENAME
  # is the join key (== heavy descriptor id == ArcadeGame.CloudRetroGameKey). FindAppByName resolves
  # a start to System "capture" via the pseudo-core below, and the coordinator branch keys on that.
  basePath: "D:/ArcadeStorage/heavy/capture-stubs"
  watchMode: true

emulator:
  autosaveSec: 0
  storage: "D:/ArcadeStorage/saves"
  libretro:
    saveCompression: false
    cores:
      repo:
        sync: false   # this worker dlopens NO cores — the capture branch fires before any load
      list:
        # Pseudo-core: a file "<id>.capture" -> System "capture". `lib: capture` is NEVER dlopened
        # (the coordinator branch tests gameInfo.System == "capture" and hands the room to the
        # capture mod before app.Load). roms:["capture"] is what GetEmulator matches the extension on.
        capture:
          lib: capture
          roms: ["capture"]

# The capture caged mod (heavy browser lane). Only this worker sets enabled: true.
capture:
  enabled: true
  gatewayUrl: "http://localhost:2303"
  secretFile: "D:/ArcadeStorage/heavy/gateway-secret.txt"
  profilesFile: "D:/ArcadeStorage/heavy/profiles/profiles.json"
  monitorIndex: 0          # index into the ENUMERATED PHYSICAL monitors (logged at boot; SudoVDA trap §1)
  width: 1920
  height: 1080
  fps: 60
  audioScope: "process"    # process (PID-scoped loopback) | system (whole endpoint)

encoder:
  # ⚠ IDENTICAL to config.worker-gl.yaml — the capture lane reuses media.NewGstreamer unchanged, so
  # AV1 default / per-room codec (0036) / ABR (0021) / intra-refresh all carry over. Keep in lockstep.
  video:
    codec: av1
    threads: 0
    keyframeInterval: 300
    colorimetry: "1:3:5:1"   # full-range luma (BT709); see the GL config's long note
  list:
    av1:
      # gop-size=-1 + intra-refresh (patched nvcodec plugin); PLI responder = worker patch 0029.
      # capture bitrate ceiling defaults higher than retro (1080p desktop) — the site's per-system
      # Auto bitrate (capture ~12 Mbps) + ABR move it; this is the CBR base the encoder builds with.
      params: "preset=p6 tune=ultra-low-latency rc-mode=cbr bitrate=8000 gop-size=-1 intra-refresh-period=120 intra-refresh-count=15 zerolatency=true"
      caps: video/x-av1,stream-format=obu-stream ! av1parse ! video/x-av1,stream-format=obu-stream,alignment=tu
    h264:
      encoder: nvh264enc
      params: "preset=p6 tune=ultra-low-latency rc-mode=cbr bitrate=8000 gop-size=120 repeat-sequence-header=true zerolatency=true"
      caps: video/x-h264,stream-format=byte-stream,alignment=au
    opus:
      encoder: opusenc
      params: "audio-type=generic inband-fec=true packet-loss-percentage=15 frame-size=10 complexity=8 bitrate=96000"
  audio:
    codec: opus

storage:
  provider: ""    # never S3
