# CloudRetro config for the Windows-native CAPTURE worker (heavy browser lane, H5 â€”
# docs/arcade-capture-worker-plan.md). This worker runs the SAME cmd/worker binary as the GL
# workers, but with the capture caged mod enabled (capture.enabled: true) instead of libretro
# cores. It launches native heavy titles (yuzu/RPCS3/â€¦) and streams the desktop through the
# UNCHANGED encode/WebRTC pipeline, so the encoder block below matches config.worker-gl.yaml â€”
# EXCEPT colorimetry (deliberately limited-range here, full-range there; see the note in the block).
#
# It joins the SAME coordinator (localhost:8000) but in zone "capture" so retro rooms never land on
# it and vice-versa (âš  retro rooms MUST send zone=main â€” the gateway derives it from the room-id
# system, plan Â§5.1). The flat knobs (zone, singlePort, iceIpMap, coordinator, Windows paths) come
# from CLOUD_GAME_* env in scripts/register-arcade-glworker-task.ps1 -Zone capture.
#
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# THIS FILE IS AUTHORITATIVE. Deploy:
#   cp docker/arcade/config.worker-capture.yaml D:/ArcadeStorage/worker-capture/config.yaml
#   then recycle the capture worker (Stop-Process worker for that task â€” runner respawns in ~4s).
# Edit HERE, then deploy. Never hand-edit the D: copy (that is how config.worker-gl.yaml drifted).
# âš  Keep plain UTF-8, no BOM. Keep the encoder block in lockstep with config.worker-gl.yaml
#   EXCEPT colorimetry â€” "2:3:5:1" (limited) is a deliberate divergence; never "resync" it to the
#   GL pool's full-range "1:3:5:1" or SDR desktops wash out on tablet H.264 decoders again.
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

coordinator:
  origin:
    userWs: "https://theater.carpouzis.com"

library:
  # The capture stubs: one empty file <heavyAppId>.capture per capture-enabled title. The FILENAME
  # is the join key (== heavy descriptor id == ArcadeGame.CloudRetroGameKey). FindAppByName resolves
  # a start to System "capture" via the pseudo-core below, and the coordinator branch keys on that.
  basePath: "D:/ArcadeStorage/heavy/capture-stubs"
  watchMode: true

emulator:
  autosaveSec: 0
  storage: "D:/ArcadeStorage/saves"
  libretro:
    saveCompression: false
    cores:
      repo:
        sync: false   # this worker dlopens NO cores â€” the capture branch fires before any load
      list:
        # Pseudo-core: a file "<id>.capture" -> System "capture". `lib: capture` is NEVER dlopened
        # (the coordinator branch tests gameInfo.System == "capture" and hands the room to the
        # capture mod before app.Load). roms:["capture"] is what GetEmulator matches the extension on.
        capture:
          lib: capture
          roms: ["capture"]
          # bppTarget: the bits-per-pixel-per-frame the DERIVED Auto ceiling is computed from
          # (worker abr.go autoCeilingKbps). Without it the lane inherits the smooth/3D class default
          # 0.18, which was cross-checked against GameCube-class flat-shaded 3D — NOT photoreal 1080p60.
          # 1920x1080 @60 x 0.18 = 22.4 Mbps, and every Bloodborne room 2026-08 derived exactly that
          # and looked like a potato (Eric, 2026-09-02): dark grainy scenes, chromatic aberration and
          # fast camera motion are the worst case for a 22 Mbps CBR stream. 0.32 x 1080p60 = 39.8 Mbps,
          # landing just under the 40000 abrAutoMaxKbps clamp (raised from 25000 on 2026-09-02 for the
          # fiber uplink — the OLD capture binary would have clamped this at 25000; the lane binary was
          # brought up to the fork the same day). Sized as a step, not a knee: no capture-lane SSIM
          # sweep exists yet (the frame dump instrument is a libretro-lane feature), so this stands on
          # the streaming-service reference band for photoreal 1080p60 (~35-50 Mbps) and on Eric's
          # eyes. If it still reads soft, the next step is 60000 across ALL THREE clamps + bppTarget
          # 0.48 — never this key alone above the clamp, or the derive silently pins at the clamp.
          # ⚠ h264 rooms at this rate carry a ~2 s IDR burst (gop-size=120); a Wi-Fi tablet that has to
          # fall back to h264 will be walked down by ABR — that is the codec, not the target.
          bppTarget: 0.32

# The capture caged mod (heavy browser lane). Only this worker sets enabled: true.
capture:
  enabled: true
  # captureMode: how the game is captured.
  #   window  (DEFAULT) - WGC WINDOW capture via the external ArcadeCaptureHost helper (helperPath).
  #            The game window is parked fully OFF-SCREEN (borderless, never focused) and captured by
  #            HWND, so it never appears on the owner's desktop and works in ANY session (console OR
  #            RDP). Does NOT use SudoVDA / monitor capture; the monitorIndex/virtualDisplay keys below
  #            are ignored in this mode (kept for the monitor fallback).
  #   monitor - legacy: capture a physical monitor, optionally isolated on a per-room SudoVDA virtual
  #            display (virtualDisplay: true). Console-session ONLY (an RDP session can't attach an IDD
  #            display). Set captureMode: "monitor" to restore this path.
  captureMode: "window"
  helperPath: "D:/ArcadeStorage/worker-capture/bin/ArcadeCaptureHost.exe"
  # reattachConsole (window mode): when a room starts and the worker's session is RDP-DISCONNECTED
  # (owner detached → stalled/32Hz DWM), auto-reattach the session to the physical console
  # (tscon /dest:console) so the game runs on the real high-refresh displays and capture is full-rate
  # 60fps. NEVER fires while the session is Active (would kick a live RDP owner to the console). Needs
  # the one-time elevated task "MovieTheater - Reattach Console" (scripts/register-reattach-console-task.ps1,
  # run once as admin); degrades gracefully (logs + continues) if the task is absent. Default true.
  reattachConsole: true
  gatewayUrl: "http://localhost:2303"
  secretFile: "D:/ArcadeStorage/heavy/gateway-secret.txt"
  profilesFile: "D:/ArcadeStorage/heavy/profiles/profiles.json"
  monitorIndex: 0          # index into the ENUMERATED PHYSICAL monitors (logged at boot; SudoVDA trap Â§1)
  virtualDisplay: true     # P4 isolation: per-room HIDDEN SudoVDA display so games never appear on the physical monitors
  width: 1920
  height: 1080
  fps: 60
  audioScope: "process"    # process (PID-scoped loopback) | system (whole endpoint)
  # Per-app audio isolation to VB-CABLE (so the game doesn't blast the HOST speakers): route ONLY the
  # game's audio (by PID â€” session-scoped, reverts when it exits) to "CABLE Input", capture from
  # "CABLE Output". Leave audioSink empty to fall back to loopback on the host's default device.
  audioSink: "CABLE Input"
  # LOOPBACK-tap CABLE Input (RENDER id {0.0.0.â€¦}) â€” BEFORE the cable's internal 96kHz SRC + ~7168-
  # sample transfer buffer that feeds CABLE Output ({0.0.1.â€¦}). Saves ~75-150ms of audio lag (Â§12A).
  audioCaptureDevice: "{0.0.0.00000000}.{ceabe612-e9ce-404e-8be3-e5d660d90bfe}"
  audioCaptureLoopback: true
  # VIDEO SOURCE. d3d12 is the ONLY screen source with HDR tonemapping (tonemap=reinhard), so it is
  # the one that stays colour-correct if this desktop is ever switched into HDR mode (plan Â§11).
  #
  # âš  IT REQUIRES OUR PATCHED PLUGIN. Stock libgstd3d12 reads a monochrome cursor's XOR mask ~16x
  # past the end of its buffer (buildMonochrom offsets by the DESTINATION RGBA size instead of
  # height*Pitch), which abort()s the process â€” MSYS2 builds libstdc++ with _GLIBCXX_ASSERTIONS â€”
  # within seconds of ANY fullscreen game, because that is when Windows hands out a monochrome
  # cursor. Kirby died 10-30s in, every time (0xC0000409), and a wedged capture worker then reads
  # to players as "the arcade is full". Still unfixed upstream in 1.28.4/1.28.5.
  #
  # The fix: docker/arcade/patches/gst/0001-d3d12-dxgicapture-monochrome-cursor-oob.patch
  # RE-RUN scripts/build-gst-d3d12-patched.ps1 AFTER ANY pacman -Syu THAT TOUCHES GSTREAMER â€”
  # the upgrade silently restores the stock DLL and the crash comes back. Fall back to "d3d11"
  # (no crash, no HDR tonemapping) if the plugin ever has to be un-patched.
  videoSource: "d3d12"
  # RUNTIME GUARD for exactly the trap described above. The worker hashes the plugin it is about to
  # load and compares it with the hash build-gst-d3d12-patched.ps1 stamped when it installed the
  # patched build. If a GStreamer upgrade has swapped the stock DLL back in, the hashes differ and the
  # worker falls back to d3d11 with a loud error at boot — instead of aborting seconds into every heavy
  # session, which players only ever experience as "the arcade is full" with nothing in the logs
  # pointing at the cause. Clear either key to skip the check.
  d3d12Plugin: "D:/msys64/ucrt64/lib/gstreamer-1.0/libgstd3d12.dll"
  d3d12PluginSha256: "D:/msys64/ucrt64/lib/gstreamer-1.0/libgstd3d12.dll.sha256"
  # P4 ZERO-COPY: keep the captured frame in GPU memory all the way into NVENC.
  #
  # Design A (zeroCopy: false) read every frame back to system memory (d3d12download) purely to hand it
  # to Go, which pushed it into the media pipeline's appsrc â€” which uploaded it to the GPU again for the
  # encoder. Measured on this box with the SAME encoder and only the readback varying:
  #   design A: 9.2 ms median captureâ†’encode      zero-copy: 3.0 ms
  # (arxiv 2507.00623 blames this round trip for +137 ms in a Unity/VR stack. That is NOT what it costs
  # here â€” it is ~6 ms, and their gap is a stalled render thread, not the copy.)
  #
  # It works by moving the capture SOURCE into the media pipeline (media.GstMediaPipe.VideoSrcChain)
  # rather than moving the encoder out of it â€” so ABR, the per-room codec and forced keyframes still act
  # on the same `video_enc` element and did not have to be reimplemented. Only the keyframe CLOCK moved
  # (encoded frames instead of raw input frames â€” media.maybeForceKeyframe).
  #
  # âš  Set this false to roll back to design A instantly (no rebuild): it is the A/B baseline, and it is
  # the path every libretro room still uses.
  zeroCopy: true
  soundVolumeView: "D:/ArcadeStorage/worker-capture/bin/SoundVolumeView.exe"

encoder:
  # âš  Matches config.worker-gl.yaml EXCEPT colorimetry (see below) â€” the capture lane reuses
  # media.NewGstreamer unchanged, so AV1 default / per-room codec (0036) / ABR (0021) /
  # intra-refresh all carry over. Keep in lockstep apart from that one deliberate divergence.
  video:
    codec: av1
    threads: 0
    keyframeInterval: 300
    # LIMITED-range BT709 (2:3:5:1), NOT the retro pool's full-range 1:3:5:1. The capture source is a
    # real sRGB desktop with true 0/255 blacks+whites; encoding it full-range washed out on a tablet
    # whose H.264 decoder assumes limited range (blacks lift to 16, whites clamp â€” "HDR looks broken").
    # Limited range is what every WebRTC decoder defaults to, so it renders correctly everywhere. The
    # retro pool keeps full-range (its cores' code values are worth preserving); a desktop capture is not.
    colorimetry: "2:3:5:1"
  list:
    av1:
      # gop-size=-1 + intra-refresh (patched nvcodec plugin); PLI responder = worker patch 0029.
      # bitrate= here is only the CBR base the encoder is BUILT with; ABR replaces it on the first tick
      # (room open 6000, ceiling = the derived Auto value — 1080p60 x the capture core's bppTarget
      # above, ~39.8 Mbps since 2026-09-02 — or the lobby's explicit pick).
      # temporal-layers=3: same per-peer SVC as the retro pool (see config.worker-gl.yaml for the full
      # note). Verified at THIS lane's geometry — 1920x1080 @12 Mbps produces the same clean pyramid
      # (tid 0/1/2 = 30/30/60 frames of 120), so a weak viewer of a heavy title drops to 30 or 15 fps
      # instead of pulling the whole room's 1080p encode down.
      #
      # ⚠ NOT verified through a browser on THIS box, and it cannot be: a fullscreen native title
      # occludes Chrome, an occluded Chrome stops compositing, and rVFC then never fires — the video
      # reads as black with zero frames even when the stream is perfect (test-roms gotcha 0b). Verify
      # from a SECOND machine. Rollback is deleting the key (the worker then reads 1 layer and the drop
      # path can never fire).
      # spatial-aq (added 2026-08-02, LOCKSTEP FIX): config.worker-gl.yaml gained this 2026-07-30 for
      # blocking confined to busy/moving regions while the encoder sat pinned at its ceiling with zero
      # congestion - per-frame bit starvation in specific AREAS, not a thin link. This file claims to
      # track that one except colorimetry and had silently drifted, so the capture lane (the LARGEST
      # frame we encode, 1080p60) was the one lane missing it. It moves bits within a frame rather than
      # asking for more, so it costs no bitrate and no latency. Verified present on nvautogpuav1enc.
      params: "preset=p6 tune=ultra-low-latency rc-mode=cbr bitrate=8000 gop-size=-1 intra-refresh-period=120 intra-refresh-count=15 temporal-layers=3 spatial-aq=true zerolatency=true"
      caps: video/x-av1,stream-format=obu-stream ! av1parse ! video/x-av1,stream-format=obu-stream,alignment=tu
    h264:
      encoder: nvh264enc
      # temporal-layers=2 (added 2026-08-02): H.264 SVC was BUILT AND NEVER SWITCHED ON. abr.go carries
      # a measured layerShare["h264"][2] = {80,100}, h264TemporalID reads nal_ref_idc to tag the layers,
      # and the drop path is per-peer WriteSample - but neither this file nor config.worker-gl.yaml ever
      # put the token in the params, so TemporalLayers() parsed nothing and returned 1 = SVC off. That
      # is why an h264 room logs "temporal layers 1" while av1 logs 3: an omission, not a decision.
      # 2 is the CEILING here and that part IS deliberate (abr.go): at 3 the middle layer becomes a
      # reference frame, nal_ref_idc stops separating layers, and dropping would punch frame_num holes
      # in a stream we negotiate as Constrained Baseline. The element enforces it too ("1 = off,
      # 2 = hierarchical-P with non-reference odd frames"). Buys a weak peer 30fps instead of pulling
      # the whole room down. Shallow vs av1 (~80% of the room, not ~28%) - real, but not a substitute.
      # spatial-aq: same lockstep fix as the av1 block. Verified on nvautogpuh264enc + nvh264enc.
      params: "preset=p6 tune=ultra-low-latency rc-mode=cbr bitrate=8000 gop-size=120 repeat-sequence-header=true temporal-layers=2 spatial-aq=true zerolatency=true"
      caps: video/x-h264,stream-format=byte-stream,alignment=au
    opus:
      encoder: opusenc
      # LOW-DELAY OPUS (arcade perf program P4, 2026-09-05). audio-type generic -> restricted-lowdelay: the
      # game's PCM has no use for SILK/hybrid modes, and CELT-only cuts Opus's own algorithmic delay
      # (~4 ms less lookahead). frame-size 20 -> 10: the 20 was set on 2026-07-29 chasing a crackle whose
      # real cause turned out to be the N64 HLE audio microcode (see the note above) — 10 ms halves the
      # framing delay and keeps in-band FEC/LBRR real (needs >= 10 ms). Audio used to sit ~80-100 ms behind
      # video; this is the encoder half of closing that (the client's link-tiered jitter target is the
      # other half). pipe.frameDur reads frame-size back, so RTP durations follow automatically.
      # ROLLBACK: audio-type=generic frame-size=20. Keep the two lanes' params in lockstep.
      params: "audio-type=restricted-lowdelay inband-fec=true packet-loss-percentage=15 frame-size=10 complexity=8 bitrate=96000"
  audio:
    codec: opus

storage:
  provider: ""    # never S3
