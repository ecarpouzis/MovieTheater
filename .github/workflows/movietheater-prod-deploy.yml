name: MovieTheater Prod Deploy
on:
  push:
    branches:
      - master

jobs:
  setup:
    runs-on: movietheater
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

  docker-build-api:
    needs: [setup]
    runs-on: movietheater
    env:
      REGISTRY: registry.local:32500
      IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "$MOVIETHEATER_APPSETTINGS_JSON" > src/MovieTheater/appsettings.Production.json
        env:
          MOVIETHEATER_APPSETTINGS_JSON: ${{ secrets.MOVIETHEATER_APPSETTINGS_JSON }}
      - run: cd docker && bash build-api.sh
      - run: docker push $REGISTRY/movietheater-api:$IMAGE_TAG

  docker-build-ui:
    needs: [setup]
    runs-on: movietheater
    env:
      REGISTRY: registry.local:32500
      IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: cd docker && bash build-ui.sh
      - run: docker push $REGISTRY/movietheater-ui:$IMAGE_TAG

  # TEMPORARY read-only diagnostic: the runner has no kubectl, so talk to the
  # Kubernetes API directly with the pod's service-account token. Read-only
  # (GET only), fails soft. Remove once the deploy issue is resolved.
  diagnose:
    runs-on: movietheater
    steps:
      - run: |
          set +e
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          if [ ! -f "$SA/token" ]; then
            echo "NO SERVICE-ACCOUNT TOKEN MOUNTED — runner cannot reach the kube API. Host-only."
            exit 0
          fi
          TOKEN=$(cat "$SA/token"); RUNNER_NS=$(cat "$SA/namespace"); API=https://kubernetes.default.svc
          AUTH="Authorization: Bearer $TOKEN"
          echo "runner service-account namespace: $RUNNER_NS"
          echo "=== GET pods in namespace 'movietheater' ==="
          code=$(curl -sk -o /tmp/pods.json -w "%{http_code}" -H "$AUTH" "$API/api/v1/namespaces/movietheater/pods")
          echo "HTTP $code"
          if [ "$code" = "403" ]; then echo "FORBIDDEN — runner's service account has no RBAC for the movietheater namespace. Host-only."; fi
          echo "--- pod names / phase / restarts / waiting-reason / images ---"
          grep -oE '"name":"movietheater[^"]*"|"phase":"[^"]*"|"restartCount":[0-9]+|"reason":"[^"]*"|"image":"[^"]*"' /tmp/pods.json 2>/dev/null | head -80
          echo "=== GET deployments in 'movietheater' ==="
          curl -sk -H "$AUTH" "$API/apis/apps/v1/namespaces/movietheater/deployments" 2>/dev/null | grep -oE '"name":"[^"]*"|"image":"[^"]*"|"replicas":[0-9]+|"readyReplicas":[0-9]+|"unavailableReplicas":[0-9]+' | head -50
          echo "=== done (if you see pods/deployments above, the runner CAN drive a restart; if 403/empty, it's host-only) ==="
