# MovieTheater Production Deployment
#
# Builds and deploys MovieTheater to MicroK8s with HTTPS via Let's Encrypt (DNS-01 / GoDaddy).
# IIS certificate renewal is fully automated by the Windows scheduled task registered via
# scripts/register-cert-renewal-task.ps1 — no manual steps required after first setup.
#
# Required GitHub Secrets:
#   MOVIETHEATER_APPSETTINGS_JSON  - Production appsettings.json content
#   GODADDY_API_KEY                - GoDaddy API key
#   GODADDY_API_SECRET             - GoDaddy API secret

name: MovieTheater Prod Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  docker-build-api:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - run: echo "$MOVIETHEATER_APPSETTINGS_JSON" > src/MovieTheater/appsettings.Production.json
        env:
          MOVIETHEATER_APPSETTINGS_JSON: ${{ secrets.MOVIETHEATER_APPSETTINGS_JSON }}
      - run: cd docker && bash build-api.sh
      - run: docker push localhost:32000/movietheater-api:$GITHUB_SHA

  docker-build-ui:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - run: cd docker && bash build-ui.sh
      - run: docker push localhost:32000/movietheater-ui:$GITHUB_SHA

  k8s-deploy:
    needs: [docker-build-api, docker-build-ui]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5

      - name: Enable nginx ingress
        run: microk8s enable ingress || true

      - name: Install cert-manager
        run: |
          if ! microk8s kubectl get deployment cert-manager -n cert-manager &>/dev/null; then
            microk8s kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.3/cert-manager.yaml
            sleep 10
          fi
          microk8s kubectl rollout status -n cert-manager deployment/cert-manager         --timeout=300s
          microk8s kubectl rollout status -n cert-manager deployment/cert-manager-webhook --timeout=300s

      - name: Install GoDaddy webhook
        shell: bash
        run: |
          # Remove old custom-named deployment if it exists — conflicts with official naming
          if microk8s kubectl get deployment cert-manager-webhook-godaddy -n cert-manager > /dev/null 2>&1; then
            microk8s kubectl delete deployment   cert-manager-webhook-godaddy              -n cert-manager --ignore-not-found=true
            microk8s kubectl delete service      cert-manager-webhook-godaddy              -n cert-manager --ignore-not-found=true
            microk8s kubectl delete serviceaccount cert-manager-webhook-godaddy            -n cert-manager --ignore-not-found=true
            microk8s kubectl delete clusterrole  cert-manager-webhook-godaddy:flowcontrol-solver --ignore-not-found=true
            microk8s kubectl delete clusterrolebinding cert-manager-webhook-godaddy:flowcontrol-solver --ignore-not-found=true
            microk8s kubectl delete role         cert-manager-webhook-godaddy:secret-reader -n cert-manager --ignore-not-found=true
            microk8s kubectl delete rolebinding  cert-manager-webhook-godaddy:secret-reader -n cert-manager --ignore-not-found=true
            microk8s kubectl delete certificate  cert-manager-webhook-godaddy-webhook-tls  -n cert-manager --ignore-not-found=true
            microk8s kubectl delete issuer       cert-manager-webhook-godaddy-selfsign      -n cert-manager --ignore-not-found=true
            microk8s kubectl delete secret       cert-manager-webhook-godaddy-webhook-tls  -n cert-manager --ignore-not-found=true
            microk8s kubectl delete apiservice   v1alpha1.acme.snowdrop.it                 --ignore-not-found=true
            sleep 10
          fi

          # Skip if official deployment is already healthy with APIService registered
          if microk8s kubectl get deployment godaddy-webhook -n cert-manager > /dev/null 2>&1; then
            READY=$(microk8s kubectl get deployment godaddy-webhook -n cert-manager \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            READY=${READY:-0}
            if [ "$READY" -gt 0 ] && microk8s kubectl get apiservice v1alpha1.acme.snowdrop.it > /dev/null 2>&1; then
              exit 0
            fi
            # Pod unhealthy or APIService missing — delete and redeploy cleanly
            curl -sSL https://raw.githubusercontent.com/snowdrop/godaddy-webhook/master/deploy/webhook-all.yml | \
              sed "s/acme.mycompany.com/acme.snowdrop.it/g" | \
              microk8s kubectl delete --ignore-not-found=true -f - || true
            sleep 5
          fi

          # Download and apply official webhook YAML
          if curl -sSL https://raw.githubusercontent.com/snowdrop/godaddy-webhook/master/deploy/webhook-all.yml \
              -o /tmp/webhook-all.yml; then
            sed "s/acme.mycompany.com/acme.snowdrop.it/g" /tmp/webhook-all.yml > /tmp/webhook-configured.yml
            if microk8s kubectl apply --validate=false -f /tmp/webhook-configured.yml; then
              if microk8s kubectl wait --for=condition=ready pod \
                  -l app.kubernetes.io/name=godaddy-webhook \
                  -n cert-manager --timeout=120s; then
                : # success
              else
                microk8s kubectl describe pod -n cert-manager -l app.kubernetes.io/name=godaddy-webhook | grep -A 15 "Events:" || true
                exit 1
              fi
            else
              exit 1
            fi
          else
            exit 1
          fi

      - name: Configure GoDaddy credentials
        env:
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
        run: |
          microk8s kubectl create secret generic godaddy-api-key \
            --from-literal=token="$GODADDY_API_KEY:$GODADDY_API_SECRET" \
            --namespace cert-manager \
            --dry-run=client -o yaml | microk8s kubectl apply -f -

      - name: Deploy ClusterIssuer
        shell: bash
        run: |
          # Wait for webhook's own TLS certificate (name varies by which attempt succeeded)
          for cert_name in godaddy-webhook-webhook-tls cert-manager-webhook-godaddy-webhook-tls; do
            if microk8s kubectl get certificate "$cert_name" -n cert-manager > /dev/null 2>&1; then
              microk8s kubectl wait --for=condition=Ready certificate/"$cert_name" \
                -n cert-manager --timeout=60s || true
              break
            fi
          done

          # Wait for the APIService to be available — required before ClusterIssuer will work
          for i in {1..60}; do
            if microk8s kubectl get apiservice v1alpha1.acme.snowdrop.it > /dev/null 2>&1; then
              AVAIL=$(microk8s kubectl get apiservice v1alpha1.acme.snowdrop.it \
                -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || echo "False")
              [ "$AVAIL" = "True" ] && break
            fi
            if [ $i -eq 60 ]; then
              echo "APIService not available after 2 minutes"
              microk8s kubectl get apiservice v1alpha1.acme.snowdrop.it -o yaml || true
              exit 1
            fi
            sleep 2
          done

          microk8s kubectl apply -f k8s/cert-issuer.yaml

          # Wait for ClusterIssuer to report Ready
          for i in {1..30}; do
            READY=$(microk8s kubectl get clusterissuer letsencrypt-prod \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
            [ "$READY" = "True" ] && break
            [ $i -eq 30 ] && echo "ClusterIssuer not ready after 60s" && exit 1
            sleep 2
          done

      - name: Create namespace
        run: microk8s kubectl create namespace movietheater --dry-run=client -o yaml | microk8s kubectl apply -f -

      - name: Deploy application
        run: |
          envsubst < k8s/deployment.yaml | microk8s kubectl apply -n movietheater -f -
          microk8s kubectl apply -n movietheater -f k8s/service.yaml
          microk8s kubectl apply -n movietheater -f k8s/ingress.yaml

      - name: Deploy certificate
        run: microk8s kubectl apply -n movietheater -f k8s/certificate.yaml

      - name: Wait for certificate
        run: |
          microk8s kubectl wait --for=condition=Ready certificate/movietheater-tls \
            -n movietheater --timeout=300s || {
            microk8s kubectl describe certificate movietheater-tls -n movietheater
            exit 1
          }

      - run: microk8s kubectl rollout status -n movietheater deployment/movietheater

