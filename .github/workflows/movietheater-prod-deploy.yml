name: MovieTheater Prod Deploy
on:
  push:
    branches:
      - master

jobs:
  setup:
    runs-on: movietheater
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

  docker-build-api:
    needs: [setup]
    runs-on: movietheater
    env:
      REGISTRY: registry.local:32500
      IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "$MOVIETHEATER_APPSETTINGS_JSON" > src/MovieTheater/appsettings.Production.json
        env:
          MOVIETHEATER_APPSETTINGS_JSON: ${{ secrets.MOVIETHEATER_APPSETTINGS_JSON }}
      - run: cd docker && bash build-api.sh
      - run: docker push $REGISTRY/movietheater-api:$IMAGE_TAG

  docker-build-ui:
    needs: [setup]
    runs-on: movietheater
    env:
      REGISTRY: registry.local:32500
      IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: cd docker && bash build-ui.sh
      - run: docker push $REGISTRY/movietheater-ui:$IMAGE_TAG

  # TEMPORARY: validate the secret JSON (catches malformed values that crash the
  # app at startup, e.g. a newline inside a string or duplicate keys). Prints only
  # the validation result, never the secret. Remove once stable.
  validate-config:
    runs-on: movietheater
    steps:
      - run: |
          printf '%s' "$MOVIETHEATER_APPSETTINGS_JSON" > /tmp/cfg.json
          echo "byte size: $(wc -c < /tmp/cfg.json)"
          python3 - <<'PY'
          import json
          def dup(pairs):
              seen=set(); d=[k for k,_ in pairs if (k in seen or seen.add(k))]
              if d: raise ValueError("DUPLICATE KEYS: "+", ".join(sorted(set(d))))
              return dict(pairs)
          try:
              json.load(open('/tmp/cfg.json'), object_pairs_hook=dup)
              print("RESULT: VALID JSON, no duplicate keys ✅")
          except Exception as e:
              print("RESULT: INVALID ❌ ->", type(e).__name__, str(e))
          PY
        env:
          MOVIETHEATER_APPSETTINGS_JSON: ${{ secrets.MOVIETHEATER_APPSETTINGS_JSON }}

  # TEMPORARY read-only diagnostic: the runner has no kubectl, so talk to the
  # Kubernetes API directly with the pod's service-account token. Read-only
  # (GET only), fails soft. Remove once the deploy issue is resolved.
  diagnose:
    runs-on: movietheater
    steps:
      - run: |
          set +e
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          if [ ! -f "$SA/token" ]; then
            echo "NO SERVICE-ACCOUNT TOKEN MOUNTED — runner cannot reach the kube API. Host-only."
            exit 0
          fi
          TOKEN=$(cat "$SA/token"); API=https://kubernetes.default.svc; AUTH="Authorization: Bearer $TOKEN"
          echo "=== WHY is the api container terminating? exit code / signal / limits / probes ==="
          curl -sk -H "$AUTH" "$API/api/v1/namespaces/movietheater/pods" -o /tmp/p.json
          python3 - <<'PY'
          import json
          for it in json.load(open('/tmp/p.json')).get('items',[]):
              n=it['metadata']['name']
              if 'runner' in n or 'posters-backup' in n: continue
              spec={c['name']:c for c in it['spec'].get('containers',[])}
              for c in it.get('status',{}).get('containerStatuses') or []:
                  if c['name']!='movietheater-api': continue
                  sc=spec.get(c['name'],{})
                  res=sc.get('resources',{})
                  probes=[p for p in ('livenessProbe','readinessProbe','startupProbe') if sc.get(p)]
                  ls=(c.get('lastState',{}).get('terminated') or {})
                  print(f"POD {n} tag={c.get('image','').split(':')[-1]} restarts={c.get('restartCount')}")
                  print(f"   limits={res.get('limits')} requests={res.get('requests')} probes={probes}")
                  print(f"   lastTerminated: exitCode={ls.get('exitCode')} signal={ls.get('signal')} reason={ls.get('reason')} msg={ls.get('message')}")
          PY
          echo "=== done ==="
