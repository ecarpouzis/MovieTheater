name: MovieTheater Prod Deploy
on:
  push:
    branches:
      - master

jobs:
  setup:
    runs-on: movietheater
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

  docker-build-api:
    needs: [setup]
    runs-on: movietheater
    env:
      REGISTRY: registry.local:32500
      IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "$MOVIETHEATER_APPSETTINGS_JSON" > src/MovieTheater/appsettings.Production.json
        env:
          MOVIETHEATER_APPSETTINGS_JSON: ${{ secrets.MOVIETHEATER_APPSETTINGS_JSON }}
      - run: cd docker && bash build-api.sh
      - run: docker push $REGISTRY/movietheater-api:$IMAGE_TAG

  docker-build-ui:
    needs: [setup]
    runs-on: movietheater
    env:
      REGISTRY: registry.local:32500
      IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: cd docker && bash build-ui.sh
      - run: docker push $REGISTRY/movietheater-ui:$IMAGE_TAG

  # TEMPORARY read-only diagnostic: the runner has no kubectl, so talk to the
  # Kubernetes API directly with the pod's service-account token. Read-only
  # (GET only), fails soft. Remove once the deploy issue is resolved.
  diagnose:
    runs-on: movietheater
    steps:
      - run: |
          set +e
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          if [ ! -f "$SA/token" ]; then
            echo "NO SERVICE-ACCOUNT TOKEN MOUNTED — runner cannot reach the kube API. Host-only."
            exit 0
          fi
          TOKEN=$(cat "$SA/token"); API=https://kubernetes.default.svc; AUTH="Authorization: Bearer $TOKEN"
          echo "=== CAN THIS RUNNER RESTART A DEPLOYMENT? (read-only permission check) ==="
          curl -sk -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "$API/apis/authorization.k8s.io/v1/selfsubjectaccessreviews" \
            -d '{"spec":{"resourceAttributes":{"namespace":"movietheater","verb":"patch","group":"apps","resource":"deployments"}}}' \
            | grep -oE '"allowed": ?(true|false)|"reason": ?"[^"]*"'
          echo "=== DEPLOYMENTS (name / ready / image) ==="
          curl -sk -H "$AUTH" "$API/apis/apps/v1/namespaces/movietheater/deployments" -o /tmp/deploy.json
          python3 - <<'PY' 2>/dev/null || grep -oE '"name": ?"[^"]*"|"image": ?"[^"]*"' /tmp/deploy.json | head -40
          import json
          for it in json.load(open('/tmp/deploy.json')).get('items',[]):
              n=it['metadata']['name']; st=it.get('status',{})
              imgs=[c['image'] for c in it['spec']['template']['spec']['containers']]
              print(f"DEPLOY {n}  ready={st.get('readyReplicas')}/{st.get('replicas')}  images={imgs}")
          PY
          echo "=== PODS (name / phase / restarts / waiting-reason / image) ==="
          curl -sk -H "$AUTH" "$API/api/v1/namespaces/movietheater/pods" -o /tmp/pods.json
          python3 - <<'PY' 2>/dev/null || grep -oE '"name": ?"[^"]*"|"phase": ?"[^"]*"|"restartCount": ?[0-9]+|"reason": ?"[^"]*"' /tmp/pods.json | head -60
          import json
          for it in json.load(open('/tmp/pods.json')).get('items',[]):
              n=it['metadata']['name']; ph=it.get('status',{}).get('phase')
              cs=it.get('status',{}).get('containerStatuses') or []
              if not cs: print(f"POD {n}  phase={ph}  (no containers yet)")
              for c in cs:
                  w=(c.get('state',{}).get('waiting') or {}).get('reason')
                  print(f"POD {n}  phase={ph}  restarts={c.get('restartCount')}  waiting={w}  image={c.get('image')}")
          PY
          echo "=== done ==="
