# GoDaddy cert-manager webhook for DNS-01 challenges.
# Source: https://github.com/snowdrop/godaddy-webhook
# Image:  ghcr.io/snowdrop/godaddy-webhook:latest

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-webhook-godaddy
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-webhook-godaddy:flowcontrol-solver
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
rules:
  - apiGroups:
      - flowcontrol.apiserver.k8s.io
    resources:
      - prioritylevelconfigurations
      - flowschemas
    verbs:
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-webhook-godaddy:flowcontrol-solver
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-webhook-godaddy:flowcontrol-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager-webhook-godaddy
    namespace: cert-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-godaddy:secret-reader
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-godaddy:secret-reader
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-godaddy:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager-webhook-godaddy
    namespace: cert-manager

---
apiVersion: v1
kind: Service
metadata:
  name: cert-manager-webhook-godaddy
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: cert-manager-webhook-godaddy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook-godaddy
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager-webhook-godaddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager-webhook-godaddy
    spec:
      serviceAccountName: cert-manager-webhook-godaddy
      containers:
        - name: cert-manager-webhook-godaddy
          # Try public images first (ghcr.io, quay.io, docker.io)
          # Workflow will test multiple registries and update this if found
          # Otherwise falls back to building from source
          image: "ghcr.io/snowdrop/godaddy-webhook:latest"
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
          env:
            - name: GROUP_NAME
              value: "acme.snowdrop.it"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: cert-manager-webhook-godaddy-webhook-tls

---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.acme.snowdrop.it
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
  annotations:
    cert-manager.io/inject-ca-from: "cert-manager/cert-manager-webhook-godaddy-webhook-tls"
spec:
  group: acme.snowdrop.it
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: cert-manager-webhook-godaddy
    namespace: cert-manager
  version: v1alpha1

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-webhook-godaddy-webhook-tls
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
spec:
  secretName: cert-manager-webhook-godaddy-webhook-tls
  duration: 8760h # 1 year
  issuerRef:
    name: cert-manager-webhook-godaddy-selfsign
  dnsNames:
  - cert-manager-webhook-godaddy
  - cert-manager-webhook-godaddy.cert-manager
  - cert-manager-webhook-godaddy.cert-manager.svc

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-manager-webhook-godaddy-selfsign
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-godaddy
spec:
  selfSigned: {}
