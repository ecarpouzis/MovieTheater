apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movietheater-ingress
  annotations:
    # Increase body size limit for poster/image uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

    # Reference to ClusterIssuer for certificate management
    # (Not strictly needed since Certificate resource explicitly references the issuer,
    #  but kept for clarity and potential cert-manager automation)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Use nginx ingress controller
  ingressClassName: nginx

  # TLS configuration
  tls:
  - hosts:
    - theater.carpouzis.com
    # Secret containing TLS certificate (created by cert-manager)
    secretName: movietheater-tls

  # Routing rules
  rules:
  - host: theater.carpouzis.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: movietheater
            port:
              number: 80
